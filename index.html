<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>もくもく部屋</title>
<meta name="description" content="一人でも集中できる、大学生向けもくもく学習タイマー">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="もくもく部屋">
<meta name="theme-color" content="#2b6a73">
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232b6a73'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f6f5;
    --card:#ffffff;
    --ink:#22302e;
    --sub:#52625f;
    --line:#e4e9e7;
    --accent:#2b6a73;
    --accent-soft:#e5f0ee;
    --green:#3f8f5f;
    --amber:#a3690f;
    --gray:#9aa5a2;
    --danger:#c65b4e;
    --radius:16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    padding-top:var(--safe-t);
  }
  header.top{
    padding:18px 18px 10px;
    position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg, var(--bg) 85%, transparent);
  }
  header.top h1{
    margin:0; font-size:20px; letter-spacing:.02em;
  }
  header.top p{
    margin:4px 0 0; font-size:13px; color:var(--sub);
  }
  main{
    flex:1;
    padding:4px 16px 90px;
  }
  section.tab{display:none;}
  section.tab.active{display:block; animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .panel-swap{animation:panelSwap .3s ease;}
  @keyframes panelSwap{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){
    section.tab.active, .panel-swap{animation:none;}
  }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:0 1px 2px rgba(20,30,28,.05);
    border:1px solid var(--line);
  }
  .card h2{
    margin:0 0 10px; font-size:14px; color:var(--sub); font-weight:600;
  }
  .pace-box{background:var(--accent-soft); border-radius:10px; padding:10px 12px; margin:0 0 10px; font-size:13px; line-height:1.7;}
  .pace-box .pace-recent{color:var(--sub);}
  .shared-state{font-size:13px; line-height:1.7; margin:0 0 8px;}
  .shared-state.error{color:var(--danger);}
  .shared-check{display:flex; align-items:center; gap:8px; font-size:13px; margin:8px 0 12px;}
  .shared-check input{width:18px; height:18px;}

  /* roster */
  .roster-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 2px;
    border-bottom:1px solid var(--line);
  }
  .roster-item:last-child{border-bottom:none;}
  .roster-item.self{background:var(--accent-soft); margin:0 -8px; padding:9px 8px; border-radius:10px; border-bottom:1px solid transparent;}
  .avatar{width:58px; height:58px; flex:0 0 auto; display:block;}
  .avatar-left{opacity:.55;}
  .avatar-pen{
    transform-origin:32px 28px;
    animation:writingWiggle .8s ease-in-out infinite alternate;
  }
  @keyframes writingWiggle{
    from{transform:translate(0,0) rotate(0deg);}
    to{transform:translate(-3.5px,2.5px) rotate(-14deg);}
  }
  .avatar-body-bob{
    transform-origin:24px 33px;
    animation:studyBob 1.2s ease-in-out infinite;
  }
  @keyframes studyBob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-1.8px);}
  }
  .avatar-eyes{
    transform-box:fill-box; transform-origin:center;
    animation:eyeBlink 4.4s ease-in-out infinite;
  }
  @keyframes eyeBlink{
    0%,92%,100%{transform:scaleY(1);}
    95%{transform:scaleY(.12);}
  }
  .avatar-hair{
    transform-box:fill-box; transform-origin:center;
    animation:hairSway 3.4s ease-in-out infinite alternate;
  }
  @keyframes hairSway{
    from{transform:rotate(-1.5deg);}
    to{transform:rotate(1.5deg);}
  }
  .avatar-mouth-talk{
    transform-box:fill-box; transform-origin:center;
    animation:mouthTalk .55s ease-in-out infinite alternate;
  }
  @keyframes mouthTalk{
    from{transform:scaleY(1);}
    to{transform:scaleY(.35);}
  }
  @media (prefers-reduced-motion: reduce){
    .avatar-pen, .avatar-body-bob, .avatar-eyes, .avatar-hair, .avatar-mouth-talk{animation:none;}
  }
  .r-info{flex:1; min-width:0;}
  .r-name{font-size:14.5px; font-weight:600; display:flex; gap:6px; align-items:baseline;}
  .r-name .tag{font-size:12px; font-weight:500; color:var(--accent); background:var(--accent-soft); padding:1px 6px; border-radius:6px;}

  .task-progress-line{font-size:13px; color:var(--sub); margin-bottom:6px;}
  .task-time-line{font-size:13px; font-weight:600; margin-bottom:6px; overflow-wrap:anywhere;}
  .task-time-line small{font-size:12px; font-weight:400; color:var(--sub);}
  .task-list{display:flex; flex-direction:column;}
  .task-row{display:flex; align-items:flex-start; gap:9px; padding:9px 2px; border-bottom:1px solid var(--line);}
  .task-row:last-child{border-bottom:none;}
  .task-row input[type="checkbox"]{width:19px; height:19px; flex:0 0 auto;}
  .view-hidden{display:none;}
  .plan-head{font-size:13px; font-weight:600; margin:0 0 4px;}
  .plan-note{font-size:13px; color:var(--sub); line-height:1.6; margin:0 0 8px;}
  .plan-day{border-bottom:1px solid var(--line); padding:8px 2px;}
  .plan-day:last-child{border-bottom:none;}
  .plan-day.today{background:var(--accent-soft); border-radius:8px; padding:8px; margin:0 -4px; border-bottom-color:transparent;}
  .plan-day.past{opacity:.6;}
  .plan-day-head{display:flex; gap:8px; align-items:center; font-weight:600; font-size:13.5px;}
  .plan-today-tag{font-size:12px; font-weight:600; color:#fff; background:var(--accent); padding:1px 7px; border-radius:6px;}
  .plan-rest{font-size:13.5px; color:var(--sub); margin:2px 0 0;}
  .plan-list{margin:3px 0 0; padding-left:1.15em; font-size:13px; line-height:1.6;}
  .plan-list li{margin:1px 0;}
  .plan-title{font-size:13px; font-weight:600; color:var(--sub); margin:12px 0 4px;}
  .task-body{flex:1; min-width:0;}
  .task-text{font-size:14px; font-weight:600;}
  .task-details{margin:3px 0 0; padding-left:1.15em; font-size:13.5px; color:var(--sub); line-height:1.6;}
  .task-details li{margin:1px 0;}
  .task-text.done{color:var(--sub); text-decoration:line-through;}
  .task-tag{font-size:12px; font-weight:500; color:var(--accent); background:var(--accent-soft); padding:1px 7px; border-radius:6px; flex:0 0 auto;}

  .schedule-thumbs{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .schedule-thumb{position:relative; width:72px; height:72px; border-radius:10px; overflow:hidden; border:1px solid var(--line); flex:0 0 auto;}
  .schedule-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .schedule-thumb .thumb-remove{
    position:absolute; top:2px; right:2px; width:24px; height:24px; border-radius:50%;
    border:none; background:rgba(0,0,0,.55); color:#fff; font-size:13px; line-height:24px;
    text-align:center; padding:0; cursor:pointer;
  }
  .r-meta{font-size:13px; color:var(--sub); margin-top:1px;}
  .r-status{font-size:13.5px; text-align:right; white-space:nowrap; color:var(--sub);}
  .r-status.studying{color:var(--green); font-weight:600;}
  .r-status.break{color:var(--amber);}
  .r-today{font-size:12px; color:var(--sub); text-align:right; margin-top:1px;}

  .room-summary{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .room-summary .count{font-size:26px; font-weight:700; color:var(--accent);}
  .room-summary .count span{font-size:13px; font-weight:500; color:var(--sub); margin-left:4px;}

  /* start buttons */
  .start-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .start-btn{
    background:var(--card); border:1.5px solid var(--line); border-top:3px solid var(--line); border-radius:16px;
    padding:28px 12px; text-align:center; font-size:16.5px; font-weight:700;
    color:var(--ink); cursor:pointer; font-family:inherit; appearance:none; -webkit-appearance:none;
    width:100%; min-height:88px;
  }
  .start-btn small{display:block; font-weight:500; font-size:13.5px; color:var(--sub); margin-top:5px;}
  .start-btn:active{background:var(--accent-soft); border-color:var(--accent); border-top-color:var(--accent);}

  .chip-row{display:flex; gap:9px; flex-wrap:wrap; margin:10px 0;}
  .chip{
    padding:11px 20px; border-radius:22px; border:1.5px solid var(--line);
    font-size:15.5px; font-weight:600; background:#fff; cursor:pointer; color:var(--ink);
    min-height:44px;
  }
  .chip.selected{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;}
  input.memo, select.memo{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-size:14px; margin:8px 0 12px; background:#fff; color:var(--ink); font-family:inherit;
  }
  /* 一問一答 */
  .ic-decks{display:flex; flex-direction:column; gap:8px; margin:6px 0 10px;}
  .ic-deck{
    display:flex; flex-direction:column; gap:2px; text-align:left; width:100%; padding:12px 14px;
    border-radius:13px; border:1.5px solid var(--line); background:#fff; color:var(--ink); font-family:inherit; cursor:pointer; min-height:56px;
  }
  .ic-deck.selected{border-color:var(--accent); background:var(--accent-soft);}
  .ic-deck:disabled{opacity:.5; cursor:default;}
  .ic-deck-title{font-size:14.5px; font-weight:700; line-height:1.4;}
  .ic-deck-meta{font-size:13px; color:var(--sub);}
  .ic-start-box{position:sticky; bottom:76px; z-index:5; background:var(--card); border:1.5px solid var(--accent); border-radius:14px; padding:10px 12px; margin:10px 0; box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .ic-start-sum{font-size:13.5px; color:var(--sub); margin-bottom:6px;}
  .ic-opts{border:1px solid var(--line); border-radius:14px; padding:6px 12px 10px; background:var(--bg);}
  .ic-opts-title{font-size:13px; font-weight:700; color:var(--sub); margin:6px 0 2px;}
  .ic-seg{display:flex; gap:4px; padding:4px; margin:0 0 10px; border-radius:16px; background:var(--line);}
  .ic-seg button{flex:1; border:0; border-radius:12px; padding:11px 8px; font-size:15px; font-weight:700; font-family:inherit; background:transparent; color:var(--sub); cursor:pointer; min-height:46px;}
  .ic-seg button.on{background:var(--card); color:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.12);}
  .ic-seg .ic-seg-n{display:inline-block; margin-left:4px; padding:0 7px; border-radius:10px; background:var(--danger); color:#fff; font-size:12px;}
  .mt-row{display:flex; flex-direction:column; gap:8px; padding:12px; margin:8px 0; border:1.5px solid var(--line); border-radius:14px; background:#fff;}
  .mt-row-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .mt-row-title{font-weight:700; font-size:15px; line-height:1.4;}
  .mt-row-sub{font-size:12.5px; color:var(--sub);}
  .mt-bar{height:8px; border-radius:6px; background:var(--line); overflow:hidden;}
  .mt-bar > span{display:block; height:100%; background:var(--green);}
  .mt-bar > span.low{background:var(--danger);}
  .mt-row-btns{display:flex; gap:8px;} .mt-row-btns .btn{flex:1; min-height:44px;}
  .ic-topbar{display:flex; align-items:center; gap:10px; margin:0 0 10px;} .ic-topbar .ic-result{flex:1; margin:0;} .ic-topbar .btn{flex:0 0 auto; min-width:96px; min-height:48px;}
  .ic-progress{display:flex; justify-content:space-between; gap:8px; font-size:13.5px; color:var(--sub); margin-bottom:8px;}
  .ic-q{font-size:16px; line-height:1.8; padding:12px 14px; border-radius:13px; background:var(--bg); border:1px solid var(--line);}
  .ic-ans{font-size:16px; line-height:1.8; padding:12px 14px; margin-top:10px; border-radius:13px; background:var(--accent-soft); border:1px solid var(--accent); font-weight:600;}
  .ic-ox{font-size:28px; min-height:64px; background:var(--line); color:var(--ink);}
  .ic-ox.picked{background:var(--accent); color:#fff;}
  .ic-result{margin-top:12px; padding:10px 14px; border-radius:12px; font-size:15px;}
  .ic-result.good{background:#e6f3ea; color:var(--green);}
  .ic-result.bad{background:#fbe9e6; color:var(--danger);}
  u.ic-miss{font-size:inherit; line-height:inherit; text-decoration:underline; text-decoration-color:var(--danger); text-decoration-thickness:3px; text-underline-offset:4px; background:rgba(198,91,78,.12); border-radius:3px; padding:0 1px;}
  .ic-fix{display:inline; font-size:inherit; color:var(--green); font-weight:700; margin-left:2px;}
  .mt-optx{margin:-2px 0 4px 10px; padding:8px 12px; border-left:4px solid var(--line); background:var(--bg); border-radius:0 10px 10px 0; font-size:13.5px; line-height:1.7; white-space:pre-wrap;} .mt-optx.ok{border-left-color:var(--green);} .mt-optx.post{margin:8px 0 0; font-size:13px; color:var(--sub);}
  .mt-expbtn{margin-top:6px;}
  .mt-opt{white-space:normal; line-height:1.55;} .mt-opt.good{border-color:var(--green); color:var(--green); font-weight:700;} .mt-opt.bad{border-color:var(--danger); color:var(--danger);}
  .ic-errs{margin-top:10px; display:flex; flex-direction:column; gap:8px;}
  .ic-err{border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; background:var(--card);}
  .ic-err-fix{display:flex; flex-direction:column; gap:2px; font-size:14.5px; line-height:1.6;}
  .ic-err-fix small{font-size:11.5px; color:var(--sub); margin-right:2px;}
  .ic-err-x s{color:var(--danger); text-decoration-thickness:2px;} .ic-err-o b{color:var(--green);}
  .ic-err-arrow{display:none;}
  .ic-err-why{font-size:13.5px; line-height:1.75; margin-top:4px; color:var(--ink);}
  .ic-err-note{font-size:12.5px; color:var(--sub); margin:0;}
  .ic-orig{margin-top:8px;} .ic-orig summary{cursor:pointer; font-size:13px; color:var(--accent); font-weight:600;}
  .ic-reason{font-size:13.5px; line-height:1.7; color:var(--ink); margin-top:6px;}
  .ic-wrong{padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.6;}
  .ic-label{display:inline-block; min-width:1.6em; margin-right:8px; padding:0 6px; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; text-align:center;}
  .ic-score{font-size:20px; margin:4px 0;}
  .ic-q ruby rt, .ic-ans ruby rt, .ic-wrong ruby rt{font-size:.55em;}

  .field-label{font-size:13px; font-weight:600; color:var(--sub); margin:2px 0 2px;}
  .row-btns{display:flex; gap:10px;}
  .btn{
    flex:1; padding:15px; border-radius:13px; border:none; font-size:16.5px; font-weight:700; cursor:pointer;
    min-height:50px;
  }
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.ghost{background:var(--line); color:var(--ink);}
  .btn.danger{background:#fbe9e6; color:var(--danger);}
  .btn.block{width:100%;}

  /* active session */
  .timer-wrap{display:flex; flex-direction:column; align-items:center; padding:10px 0 4px;}
  .timer-ring{
    width:190px; height:190px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--accent-soft) 0);
    margin-bottom:14px;
  }
  .timer-ring.overtime{
    background:conic-gradient(var(--green) 100%, var(--green) 0);
    animation:overtimePulse 1.6s ease-in-out infinite;
  }
  .timer-ring.overtime .timer-label{color:var(--green); font-weight:600;}
  @keyframes overtimePulse{
    0%,100%{box-shadow:0 0 0 0 rgba(63,143,95,.35);}
    50%{box-shadow:0 0 0 10px rgba(63,143,95,0);}
  }
  @media (prefers-reduced-motion: reduce){
    .timer-ring.overtime{animation:none;}
  }
  .timer-ring .inner{
    width:158px; height:158px; border-radius:50%; background:var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .timer-clock{font-size:34px; font-weight:700; font-variant-numeric:tabular-nums;}
  .timer-label{font-size:13.5px; color:var(--sub); margin-top:2px;}
  .timer-meta{font-size:13.5px; color:var(--sub); margin-bottom:14px; text-align:center;}
  .timer-meta b{color:var(--ink);}

  /* ranking */
  .rank-row{display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-gap{text-align:center; color:var(--sub); line-height:1; padding:2px 0;}
  .rank-toggle{margin-top:8px;}
  .subj-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:14px 0 6px;}
  .subj-chips{display:flex; gap:6px;} .subj-total{font-size:13px; color:var(--sub); margin:0 0 4px;}
  .rank-row.self{background:var(--accent-soft); margin:0 -8px; padding:11px 8px; border-radius:10px;}
  .rank-num{width:24px; font-weight:700; color:var(--sub); font-size:15px; text-align:center;}
  .rank-row:nth-child(1) .rank-num{color:#c98a2a; font-size:17px;}
  .rank-row:nth-child(2) .rank-num{color:#8a9199; font-size:16px;}
  .rank-row:nth-child(3) .rank-num{color:#a56a3a; font-size:16px;}
  .rank-name{flex:1; font-size:15px;}
  .rank-min{font-size:15.5px; font-weight:700;}
  .banner{
    background:linear-gradient(135deg,#fff7e6,#fff);
    border:1px solid #f0d9a6; border-radius:12px; padding:10px 12px;
    font-size:13.5px; margin-bottom:12px; color:#8a5a10;
  }

  /* week chart */
  .week-banner{border-radius:12px; padding:12px 14px; font-size:13.5px; margin-bottom:12px;}
  .week-banner.up{background:#eaf6ee; color:var(--green); border:1px solid #cdeed7;}
  .week-banner.flat{background:var(--accent-soft); color:var(--accent); border:1px solid #cfe4e1;}
  svg text{font-family:inherit;}
  .legend{display:flex; gap:16px; font-size:13px; color:var(--sub); margin-top:6px; justify-content:center;}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}

  /* data tab */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:4px;}
  .stat-box{background:var(--accent-soft); border-radius:12px; padding:12px; text-align:center;}
  .stat-box .num{font-size:20px; font-weight:700; color:var(--accent);}
  .stat-box .lbl{font-size:12.5px; color:var(--sub); margin-top:2px;}
  .hist-item{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:6px 2px; border-bottom:1px solid var(--line); color:var(--sub);}
  .hist-item:last-child{border-bottom:none;}
  .hist-item .hist-main{flex:1; min-width:0; display:flex; justify-content:space-between; gap:8px;}
  .hist-item b{color:var(--ink); font-weight:600; white-space:nowrap;}
  .hist-del{
    flex:0 0 auto; background:none; border:none; color:var(--sub); font-size:17px;
    line-height:1; padding:8px 6px; cursor:pointer;
  }
  .hist-del:hover, .hist-del:active{color:var(--danger);}
  .hist-toggle{margin-top:8px; min-height:44px; padding:10px; font-size:14px;}
  .streak-line{font-size:13px; color:var(--amber); font-weight:600; margin:2px 0 8px;}
  .milestone-note{color:var(--amber); font-weight:600; font-size:14px;}
  .config-note{font-size:12.5px; color:var(--sub); line-height:1.6; margin-top:4px;}
  .config-note code{background:var(--bg); padding:1px 5px; border-radius:4px; font-family:ui-monospace,monospace; font-size:12px;}

  /* nav */
  nav.tabbar{

(function(){

    { id:"r9", name:"松本 悠人", grade:"理学部3年",   goal:"大学院入試(理学研究科)対策", mult:1.20 },

  /* ============ ユーティリティ ============ */

  function pad(n){ return String(n).padStart(2,"0"); }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayDate(){ return new Date(); }
  function todayStr(){ return dateKey(todayDate()); }

  function mondayOf(d){
    const day = (d.getDay()+6)%7; // Mon=0 ... Sun=6
    const m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    m.setDate(m.getDate()-day);
    return m;
  }
  function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }

  function hashStr(s){
    let h = 2166136261;
    for(let i=0;i<s.length;i++){
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function formatMinutes(min){
    min = Math.max(0, Math.round(min));
    if(min < 60) return min+"分";
    const h = Math.floor(min/60), m = min%60;
    return h+"時間"+(m ? m+"分" : "");
  }
  function formatClock(totalSeconds){
    totalSeconds = Math.max(0, Math.round(totalSeconds));
    const m = Math.floor(totalSeconds/60), s = totalSeconds%60;
    return pad(m)+":"+pad(s);
  }

  /* ============ 記録データ ============ */

  function loadRecords(){

  function addRecord(rec){
    const list = loadRecords();
    list.push(rec);
    saveRecords(list);
    return list;
  }
  function recordsOn(dateStr){
    return loadRecords().filter(r=>r.date===dateStr);
  }
  function sumMinutes(list){
    return list.reduce((a,r)=>a+(r.actualMinutes||0),0);
  }
  function selfMinutesForDate(dateStr){
    return sumMinutes(recordsOn(dateStr));
  }
  function selfMinutesForRange(dateStrList){
    return dateStrList.reduce((a,ds)=>a+selfMinutesForDate(ds),0);
  }

  function currentStreak(){
    const daysWithStudy = new Set(
      loadRecords().filter(r=>r.actualMinutes>0).map(r=>r.date)
    );
    let cursor = todayDate();
    if(!daysWithStudy.has(dateKey(cursor))){
      cursor = addDays(cursor, -1); // 今日はまだでも、連続記録はリセットしない
    }
    let streak = 0;
    while(daysWithStudy.has(dateKey(cursor))){
      streak++;
      cursor = addDays(cursor, -1);
    }
    return streak;
  }

  function totalCompletedUnits(){

  // prevTotal→newTotalの間でまたいだ節目のうち、最大のものを返す(なければnull)。
  function crossedMilestone(prevTotal, newTotal, milestones){
    let crossed = null;
    milestones.forEach(m=>{ if(prevTotal < m && newTotal >= m) crossed = m; });
    return crossed;
  }

  /* ============ ライバル・シミュレーション ============ */

  const scheduleCache = {};
  function rivalDayFactor(rivalId, dateStr){
    const rng = mulberry32(hashStr(rivalId+"|"+dateStr+"|factor"));
    return 0.6 + rng()*0.7; // 0.6〜1.3 の日ごとのばらつき
  }
  function rivalDailyTarget(rival, dateStr){
    const factor = rivalDayFactor(rival.id, dateStr);
    const target = BASELINE_AVG_MINUTES * rival.mult * factor;
    return Math.max(20, Math.min(480, Math.round(target)));
  }
  function rivalSchedule(rival, dateStr){
    const key = rival.id+"|"+dateStr;
    if(scheduleCache[key]) return scheduleCache[key];

    const rng = mulberry32(hashStr(rival.id+"|"+dateStr+"|sched"));
    const target = rivalDailyTarget(rival, dateStr);
    const numBlocks = 2 + Math.floor(rng()*3); // 2〜4

    const weights = [];
    for(let i=0;i<numBlocks;i++) weights.push(0.4+rng());
    const wsum = weights.reduce((a,b)=>a+b,0);
    const lens = weights.map(w=>Math.max(12, Math.round(target*(w/wsum))));

    // 夜型(nightOwl)は15:00〜翌3:00の枠で活動する。分は日付をまたいで1440超まで伸びる。
    const WINDOW_START = rival.nightOwl ? 15*60 : 8*60+30;
    const WINDOW_END = rival.nightOwl ? 27*60 : 23*60+30;

    // 開始位置を日中に幅広く散らし、講義・部活・空き時間など「退席中」の時間帯が
    // 一日の大半を占めるようにする(常に埋まって見えると比較がしんどくなるため)。
    let cursor = WINDOW_START + Math.floor(rng()*(WINDOW_END-WINDOW_START)*0.25);
    const blocks = [];
    for(let i=0;i<lens.length;i++){
      let start = cursor;
      let end = start + lens[i];
      if(start >= WINDOW_END) break;
      if(end > WINDOW_END) end = WINDOW_END;
      if(end > start) blocks.push({start,end});
      const gap = 15 + Math.floor(rng()*60);
      cursor = end + gap;
    }
    scheduleCache[key] = blocks;
    return blocks;
  }

  // どの時間に開いても、必ず誰かが勉強している状態にする(架空のライバルなので、学習時間の整合は厳密にしない)。
  // 50分ごとの枠で、その時間に「必ず勉強中」にする人を決め、本来のスケジュールが退室中・休憩中でも勉強中にする。
  // 枠ごとの顔ぶれは、枠の番号から決めるので、同じ時刻なら、リロードしても同じ。
  const RIVAL_MIN_STUDYING = 2;
  const RELIEF_SLOT_MS = 50*60*1000;
  const reliefCache = {};
  function reliefSlotOf(now){ return Math.floor(now.getTime() / RELIEF_SLOT_MS); }
  function reliefStudyingIds(now){
    const slot = reliefSlotOf(now);
    if(reliefCache[slot]) return reliefCache[slot];
    const rng = mulberry32(hashStr("relief|"+slot));
    const order = RIVALS.map(r=>r.id);
    for(let i=order.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const ids = new Set(order.slice(0, RIVAL_MIN_STUDYING));
    reliefCache[slot] = ids;
    return ids;
  }

  function rivalStatusAt(rival, now){
    const base = rivalScheduledStatusAt(rival, now);
    if(base.status !== "studying" && reliefStudyingIds(now).has(rival.id)){
      const slot = reliefSlotOf(now);
      const sinceSlot = (now.getTime() - slot*RELIEF_SLOT_MS) / 60000;
      const head = hashStr(rival.id+"|"+slot+"|head") % 25; // 全員が同時に「0分」にならないよう、開始のずれをつける
      const elapsed = Math.round(sinceSlot + head);
      return { status:"studying", elapsed, todayMinutes: base.todayMinutes + elapsed };
    }
    return base;
  }

  function rivalScheduledStatusAt(rival, now){
    const hour = now.getHours();
    let schedDateStr, nowMin;
    if(rival.nightOwl && hour < 4){
      // 深夜0時〜3時台は、前日から続く夜型スケジュールの延長として扱う
      schedDateStr = dateKey(addDays(now, -1));
      nowMin = hour*60 + now.getMinutes() + now.getSeconds()/60 + 1440;
    } else {
      schedDateStr = dateKey(now);
      nowMin = hour*60 + now.getMinutes() + now.getSeconds()/60;
    }
    const schedule = rivalSchedule(rival, schedDateStr);

    let completed = 0;
    let status = "left";
    let elapsed = 0;

    for(let i=0;i<schedule.length;i++){
      const b = schedule[i];
      if(nowMin < b.start){
        status = (i===0) ? "left" : "break";
        break;
      } else if(nowMin <= b.end){
        status = "studying";
        elapsed = nowMin - b.start;
        completed += elapsed;
        break;
      } else {
        completed += (b.end - b.start);
        if(i === schedule.length-1) status = "left";
      }
    }
    return { status, elapsed: Math.round(elapsed), todayMinutes: Math.round(completed) };
  }

  function rivalMinutesForDate(rival, dateStr){
    if(dateStr > todayStr()) return 0;
    if(dateStr < todayStr()) return rivalDailyTarget(rival, dateStr);
    // today: use current elapsed simulation
    return rivalStatusAt(rival, todayDate()).todayMinutes;
  }

  function typeLabel(t){ return t==="assignment" ? "大学の課題" : "資格の勉強"; }

  // status: "studying" | "break" | "left" のイラスト風アバターSVGを返す

  function renderRoom(skipStartPanel){
    const now = todayDate();
    const active = getActive();

    // roster: 架空ライバル(表示ON時)と、共有部屋の友だちを同じ形に揃えて並べる
    const others = [];
    if(!shared || shared.showRivals){
      RIVALS.forEach(r=>others.push({

      }));
    }
    sharedFriends().forEach(f=>others.push({
      key:f.uid, name:f.name, meta:"共有部屋の友だち", s:f.s
    }));
    others.sort((a,b)=>{
      const order = {studying:0, break:1, left:2};
      if(order[a.s.status] !== order[b.s.status]) return order[a.s.status]-order[b.s.status];

    let studyingCount = others.filter(x=>x.s.status==="studying").length;

            <div class="r-status studying">勉強中（${Math.round(elapsedMin)}分経過）</div>

        <div class="roster-item self">
          ${avatarSVG("break", "self")}
          <div class="r-info">
            <div class="r-name">あなた</div>
            <div class="r-meta">まだ入室していません</div>
          </div>
          <div>
            <div class="r-status break">休憩中</div>
            <div class="r-today">今日 ${formatMinutes(selfMinutesForDate(todayStr()))}</div>
          </div>

    }

    const rosterRows = others.map(({key,name,meta,s})=>{
      let statusText, statusClass;
      if(s.status==="studying"){ statusText = `勉強中（${s.elapsed}分経過）`; statusClass="studying"; }
      else if(s.status==="break"){ statusText = "休憩中"; statusClass="break"; }
      else { statusText = "退室中"; statusClass="left"; }
      return `
        <div class="roster-item">
          ${avatarSVG(s.status, key)}

            <div class="r-name">${esc(name)}</div>
            <div class="r-meta">${esc(meta)}</div>
          </div>
          <div>
            <div class="r-status ${statusClass}">${statusText}</div>
            <div class="r-today">今日 ${formatMinutes(s.todayMinutes)}</div>
          </div>
        </div>`;
    }).join("");

    const streak = currentStreak();
    document.getElementById("room-roster").innerHTML = `
      <div class="room-summary">
        <div class="count">${studyingCount}<span>人が勉強中</span></div>
        <div style="font-size:13px; color:var(--sub);">部屋の人数 ${others.length+1}人</div>
      </div>
      ${streak > 0 ? `<div class="streak-line">🔥 連続 ${streak}日 入室中</div>` : ""}
      ${selfStatusHtml}
      ${rosterRows}
    `;

    document.getElementById("header-sub").textContent =
      `今 ${studyingCount}人が集中してもくもく勉強中です`;

    // 友だちの更新で入力中のメモを消さないよう、開始パネルは必要なときだけ描き直す
    if(!skipStartPanel) renderStartPanel(active);
  }

  let lastStartPanelMode = null;
  function renderStartPanel(active){
    const el = document.getElementById("room-start");
    const mode = active ? "active" : (uiState === "picking" ? "picking" : "idle");
    let content;

    if(active){
      const plannedSec = active.plannedMinutes*60;
      const elapsedSec = (Date.now()-active.startedAt)/1000;
      const remainSec = plannedSec - elapsedSec;
      const isOvertime = remainSec <= 0;
      const pct = isOvertime ? 100 : (elapsedSec/plannedSec)*100;
      const clockText = isOvertime ? "+"+formatClock(elapsedSec-plannedSec) : formatClock(remainSec);
      const labelText = isOvertime ? "目標達成、延長中" : "残り時間";
      content = `
        <div class="timer-wrap">
          <div class="timer-ring${isOvertime ? " overtime" : ""}" style="--pct:${pct}">

        ` : ""}
        <input class="memo" id="memo-input" maxlength="40" placeholder="メモ（任意・例：線形代数の課題）" value="${esc(pending.note)}" enterkeyhint="done" autocomplete="off">

        <h2>タップして勉強を開始</h2>

  /* ============ 描画: ランキングタブ ============ */

  function buildRankingData(){
    const monday = mondayOf(todayDate());
    const weekDatesUpToToday = [];
    for(let i=0;i<7;i++){
      const d = addDays(monday,i);
      const ds = dateKey(d);
      if(ds > todayStr()) break;
      weekDatesUpToToday.push(ds);
    }
    const todayList = [{name:"あなた", isSelf:true, min: selfMinutesForDate(todayStr())}];
    const weekList  = [{name:"あなた", isSelf:true, min: selfMinutesForRange(weekDatesUpToToday)}];
    if(!shared || shared.showRivals){
      RIVALS.forEach(r=>{
        todayList.push({name:r.name, isSelf:false, min: rivalMinutesForDate(r, todayStr())});
        weekList.push({name:r.name, isSelf:false, min: weekDatesUpToToday.reduce((a,ds)=>a+rivalMinutesForDate(r,ds),0)});
      });
    }
    sharedFriends().forEach(f=>{
      todayList.push({name:f.name, isSelf:false, min:f.s.todayMinutes});
      weekList.push({name:f.name, isSelf:false, min:f.weekMinutes});
    });
    todayList.sort((a,b)=>b.min-a.min);
    weekList.sort((a,b)=>b.min-a.min);
    return { todayList, weekList };
  }

  // ランキングは、ふだんは上位3人だけ。自分が4位以降のときは、自分の行も下に出す。「全員を表示」で全部開く。
  const RANK_TOP = 3;
  const rankExpanded = { today: false, week: false };
  function rankRowHtml(item, i){
    return `
      <div class="rank-row ${item.isSelf?'self':''}">
        <div class="rank-num">${i+1}</div>
        <div class="rank-name">${esc(item.name)}</div>
        <div class="rank-min">${formatMinutes(item.min)}</div>
      </div>`;
  }
  function renderRankRows(list, key){
    if(rankExpanded[key] || list.length <= RANK_TOP){
      return list.map(rankRowHtml).join("") + (list.length > RANK_TOP ? `<button type="button" class="btn ghost block rank-toggle" data-action="rank-toggle" data-key="${key}">上位${RANK_TOP}人だけ表示 ▲</button>` : "");
    }
    const selfIdx = list.findIndex(x=>x.isSelf);
    let html = list.slice(0, RANK_TOP).map(rankRowHtml).join("");
    if(selfIdx >= RANK_TOP) html += `<div class="rank-gap" aria-hidden="true">⋮</div>` + rankRowHtml(list[selfIdx], selfIdx);
    return html + `<button type="button" class="btn ghost block rank-toggle" data-action="rank-toggle" data-key="${key}">全員を表示（あと${list.length - RANK_TOP}人）▼</button>`;
  }

  function renderRanking(){
    const { todayList, weekList } = buildRankingData();
    document.getElementById("rank-today").innerHTML = renderRankRows(todayList, "today");
    document.getElementById("rank-week").innerHTML = renderRankRows(weekList, "week");

    const selfToday = todayList.find(x=>x.isSelf).min;
    const banner = document.getElementById("ranking-banner");
    if(selfToday > BASELINE_AVG_MINUTES){
      banner.innerHTML = `<div class="banner">🎉 今日はもう ${formatMinutes(selfToday)} 勉強しました。大学生の平均（目安 ${BASELINE_AVG_MINUTES}分/日）を超えました！</div>`;
    } else {
      banner.innerHTML = "";
    }
  }

  /* ============ 描画: 今週タブ ============ */

  const WEEKDAY_LABELS = ["月","火","水","木","金","土","日"];

  function renderWeek(){
    const monday = mondayOf(todayDate());
    const lastMonday = addDays(monday,-7);
    const thisWeek = [], lastWeek = [];
    for(let i=0;i<7;i++){
      const dsThis = dateKey(addDays(monday,i));
      const dsLast = dateKey(addDays(lastMonday,i));
      thisWeek.push(dsThis > todayStr() ? null : selfMinutesForDate(dsThis));
      lastWeek.push(selfMinutesForDate(dsLast));
    }
    const thisTotal = thisWeek.reduce((a,v)=>a+(v||0),0);
    const lastTotal = lastWeek.reduce((a,v)=>a+(v||0),0);
    const diff = thisTotal - lastTotal;

    const bannerEl = document.getElementById("week-banner");
    if(diff > 0){
      bannerEl.innerHTML = `<div class="week-banner up">📈 先週より <b>+${formatMinutes(diff)}</b> 増えています。その調子です！（今週 ${formatMinutes(thisTotal)} / 先週 ${formatMinutes(lastTotal)}）</div>`;
    } else if(diff === 0 && thisTotal>0){
      bannerEl.innerHTML = `<div class="week-banner flat">先週と同じペースです（${formatMinutes(thisTotal)}）。無理せず、コツコツ続けていきましょう。</div>`;
    } else {
      bannerEl.innerHTML = `<div class="week-banner flat">先週は ${formatMinutes(lastTotal)} でした。今週はまだ ${formatMinutes(thisTotal)} ですが、焦らずマイペースにいきましょう。</div>`;
    }

    document.getElementById("week-chart").innerHTML = buildWeekChartSVG(thisWeek, lastWeek);
    renderWeekSubjects();
    renderWeekReview();
  }

  // 教科別の勉強時間(グラフのすぐ下): 今日／今週を切り替えて、どの教科にどれだけ使ったかを棒で見せる
  let subjView = "week";
  function renderWeekSubjects(){
    const el = document.getElementById("week-subjects");
    if(!el) return;
    const r = subjView === "today" ? { from: todayStr(), to: todayStr() } : weekRange(0);
    const by = {};
    let total = 0;
    loadRecords().forEach(x=>{
      if(typeof x.date !== "string" || x.date < r.from || x.date > r.to) return;
      const m = Number(x.actualMinutes) || 0; if(m <= 0) return;
      const k = x.subject || "教科なし";
      by[k] = (by[k] || 0) + m; total += m;
    });
    const rows = Object.keys(by).map(k=>({ k, m: by[k] })).sort((a,b)=>b.m - a.m);
    const max = rows.length ? rows[0].m : 0;
    el.innerHTML = `<div class="subj-head"><b>教科別の勉強時間</b>
        <span class="subj-chips">${[["today", "今日"], ["week", "今週"]].map(([v, l])=>`<button type="button" class="chip sm${subjView === v ? " selected" : ""}" data-action="subj-view" data-v="${v}" aria-pressed="${subjView === v}">${l}</button>`).join("")}</span></div>
      ${rows.length ? `<div class="subj-total">合計 ${formatMinutes(total)}</div>` + rows.map(x=>`<div class="kk-bar-row kk-bar-wide"><span class="kk-bar-l">${esc(x.k)}</span><span class="kk-bar-t"><span class="kk-bar-f" style="width:${Math.round(x.m / max * 100)}%"></span></span><span class="kk-bar-v">${formatMinutes(x.m)}</span></div>`).join("")
        : `<p class="config-note">${subjView === "today" ? "今日" : "今週"}の記録は、まだありません。</p>`}`;
  }

  /* ============ 今週のふり返り(この端末の記録から、先週と比べて1画面にまとめる) ============ */
  function weekRange(offset){   // offset 0=今週, -1=先週(月曜〜日曜)
    const mon = addDays(mondayOf(todayDate()), offset * 7);
    return { from: dateKey(mon), to: dateKey(addDays(mon, 6)) };
  }
  function weekStats(r){
    const inR = d => typeof d === "string" && d >= r.from && d <= r.to;
    let minutes = 0, units = 0;
    const days = new Set();
    loadRecords().forEach(x=>{
      if(!inR(x.date)) return;
      minutes += Number(x.actualMinutes) || 0;
      units += Number.isInteger(x.completedUnits) ? x.completedUnits : 0;
      if((Number(x.actualMinutes) || 0) > 0) days.add(x.date);
    });
    let tasks = 0;
    try{
      for(let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if(k && k.indexOf("mokumoku_taskStatus_v1_") === 0 && inR(k.slice("mokumoku_taskStatus_v1_".length))){
          const o = JSON.parse(localStorage.getItem(k) || "{}") || {};
          tasks += Object.keys(o).filter(id=>o[id]).length;
        }
      }
    }catch(e){}
    let answered = 0, correct = 0;
    const wrongByIssue = {};
    kqLoad().forEach(a=>{
      if(!inR(String(a.ts).slice(0, 10))) return;
      answered++; if(a.ok) correct++; else wrongByIssue[a.issue] = (wrongByIssue[a.issue] || 0) + 1;
    });
    icLoad().sessions.forEach(s=>{
      if(!inR(s.date)) return;
      (s.rows || []).forEach(x=>{ answered++; if(x.ok) correct++; });
    });
    return { minutes, units, days: days.size, tasks, answered, correct, wrongByIssue };
  }
  function renderWeekReview(){
    const el = document.getElementById("week-review");
    if(!el) return;
    const cur = weekStats(weekRange(0)), prev = weekStats(weekRange(-1));
    const diff = (a, b, fmt, unit) => {
      const d = a - b;
      if(!d) return `<small class="wr-flat">先週と同じ</small>`;
      return `<small class="${d > 0 ? "wr-up" : "wr-down"}">${d > 0 ? "▲" : "▼"} 先週より ${fmt(Math.abs(d))}${unit || ""}</small>`;
    };
    const rate = s => s.answered ? Math.round(s.correct / s.answered * 100) : null;
    const rc = rate(cur), rp = rate(prev);
    // いちばん間違えたテーマ(国際関係ブリーフ): 回の題名は、端末に保存した一覧から引く
    let theme = "";
    const top = Object.keys(cur.wrongByIssue).sort((a, b) => cur.wrongByIssue[b] - cur.wrongByIssue[a])[0];
    if(top){
      let idx = null; try{ idx = JSON.parse(kkCacheGet("index") || "null"); }catch(e){}
      const it = idx && (idx.items || []).find(x=>String(x.n) === String(top));
      theme = `<p class="wr-theme">いちばん間違えたテーマ: <b>第${esc(top)}回${it && it.theme ? " " + esc(it.theme) : ""}</b>（×${cur.wrongByIssue[top]}回）</p>`;
    }
    el.innerHTML = `<h2>今週のふり返り</h2>
      <div class="wr-grid">
        <div class="wr-tile"><span>勉強時間</span><b>${formatMinutes(cur.minutes)}</b>${diff(cur.minutes, prev.minutes, formatMinutes)}</div>
        <div class="wr-tile"><span>勉強した日</span><b>${cur.days}日</b>${diff(cur.days, prev.days, n=>n, "日")}</div>
        <div class="wr-tile"><span>完了コマ数</span><b>${cur.units}コマ</b>${diff(cur.units, prev.units, n=>n, "コマ")}</div>
        <div class="wr-tile"><span>完了タスク</span><b>${cur.tasks}件</b>${diff(cur.tasks, prev.tasks, n=>n, "件")}</div>
        <div class="wr-tile wr-wide"><span>問題の正答率（国際関係・一問一答）</span><b>${rc === null ? "-" : rc + "%"}</b><small>${cur.answered ? `${cur.correct}/${cur.answered}問` : "まだ回答がありません"}${rc !== null && rp !== null ? `　${rc >= rp ? "▲" : "▼"} 先週 ${rp}%` : ""}</small></div>
      </div>
      ${theme}
      <p class="config-note">月曜はじまりの1週間で数えています。完了タスクは、この端末でチェックした分です。</p>`;
  }

  function buildWeekChartSVG(thisWeek, lastWeek){
    const W = 320, H = 200;
    const padL = 44, padR = 10, padB = 26, padT = 12;
    const chartH = H - padB - padT;
    const groupW = (W - padL - padR) / 7;
    const dataMax = Math.max(1, ...thisWeek.filter(v=>v!=null), ...lastWeek);
    // 目盛りは「きりのよい時間」で4本前後にする。最大値が一番上の目盛りに収まるよう、軸の上限をそろえる
    const step = [10, 15, 30, 60, 120, 180, 240, 360].find(s => dataMax / s <= 4) || 480;
    const maxVal = Math.ceil(dataMax / step) * step;
    const barW = groupW*0.30;
    const tickLabel = m => m === 0 ? "0" : (m < 60 ? m + "分" : (m % 60 === 0 ? (m / 60) + "時間" : (m / 60) + "時間"));
    let grid = "";
    for(let m = 0; m <= maxVal; m += step){
      const y = padT + chartH - (m / maxVal) * chartH;
      grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--line)" ${m === 0 ? "" : 'stroke-dasharray="3 3"'}/>`
        + `<text x="${padL - 6}" y="${y + 4}" font-size="11" fill="var(--sub)" text-anchor="end">${tickLabel(m)}</text>`;
    }

    let bars = "";
    for(let i=0;i<7;i++){
      const gx = padL + i*groupW + groupW/2;
      const lv = lastWeek[i]||0;
      const lh = (lv/maxVal)*chartH;
      bars += `<rect x="${gx-barW-2}" y="${padT+chartH-lh}" width="${barW}" height="${lh}" rx="3" fill="var(--gray)" opacity="0.55"/>`;

      const tv = thisWeek[i];
      if(tv!=null){
        const th = (tv/maxVal)*chartH;
        bars += `<rect x="${gx+2}" y="${padT+chartH-th}" width="${barW}" height="${th}" rx="3" fill="var(--accent)"/>`;
      } else {
        bars += `<rect x="${gx+2}" y="${padT+chartH-2}" width="${barW}" height="2" rx="1" fill="var(--line)"/>`;
      }
      bars += `<text x="${gx}" y="${H-8}" font-size="11" fill="var(--sub)" text-anchor="middle">${WEEKDAY_LABELS[i]}</text>`;
    }
    return `
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="今週と先週の勉強時間比較">
        ${grid}
        ${bars}
      </svg>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>今週</span>
        <span><i style="background:var(--gray); opacity:.6"></i>先週</span>
      </div>
    `;
  }

  /* ============ 描画: データタブ ============ */

  // 進捗管理シートの値(data/progress.json)。形が正しいときだけ使う。
  let progressData = null;
  function validProgress(d){
    return d && typeof d === "object"
      && typeof d.updatedAt === "string" && !Number.isNaN(Date.parse(d.updatedAt))
      && typeof d.baselineDate === "string" && DATE_RE.test(d.baselineDate)
      && Array.isArray(d.subjects)
      && d.subjects.every(x => x && typeof x.subject === "string"
        && Number.isInteger(x.done) && x.done >= 0 && Number.isInteger(x.total) && x.total > 0)
      && (d.importedIds === undefined || (Array.isArray(d.importedIds) && d.importedIds.every(i => typeof i === "string")));
  }
  async function fetchProgress(){
    try{
      const res = await fetch(PROGRESS_URL + "?_=" + Date.now(), { cache: "no-store" });
      if(!res.ok) throw new Error("http " + res.status);
      const d = await res.json();
      progressData = validProgress(d) ? d : null;
    }catch(e){
      progressData = null;
    }
    renderSubjectProgress();
    renderExamLine();
  }

  // 科目別の進捗。
  //  ・シートの値(progress.json)があるとき: シートの済回数 ＋ まだシートに取り込まれていない、この端末の記録
  //    (取り込み済みの記録IDが分かるときはIDで、分からないときは取り込み時刻より後に終わった記録で判断)
  //  ・無いとき: 基準済回数(コードに固定) ＋ 基準日より後の、この端末の記録(シートの式と同じ)
  function buildSubjectProgress(){
    const list = loadRecords();
    const sheet = progressData;
    const baselineDate = sheet ? sheet.baselineDate : SUBJECT_BASELINE_DATE;
    const sheetRows = sheet ? new Map(sheet.subjects.map(x => [x.subject, x])) : null;
    const importedIds = sheet && sheet.importedIds ? new Set(sheet.importedIds) : null;
    const updatedMs = sheet ? Date.parse(sheet.updatedAt) : NaN;

    const localAfterBaseline = {};   // 基準日より後の、この端末の記録(すべて)
    const pendingBySubject = {};     // そのうち、シートにまだ入っていないもの
    let otherUnits = 0;

    list.forEach(r=>{
      const units = Number.isInteger(r.completedUnits) ? r.completedUnits : 0;
      if(units <= 0 || !r.subject) return;
      if(r.date <= baselineDate) return; // 基準日当日とそれ以前は、基準済回数にすでに含まれている(シートの式と同じ「より後」だけ加算)
      if(Object.prototype.hasOwnProperty.call(SUBJECT_TOTAL_COUNTS, r.subject)){
        localAfterBaseline[r.subject] = (localAfterBaseline[r.subject]||0) + units;
        if(sheet){
          const inSheet = importedIds ? importedIds.has(r.id) : (Date.parse(r.endedAt) <= updatedMs);
          if(!inSheet) pendingBySubject[r.subject] = (pendingBySubject[r.subject]||0) + units;
        }
      } else {
        otherUnits += units; // 進捗管理シートに無い自由入力科目
      }
    });

    const rows = SUBJECT_GROUPS.flatMap(g => g.subjects).map(subject=>{
      const sheetRow = sheetRows ? sheetRows.get(subject) : null;
      const total = sheetRow ? sheetRow.total : SUBJECT_TOTAL_COUNTS[subject];
      const done = sheetRow
        ? sheetRow.done + (pendingBySubject[subject] || 0)
        : (SUBJECT_BASELINE_COMPLETED[subject] || 0) + (localAfterBaseline[subject] || 0);
      return { subject, done, total, pct: total ? Math.min(100, Math.round((done/total)*100)) : 0 };
    });

    return { rows, otherUnits, source: sheet ? "sheet" : "local", updatedAt: sheet ? sheet.updatedAt : null };
  }

  // 試験日までの日数(今日が0)。試験日が未設定・不正なら null。
  function loadExamDate(){
    try{
      const v = localStorage.getItem(STORAGE.EXAM_DATE);
      return v && DATE_RE.test(v) ? v : "";
    }catch(e){ return ""; }
  }
  function daysUntilExam(examDate){
    if(!examDate) return null;
    const exam = new Date(examDate + "T00:00:00");
    const today = new Date(todayStr() + "T00:00:00");
    return Math.round((exam - today) / 86400000);
  }

  // 直近7日(今日を含む)の、完了コマ数の合計
  function unitsInLastDays(days){
    const from = dateKey(addDays(todayDate(), -(days-1)));
    return loadRecords().reduce((a, r)=>{
      const u = Number.isInteger(r.completedUnits) ? r.completedUnits : 0;
      return (r.date >= from && r.date <= todayStr()) ? a + u : a;
    }, 0);
  }

  function renderExamPace(rows){
    const el = document.getElementById("exam-pace");
    if(!el) return;
    const examDate = loadExamDate();
    const days = daysUntilExam(examDate);
    if(days === null){ el.innerHTML = ""; return; }
    const remaining = rows.reduce((a, r)=>a + Math.max(0, r.total - r.done), 0);
    if(days < 0){
      el.innerHTML = `<p class="config-note" style="margin:0 0 8px;">試験日（${esc(formatMonthDay(examDate))}）を過ぎています。試験日を更新してください。</p>`;
      return;
    }
    if(days === 0){
      el.innerHTML = `<p class="config-note" style="margin:0 0 8px;">今日が試験日です。残りは ${remaining}コマです。</p>`;
      return;
    }
    const perDay = remaining / days;
    const recent = unitsInLastDays(7) / 7;
    el.innerHTML = `
      <div class="pace-box">
        <div><b>試験まで ${days}日</b>（${esc(formatMonthDay(examDate))}）・ 残り <b>${remaining}コマ</b></div>
        <div>必要なペース：1日 約${perDay.toFixed(1)}コマ（週 約${(perDay*7).toFixed(1)}コマ）</div>
        <div class="pace-recent">直近7日のペース：1日 ${recent.toFixed(1)}コマ</div>
      </div>`;
  }

  function renderSubjectProgress(){
    const el = document.getElementById("subject-progress");
    if(!el) return;
    const { rows, otherUnits, source, updatedAt } = buildSubjectProgress();
    el.innerHTML = rows.map(r=>`
      <div class="progress-row">
        <div class="progress-label">
          <span>${esc(r.subject)}</span>
          <span>${r.done}/${r.total}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:${r.pct}%"></div></div>
      </div>
    `).join("") + (otherUnits > 0
      ? `<p class="config-note" style="margin-top:10px;">上記の科目一覧に無い自由入力の科目でも、合計 ${otherUnits}コマが記録されています。</p>`
      : "");
    renderExamPace(rows);
    const noteEl = document.getElementById("subject-progress-note");
    if(noteEl){
      if(source === "sheet"){
        const d = new Date(updatedAt);
        const when = `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        noteEl.textContent = `進捗管理シートの値（${when}時点）に、まだシートに取り込まれていない、この端末の記録を足しています。`;
      } else {
        noteEl.textContent = "進捗管理シートの値を取得できないため、アプリ内の計算（基準済回数＋基準日より後の記録）で表示しています。";
      }
    }
  }

  /* ============ 復習した時間(科目別の進捗とは独立した集計) ============ */

  // 許可された科目だけを、固定順・重複なしで返す。
  function orderedReviewTags(tags){
    const set = new Set(Array.isArray(tags) ? tags : []);
    return REVIEW_SUBJECTS.filter(s => set.has(s));
  }

  // 復習の記録(reviewTagsが空でないもの)だけを対象に、科目別の累計分と今週分を返す。
  // 複数タグの記録はactualMinutesをタグ数で等分し、割り切れない分は固定順の先頭の科目から1分ずつ足す(合計が実時間と一致する)。
  function buildReviewTime(){
    const monday = mondayOf(todayDate());
    const weekStart = dateKey(monday), weekEnd = dateKey(addDays(monday, 6));
    const rows = REVIEW_SUBJECTS.map(subject => ({ subject, total:0, week:0 }));
    let reviewRecords = 0;

    loadRecords().forEach(r=>{
      const tags = orderedReviewTags(r.reviewTags);
      if(!tags.length) return;
      reviewRecords++;
      const minutes = Math.max(0, Math.round(Number(r.actualMinutes) || 0));
      const base = Math.floor(minutes / tags.length);
      const extra = minutes % tags.length;
      const inWeek = typeof r.date === "string" && r.date >= weekStart && r.date <= weekEnd;
      tags.forEach((tag, i)=>{
        const share = base + (i < extra ? 1 : 0);
        const row = rows.find(x => x.subject === tag);
        row.total += share;
        if(inWeek) row.week += share;
      });
    });

    const total = rows.reduce((a,r)=>a+r.total, 0);
    const max = rows.reduce((a,r)=>Math.max(a,r.total), 0);
    return { rows, total, max, reviewRecords };
  }

  function renderReviewTime(){
    const el = document.getElementById("review-time");
    if(!el) return;
    const { rows, total, max, reviewRecords } = buildReviewTime();
    const totalEl = document.getElementById("review-total");
    if(totalEl) totalEl.textContent = reviewRecords ? "合計 " + formatMinutes(total) : "";

    if(!reviewRecords){
      el.innerHTML = `<p class="config-note">まだ復習の記録がありません。タイマーを終えるとき『復習として記録』をオンにすると、ここに表示されます</p>`;
      return;
    }
    el.innerHTML = rows.map(r=>{
      const pct = max > 0 ? Math.round((r.total / max) * 100) : 0;
      return `
        <div class="progress-row">
          <div class="progress-label">
            <span>${esc(r.subject)}</span>
            <span>${formatMinutes(r.total)}<small class="review-week">今週${formatMinutes(r.week)}</small></span>
          </div>
          ${max > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>` : ""}
        </div>`;
    }).join("");
  }

  // 記録の科目が復習の対象科目なら、その科目を復習タグの初期値にする(科目を二重に選ばせないため)。
  function defaultReviewTags(subject){
    if(subject === "演習　数的処理") return ["数的処理"];   // 演習も、復習は「数的処理」として記録する
    return REVIEW_SUBJECTS.includes(subject) ? [subject] : [];
  }
  function sameTags(a, b){
    return a.length === b.length && a.every(t => b.includes(t));
  }

  // 「復習として記録」トグル+科目タグのチップ(完了モーダルと手動追加フォームで共用)
  // autoSubject: 記録の科目から自動で選んだ科目。その科目だけが選ばれている間、「自動で選びました」と案内する。
  function reviewPickerHtml(on, tags, toggleAction, tagAction, autoSubject){
    const selected = new Set(tags || []);
    const autoPicked = !!autoSubject && selected.size === 1 && selected.has(autoSubject);
    return `
      <div class="chip-row" style="margin:6px 0;">
        <button type="button" class="chip sm ${on ? "selected" : ""}" data-action="${toggleAction}" aria-pressed="${on ? "true" : "false"}">復習として記録</button>
      </div>
      ${on ? `
        <div class="chip-row" style="margin:6px 0;">
          ${REVIEW_SUBJECTS.map(s=>`<button type="button" class="chip sm ${selected.has(s) ? "selected" : ""}" data-action="${tagAction}" data-tag="${esc(s)}" aria-pressed="${selected.has(s) ? "true" : "false"}">${esc(s)}</button>`).join("")}
        </div>
        ${autoPicked ? `<p class="config-note" style="margin:0 0 6px;">記録の科目「${esc(autoSubject)}」を自動で選びました。変えたいときは、選び直してください。</p>` : ""}
        ${selected.size === 0 ? `<p class="config-note" style="margin:0 0 6px;">復習した科目を1つ以上選んでください（選ばないと復習として記録されません）</p>` : ""}
      ` : ""}`;
  }

  const HIST_VISIBLE_COUNT = 3;
  let histExpanded = false;

  function renderData(){
    const list = loadRecords();
    document.getElementById("stat-total-count").textContent = list.length;
    document.getElementById("stat-total-min").textContent = sumMinutes(list);

    const recent = list.filter(r=>r.type !== "assignment").sort((a,b)=>b.startedAt.localeCompare(a.startedAt)).slice(0,12);   // 大学の課題の記録は、履歴に出さない
    const histItemHtml = r=>`
      <div class="hist-item">
        <div class="hist-main">
          <span>${esc(r.date)} ${typeLabel(r.type)}${r.subject ? " ・"+esc(r.subject) : ""}${orderedReviewTags(r.reviewTags).length ? " ・復習("+esc(orderedReviewTags(r.reviewTags).join("/"))+")" : ""}${r.note ? " ・"+esc(r.note) : ""}</span>
          <b>${r.actualMinutes}分${r.completedNatural?"":"(途中)"}${r.completedUnits ? " ・"+r.completedUnits+"コマ" : ""}</b>
        </div>
        <button class="hist-del hist-edit" data-action="edit-record" data-id="${esc(r.id)}" aria-label="この記録を編集">✎</button>
        <button class="hist-del" data-action="delete-record" data-id="${esc(r.id)}" aria-label="この記録を削除">✕</button>
      </div>`;
    const head = recent.slice(0, HIST_VISIBLE_COUNT), rest = recent.slice(HIST_VISIBLE_COUNT);
    document.getElementById("hist-list").innerHTML = recent.length
      ? head.map(histItemHtml).join("")
        + (rest.length ? (histExpanded ? rest.map(histItemHtml).join("") : "")
          + `<button type="button" class="btn ghost block hist-toggle" data-action="hist-toggle" aria-expanded="${histExpanded ? "true" : "false"}">${histExpanded ? "閉じる ▲" : "残り"+rest.length+"件を表示 ▼"}</button>` : "")
      : `<div class="hist-item">まだ記録がありません</div>`;

    renderSubjectProgress();
    renderReviewTime();

  }

  /* ============ 学習記録の手動追加 ============ */

  // 学習時間を10分きざみ(10分〜12時間)から選ぶ。10分きざみでない既存の値も、選択肢に残す
  function manualDurationOptions(selected){
    const vals = [15, 30, 45, 60, 90, 120, 150, 180, 240, 300];   // よく使う長さだけ。ほかの値は、選ばれているときだけ足す
    if(selected > 0 && !vals.includes(selected)){ vals.push(selected); vals.sort((a, b) => a - b); }
    return vals.map(m => {
      const h = Math.floor(m / 60), r = m % 60;
      const label = (h ? h + "時間" : "") + (r ? r + "分" : "");
      return `<option value="${m}" ${m === selected ? "selected" : ""}>${label}</option>`;
    }).join("");
  }

  function syncManualFromDom(){
    const dateEl = document.getElementById("manual-date");
    if(dateEl) manualEntry.date = dateEl.value;
    const durEl = document.getElementById("manual-duration");
    if(durEl){
      const total = parseInt(durEl.value, 10) || 0;
      manualEntry.hours = Math.floor(total / 60);
      manualEntry.minutes = total % 60;
    }
    const noteEl = document.getElementById("manual-note");
    if(noteEl) manualEntry.note = noteEl.value;
    const customEl = document.getElementById("manual-subject-custom");
    if(customEl) manualEntry.subjectCustom = customEl.value;
  }

  // 手動追加フォームで、いま選ばれている科目(自由入力を含む)
  function manualEffectiveSubject(){
    if(manualEntry.type !== "qualification") return "";
    return manualEntry.subject === "__custom__" ? manualEntry.subjectCustom.trim() : manualEntry.subject;
  }

  function renderManualEntry(){
    const el = document.getElementById("manual-entry");
    if(!el) return;

    if(!manualEntryOpen){
      el.innerHTML = `<button type="button" class="btn ghost block" data-action="manual-open">＋ 記録を追加</button>`;
      return;
    }

    const showSubject = manualEntry.type === "qualification";
    el.innerHTML = `
      <div class="manual-form">
        ${manualEditId ? `<div class="shared-state">この記録を編集しています。直したら「変更を保存」を押してください。</div>` : ""}
        ${showSubject ? `
          <div class="field-label">科目（任意）</div>
          <select class="memo" id="manual-subject-select">
            <option value="" ${manualEntry.subject===""?"selected":""}>選択しない</option>
            ${SUBJECT_GROUPS.map(g=>`
              <optgroup label="${esc(g.label)}">
                ${g.subjects.map(s=>`<option value="${esc(s)}" ${manualEntry.subject===s?"selected":""}>${esc(s)}</option>`).join("")}
              </optgroup>
            `).join("")}
            <option value="__custom__" ${manualEntry.subject==="__custom__"?"selected":""}>その他（自由入力）</option>
          </select>
          ${manualEntry.subject==="__custom__" ? `<input class="memo" id="manual-subject-custom" maxlength="30" placeholder="科目名を入力" value="${esc(manualEntry.subjectCustom)}">` : ""}
        ` : ""}
        <div class="field-label">日付</div>
        <input class="memo" type="date" id="manual-date" value="${esc(manualEntry.date)}" max="${esc(todayStr())}">
        <div class="field-label">学習時間</div>
        <select class="memo" id="manual-duration">${manualDurationOptions((manualEntry.hours||0)*60 + (manualEntry.minutes||0))}</select>
        ${showSubject ? `
          <div class="field-label">完了コマ数（任意）</div>
          <div class="chip-row">${[0,1,2,3,4].map(n=>`<button type="button" class="chip ${manualEntry.units===n?"selected":""}" data-action="manual-units" data-n="${n}" aria-pressed="${manualEntry.units===n}">${n}コマ</button>`).join("")}</div>
        ` : ""}
        ${showSubject ? `
          <div class="field-label">復習（任意）</div>
          ${reviewPickerHtml(manualEntry.review, manualEntry.reviewTags, "manual-review-toggle", "manual-review-tag", manualEffectiveSubject())}
        ` : ""}
        <div class="field-label">メモ（任意）</div>
        <input class="memo" id="manual-note" maxlength="40" value="${esc(manualEntry.note)}">
        <div class="row-btns">
          <button class="btn ghost" data-action="manual-cancel">キャンセル</button>
          <button class="btn primary" data-action="manual-submit">${manualEditId ? "変更を保存" : "記録を追加"}</button>
        </div>
      </div>
    `;
  }

  // 履歴の ✎ から、記録を手動追加と同じフォームで直す
  function startEditRecord(id){
    const r = loadRecords().find(x=>x.id === id);
    if(!r) return;
    const inList = SUBJECT_GROUPS.some(g=>g.subjects.includes(r.subject));
    const total = Math.max(1, Math.round(Number(r.actualMinutes) || 0));
    manualEditId = id;
    manualEntryOpen = true;
    manualEntry = {
      type: "qualification",
      subject: !r.subject ? "" : (inList ? r.subject : "__custom__"),
      subjectCustom: r.subject && !inList ? r.subject : "",
      date: r.date, hours: Math.floor(total / 60), minutes: total % 60,
      units: Number.isInteger(r.completedUnits) ? r.completedUnits : 0,
      note: r.note || "", review: orderedReviewTags(r.reviewTags).length > 0, reviewTags: orderedReviewTags(r.reviewTags),
    };
    renderManualEntry();
    const el = document.getElementById("manual-entry");
    if(el && el.scrollIntoView) el.scrollIntoView({ block: "center" });
  }
  // 記録のid・種類・タイマーの経過などは残して、直した項目だけ上書きする
  function applyRecordEdit(id, edited){
    const list = loadRecords();
    const i = list.findIndex(x=>x.id === id);
    if(i < 0) return;
    const old = list[i];
    const sameDay = old.date === edited.date;
    const started = sameDay && old.startedAt ? new Date(old.startedAt) : new Date(edited.date + "T12:00:00");
    const planned = Number(old.plannedMinutes) === Number(old.actualMinutes) ? edited.actualMinutes : old.plannedMinutes;
    list[i] = Object.assign({}, old, {
      date: edited.date, actualMinutes: edited.actualMinutes, plannedMinutes: planned, note: edited.note,
      subject: edited.subject, completedUnits: edited.completedUnits, reviewTags: edited.reviewTags,
      startedAt: started.toISOString(), endedAt: new Date(started.getTime() + edited.actualMinutes * 60000).toISOString(),
    });
    saveRecords(list);
  }

  function submitManualEntry(){
    syncManualFromDom();
    const subjectSelectEl = document.getElementById("manual-subject-select");
    if(subjectSelectEl) manualEntry.subject = subjectSelectEl.value;

    if(!manualEntry.type){
      showToast("内容を確認してください");
      return;
    }
    if(!manualEntry.date || !DATE_RE.test(manualEntry.date)){
      showToast("日付を確認してください");
      return;
    }
    const totalMinutes = (manualEntry.hours||0)*60 + (manualEntry.minutes||0);
    if(totalMinutes <= 0){
      showToast("学習時間を入力してください");
      return;
    }

    let subject = "";
    if(manualEntry.type === "qualification"){
      subject = manualEntry.subject === "__custom__" ? manualEntry.subjectCustom.trim() : manualEntry.subject;
    }
    const completedUnits = (manualEntry.type === "qualification" && subject) ? manualEntry.units : 0;

    const started = new Date(manualEntry.date + "T12:00:00");
    const ended = new Date(started.getTime() + totalMinutes*60000);

    const rec = {
      id: "r_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),
      date: manualEntry.date,
      type: manualEntry.type,
      plannedMinutes: totalMinutes,
      actualMinutes: totalMinutes,
      note: manualEntry.note.trim(),
      subject,
      startedAt: started.toISOString(),
      endedAt: ended.toISOString(),
      completedNatural: true,
      completedUnits,
      reviewTags: (manualEntry.type === "qualification" && manualEntry.review) ? orderedReviewTags(manualEntry.reviewTags) : [],
    };
    if(manualEditId){
      applyRecordEdit(manualEditId, rec);
      manualEditId = null;
      manualEntryOpen = false;
      manualEntry = emptyManualEntry();
      renderManualEntry();
      render();
      showToast("記録を直しました");
      maybeAutoSave();
      return;
    }
    const prevTotal = totalCompletedUnits();
    addRecord(rec);
    try{
      const { hours, minutes, subject: sj, subjectCustom, units, review, reviewTags } = manualEntry;
      localStorage.setItem(MANUAL_LAST_KEY, JSON.stringify({ hours, minutes, subject: sj, subjectCustom, units, review, reviewTags }));
    }catch(e){}
    manualEntryOpen = false;
    manualEntry = emptyManualEntry();
    renderManualEntry();
    render();
    const crossed = crossedMilestone(prevTotal, prevTotal + completedUnits, UNITS_MILESTONES);
    showToast(crossed ? `記録を追加しました。🎉 累計 ${crossed}コマ完了、達成しました！` : "記録を追加しました");
    maybeAutoSave();
  }

  /* ============ モーダル・トースト ============ */

  let modalUnitsRecordId = null;
  let modalUnitsValue = 0;
  let modalReviewRecordId = null;
  let modalReviewOn = false;
  let modalReviewTags = [];
  let modalReviewSubject = "";   // 完了した記録の科目(復習タグの初期値に使う)

  function renderModalReview(){
    const el = document.getElementById("modal-review");
    if(el) el.innerHTML = reviewPickerHtml(modalReviewOn, modalReviewTags, "review-toggle", "review-tag", modalReviewSubject);
  }

  // 完了画面の「次のタスク」: 今日のタスクのうち、まだチェックが付いていない最初の1つ
  function nextTaskHtml(){
    if(!todayTasksData || todayTasksData.isRestDay || !Array.isArray(todayTasksData.tasks)) return "";
    const st = loadTaskStatus(todayTasksData.date);
    const next = todayTasksData.tasks.find(x=>!st[x.id]);
    if(!next) return `<p class="milestone-note" style="margin-top:10px;">今日のタスクは、すべて完了しました 🎉</p>`;
    const m = Number(next.minutes);
    const mins = isFinite(m) && m > 0 ? `（${formatTaskMinutes(Math.round(m))}）` : "";
    return `<button type="button" class="btn ghost block" data-action="task-next" data-id="${esc(next.id)}" style="margin-top:14px;">▶ 次のタスク: ${esc(taskParts(next).title)}${mins}</button>`;
  }

  function showCompletionModal(rec, total, streakMilestone){
    const msgs = [
      "お疲れさまでした！", "今日もよく頑張りました", "集中できましたね", "コツコツの積み重ねが力になります"
    ];
    const msg = streakMilestone ? "節目達成です！" : msgs[Math.floor(Math.random()*msgs.length)];
    const showUnits = rec.type === "qualification" && !!rec.subject;
    modalUnitsRecordId = showUnits ? rec.id : null;
    modalUnitsValue = 0;
    const showReview = rec.type === "qualification";
    modalReviewRecordId = showReview ? rec.id : null;
    modalReviewSubject = rec.subject || "";
    modalReviewOn = false;
    modalReviewTags = [];
    // タスクの題名が「解き直し」「復習」なら、復習として記録する設定を最初からオンにしておく
    if(showReview && /解き直し|復習/.test(rec.note || "")){
      const auto = defaultReviewTags(rec.subject);
      if(auto.length){ modalReviewOn = true; modalReviewTags = auto; }
    }

  function esc(s){

  /* ============ GitHub保存の状態表示 ============ */
  // 各保存処理が syncSet(キー, 状態, 再試行する関数) で状態を知らせ、ヘッダー右上の小さな表示にまとめる。
  const SYNC = {};
  function syncSet(key, state, retry){
    SYNC[key] = { state, retry: retry || (SYNC[key] && SYNC[key].retry), at: new Date() };
    renderSyncPill();
  }
  function renderSyncPill(){
    const el = document.getElementById("sync-pill");
    if(!el) return;
    const keys = Object.keys(SYNC);
    let hasToken = false;
    try{ hasToken = !!localStorage.getItem(STORAGE.GH_TOKEN); }catch(e){}
    if(!hasToken || !keys.length){ el.hidden = true; return; }
    const states = keys.map(k=>SYNC[k].state);
    el.hidden = false;
    el.classList.remove("saving", "error");
    if(states.includes("error")){ el.classList.add("error"); el.textContent = "⚠ 未保存・タップで再試行"; }
    else if(states.includes("saving")){ el.classList.add("saving"); el.textContent = "☁ 保存中…"; }
    else{
      const last = keys.map(k=>SYNC[k].at).sort((a,b)=>b-a)[0];
      el.textContent = `☁ 保存済み ${pad(last.getHours())}:${pad(last.getMinutes())}`;
    }
  }
  function syncRetryAll(){
    Object.keys(SYNC).forEach(k=>{
      if(SYNC[k].state === "error" && SYNC[k].retry){ SYNC[k].state = "saving"; try{ SYNC[k].retry(); }catch(e){} }
    });
    renderSyncPill();
  }

  /* ============ 国際関係ブリーフ(読み取り＋正誤記録。学習記録・合計時間とは独立) ============ */
  const KK_BASE = "https://raw.githubusercontent.com/shenyilangguhe013-cpu/mokumoku/main/data/briefs/kokusai/";

  const KK_BM = "kokusai_bookmarks_v1";
  let kkBmOnly = false;
  function kkBmLoad(){ try{ const a = JSON.parse(localStorage.getItem(KK_BM) || "[]"); return Array.isArray(a) ? a.map(Number) : []; }catch(e){ return []; } }
  function kkBmToggle(n){

  }
  // 本文の見出しを大きくして視認性を上げる(本文HTMLの先頭に上書きCSSを差し込む)
  const KK_HEAD_CSS = "<style>.hero h1{font-size:30px!important;line-height:1.4!important}h2{font-size:25px!important;line-height:1.4!important}h2 .no{font-size:.8em!important}</style>";
  const KK_LAST = "kokusai_last_v1", KK_READ = "kokusai_read_v1";
  let kkUnreadOnly = false;
  function kkLastLoad(){ try{ const o = JSON.parse(localStorage.getItem(KK_LAST) || "null"); return o && Number.isFinite(Number(o.n)) ? o : null; }catch(e){ return null; } }
  function kkLastSave(o){ try{ localStorage.setItem(KK_LAST, JSON.stringify(o)); }catch(e){} }
  function kkReadLoad(){ try{ const a = JSON.parse(localStorage.getItem(KK_READ) || "[]"); return Array.isArray(a) ? a.map(Number) : []; }catch(e){ return []; } }
  function kkMarkRead(n){
    n = Number(n);
    const a = kkReadLoad();
    if(a.includes(n)) return;
    a.push(n);
    try{ localStorage.setItem(KK_READ, JSON.stringify(a)); }catch(e){}
  }
  // 本文(iframe)に差し込む小さなスクリプト: スクロール位置の通知と復元、語の強調(検索から開いたとき)
  const KK_HEAD_JS = "<script>(function(){var t=null;function post(m){try{parent.postMessage(m,'*')}catch(e){}}"
    + "function se(){return document.scrollingElement||document.documentElement}"
    + "addEventListener('scroll',function(){clearTimeout(t);t=setTimeout(function(){var e=se();post({type:'kk-scroll',y:e.scrollTop,max:e.scrollHeight-innerHeight})},250)},{passive:true});"
    + "function find(term){var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null),a=[],n,lo=term.toLowerCase();"
    + "while(n=w.nextNode()){var p=n.parentNode;if(p&&/^(SCRIPT|STYLE|MARK)$/.test(p.nodeName))continue;if(n.nodeValue.toLowerCase().indexOf(lo)>=0)a.push(n)}"
    + "var first=null;a.forEach(function(n){var v=n.nodeValue,l=v.toLowerCase(),i=0,j,f=document.createDocumentFragment();"

    + "f.appendChild(document.createTextNode(v.slice(i)));n.parentNode.replaceChild(f,n)});"
    + "if(first){var d=first.closest('details');while(d){d.open=true;d=d.parentElement&&d.parentElement.closest('details')}setTimeout(function(){first.scrollIntoView({block:'center'})},60)}}"
    + "addEventListener('message',function(e){var m=e.data;if(!m)return;"
    + "if(m.type==='kk-scroll-to')setTimeout(function(){scrollTo(0,m.y)},60);"
    + "if(m.type==='kk-find'&&m.term)find(String(m.term))});"
    + "post({type:'kk-ready'})})();<\/script>";
  const kkFilter = { from: 0, kind: "all", unreviewedOnly: true, only: 0, source: "kokusai", weak: false, sortWrong: false };

  function kkCacheGet(key){ try{ return localStorage.getItem(KK_CACHE_PREFIX+key); }catch(e){ return null; } }
  function kkCacheSet(key, val){ try{ localStorage.setItem(KK_CACHE_PREFIX+key, val); }catch(e){} }
  async function kkFetchText(name){
    const res = await fetch(KK_BASE + name + "?_=" + Date.now(), { cache: "no-store" });
    if(!res.ok) throw new Error("http "+res.status);
    return await res.text();
  }

  /* ---- 回答履歴(追記のみ) ---- */
  function kqLoad(){ try{ const a = JSON.parse(localStorage.getItem(KQ_STORAGE) || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function kqSave(list){ try{ localStorage.setItem(KQ_STORAGE, JSON.stringify(list)); }catch(e){} }
  function kqNowJst(){
    const d = new Date(Date.now() + 9*3600*1000);
    return d.toISOString().slice(0,23) + "+09:00";   // ミリ秒まで残す(同じ秒に続けて答えても、別の記録として残るように)
  }
  function kqMerge(a, b){
    const map = new Map();
    a.concat(b).forEach(x=>{ if(x && x.qid && x.ts) map.set(x.qid+"|"+x.ts, x); });
    return Array.from(map.values()).sort((p,q)=> p.ts < q.ts ? -1 : p.ts > q.ts ? 1 : 0);
  }
  function kqLatest(list){ // qidごとの最新
    const m = {};
    list.forEach(x=>{ if(!m[x.qid] || x.ts >= m[x.qid].ts) m[x.qid] = x; });
    return m;
  }
  function kqRecord(qid, issue, picked, ans){
    const a = { qid, issue, picked, ans, ok: picked === ans, ts: kqNowJst() };
    kqSave(kqMerge(kqLoad(), [a]));
    kqPush();
    return a;
  }
  // 連続して答えても保存が衝突しないよう、①1.5秒まとめて1回にし、②直前のPUTで得たshaを使い、③競合(409/422)なら取り直して再試行する。
  // 続けて答えている間は保存せず、答える手が止まって15秒たってから、まとめて1回だけ保存する。
  // 復習をやめる・終えたとき、アプリを閉じる(画面が隠れる)ときは、待たずにすぐ保存する。
  const SYNC_QUIET_MS = 15000;
  let kqPushing = false, kqPushAgain = false, kqTimer = null, kqSha = null, kqDirty = false, icDirty = false;
  function flushSyncs(){
    if(!localStorage.getItem(STORAGE.GH_TOKEN)) return;
    if(kqDirty) kqFlush();
    if(icDirty){ clearTimeout(icSyncTimer); icPush(false); }   // 書き込みは1つずつ順に行われる(ghSerial)ので、ずらさずすぐ実行する。icPushが先にicDirtyを下げるので、二重にもならない
  }
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flushSyncs(); });
  window.addEventListener("pagehide", flushSyncs);
  function kqPush(){
    if(!localStorage.getItem(STORAGE.GH_TOKEN) || !autoSaveEnabled()) return;   // 自動保存をオフにしたら、一問一答と同じく自動では保存しない
    kqDirty = true;
    if(kkInReview()) return;   // 今日の復習の最中は保存しない。「やめる」か全問回答したときに、まとめて1回保存する
    syncSet("kq", "saving", kqFlush);
    clearTimeout(kqTimer);
    kqTimer = setTimeout(kqFlush, SYNC_QUIET_MS);
  }
  async function kqPutOnce(token, sha, attempts){
    const body = { message: `もくもく部屋: 国際関係ブリーフの正誤記録更新 ${dateKey(new Date())}`,
      content: utf8ToBase64(JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), attempts }, null, 2)),
      branch: GITHUB_SYNC.branch };
    if(sha) body.sha = sha;
    let res;
    try{
      res = await fetch(githubContentsUrl(KQ_PATH), { method: "PUT", headers: { ...githubHeaders(token), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    }catch(e){ throw new Error("通信エラーが発生しました。ネットワーク接続を確認してください"); }
    if(res.status === 409 || res.status === 422) return { conflict: true };
    if(res.status !== 200 && res.status !== 201) throw await githubErrorFromResponse(res);
    const j = await res.json();
    return { sha: j && j.content && j.content.sha };
  }
  async function kqFlush(){
    clearTimeout(kqTimer); kqDirty = false;
    if(kqPushing){ kqPushAgain = true; return; }
    kqPushing = true;
    try{
      do{
        kqPushAgain = false;
        const token = requireGithubToken();
        let done = false;
        for(let i = 0; i < 4 && !done; i++){
          let sha = kqSha, attempts = kqLoad();
          if(!sha || i > 0){ // 初回で手元にshaが無い時、または競合した時は、GitHub側を読み直して統合する
            if(i > 0) await new Promise(r=>setTimeout(r, 700 * i));
            const remote = await getGithubJsonFile(KQ_PATH, token);
            attempts = kqMerge((remote && remote.attempts) || [], attempts);
            kqSave(attempts);
            sha = await getGithubSha(KQ_PATH, token);
          }
          const r = await ghSerial(() => kqPutOnce(token, sha, attempts));
          if(r.conflict){ kqSha = null; continue; }
          kqSha = r.sha || null;
          done = true;
        }
        if(!done) throw new Error("保存が競合しました。少し待って、もう一度答えてください");
      }while(kqPushAgain);
      syncSet("kq", "ok");
    }catch(e){
      syncSet("kq", "error", kqFlush);
      showToast("正誤はこの端末に記録しました。GitHub保存は失敗: " + (e && e.message ? e.message : "通信エラー"));
    }finally{ kqPushing = false; }
  }
  async function kqPull(){ // 他の端末の分を取り込む
    if(!localStorage.getItem(STORAGE.GH_TOKEN)) return;
    try{
      const remote = await getGithubJsonFile(KQ_PATH, requireGithubToken());
      if(remote && Array.isArray(remote.attempts)){ kqSave(kqMerge(remote.attempts, kqLoad())); kkRenderView(); }
    }catch(e){}
  }

  /* ---- 取得 ---- */

  /* ---- 一覧 / まちがい集の切り替え ---- */

    }

      .filter(it=>!kkBmOnly || bm.has(Number(it.n)))
      .filter(it=>!kkUnreadOnly || (!it.missing && !read.has(Number(it.n))));
    const last = kkLastLoad();
    const lastItem = last && kkIndex.items.find(x=>Number(x.n) === Number(last.n) && !x.missing);
    const dueKk = kkDueQuestions().length, dueIc = kkDueIchimon().length;
    const due = dueKk + dueIc;
    const dueShown = Math.min(dueKk, KK_REVIEW_MAX) + Math.min(dueIc, KK_REVIEW_MAX);
    el.innerHTML = `
      <div class="kk-top"><span class="kk-updated">最終更新日: ${esc(kkIndex.updated || "-")}</span>
