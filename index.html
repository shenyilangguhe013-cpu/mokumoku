  /* ============ ミニテスト記録 ============ */
  // 水曜A・土曜Bなどのミニテストの結果を、問題ごとの○×で記録する。
  // 学習記録(mokumoku_export.json)や完了コマ数とは完全に独立。保存先は data/minitest_export.json。
  // Claude側が後でこのファイルを読み、分野別正答率の台帳に取り込む。
  const MT_STORAGE = "mokumoku_minitests_v1";
  const MT_DELETED = "mokumoku_minitests_deleted_v1";
  const MT_PATH = "data/minitest_export.json";
  // 台帳の分野に合わせる。学習しない科目（地理・生物・地学・思想・文学芸術）は含めない。
  const MT_FIELDS = [
    { group: "数的処理", items: ["判断推理", "数的推理", "資料解釈"] },
    { group: "文章理解", items: ["現代文", "英文"] },
    { group: "人文科学", items: ["日本史", "世界史"] },
    { group: "社会科学", items: ["政治", "経済", "法律", "社会"] },
    { group: "自然科学", items: ["物理", "化学", "数学"] },
    { group: "時事", items: ["時事"] },
  ];
  const MT_NAMES = ["水曜A", "土曜B", "その他"];
  const MT_DEFAULT_MINUTES = 20;
  // テスト分野を選ぶと、ミニテストの標準構成（10問。文章理解のみ6問）の行を自動で並べる。
  // 各行の分野は、あとから個別に変えられる。
  const MT_PRESETS = {
    "数的・判断・資料": [["数的処理／判断推理", 4], ["数的処理／数的推理", 4], ["数的処理／資料解釈", 2]],
    "文章理解": [["文章理解／現代文", 3], ["文章理解／英文", 3]],
    "時事": [["時事／時事", 10]],
    "自然科学": [["自然科学／物理", 4], ["自然科学／化学", 3], ["自然科学／数学", 3]],
    "人文科学": [["人文科学／日本史", 5], ["人文科学／世界史", 5]],
    "社会科学": [["社会科学／政治", 4], ["社会科学／経済", 3], ["社会科学／法律", 3]],
  };
  function mtPresetRows(key){
    const rows = [];
    (MT_PRESETS[key] || []).forEach(([value, n]) => { for(let i = 0; i < n; i++) rows.push({ value, ok: null }); });
    return rows;
  }
  let mtDraft = null;     // {name, date, rows:[{value, ok}]}
  let mtSaving = false;

  function mtLoad(){ try{ return JSON.parse(localStorage.getItem(MT_STORAGE) || "[]") || []; }catch(e){ return []; } }
  function mtSave(list){ localStorage.setItem(MT_STORAGE, JSON.stringify(list)); }
  function mtLoadDeleted(){ try{ return JSON.parse(localStorage.getItem(MT_DELETED) || "[]") || []; }catch(e){ return []; } }
  function mtNewDraft(){
    return { name: MT_NAMES[0], date: todayStr(), minutes: MT_DEFAULT_MINUTES, rows: [{ value: "数的処理／判断推理", ok: null }] };
  }
  // 所要時間(分)。空・0以下・数でないときは省略(undefined)として扱う
  function mtMinutes(v){
    const n = Math.round(Number(v));
    return v !== "" && v != null && Number.isFinite(n) && n > 0 ? n : undefined;
  }
  // 今週(月曜はじまり)の回数・合計分と、直近5回の正答率を1行にする
  function mtSummaryHtml(list){
    if(list.length === 0) return "";
    const d = new Date(); const dow = (d.getDay() + 6) % 7;
    const mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow);
    const sun = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow + 6);
    const key = x => x.getFullYear() + "-" + pad(x.getMonth() + 1) + "-" + pad(x.getDate());
    const week = list.filter(x => x.date >= key(mon) && x.date <= key(sun));
    const mins = week.reduce((a, x) => a + (mtMinutes(x.minutes) || 0), 0);
    const recent = list.slice(0, 5);
    const n = recent.reduce((a, x) => a + x.rows.length, 0), c = recent.reduce((a, x) => a + x.rows.filter(r => r.ok).length, 0);
    const rate = n ? Math.round(c / n * 100) + "%" : "-";
    return `<p class="config-note" style="margin:4px 0 8px;">今週 <b>${week.length}回・${mins}分</b>　直近${recent.length}回の正答率 <b>${rate}</b>（${c}/${n}）</p>`;
  }
  function mtOptions(selected){
    return MT_FIELDS.map(g => `<optgroup label="${esc(g.group)}">` +
      g.items.map(f => { const v = g.group + "／" + f; return `<option value="${esc(v)}" ${v === selected ? "selected" : ""}>${esc(f)}</option>`; }).join("") +
      `</optgroup>`).join("");
  }


  /* ---- 問題文つきミニテスト(data/minitests/) ----
     Claude Codeがミニテストを作ったとき、問題文・選択肢・正解・解説を data/minitests/<id>.json に保存し、index.json に載せる。
     アプリはそれを読み、画面で○×を自己採点する。採点結果は testId つきの記録として data/minitest_export.json に入る。 */
  const MT_TESTS_INDEX = "data/minitests/index.json";
  let mtTests = null;            // [{id,date,name,title,questions:[{q,subject,field,stem,options,answer,explain}]}]
  let mtTestsState = "loading";  // loading | ok | error
  let mtOpenId = "";             // 開いているテストのid
  let mtTake = { marks: {}, shown: {}, picked: {} };   // marks: 問題番号->true/false、shown: 答えを表示中の問題番号
  function mtTestFileUrl(f){ return String(f).includes("/") ? f : MT_TESTS_INDEX.replace(/[^/]*$/, "") + f; }
  async function mtLoadTests(){
    mtTestsState = "loading";
    try{
      const res = await fetch(MT_TESTS_INDEX, { cache: "no-store" });
      if(res.status === 404){ mtTests = []; mtTestsState = "ok"; }
      else{
        if(!res.ok) throw new Error("http " + res.status);
        const idx = await res.json();
        const metas = (idx && Array.isArray(idx.tests) ? idx.tests : []).filter(t => t && t.id && t.file);
        const got = await Promise.allSettled(metas.map(async m => {
          const r = await fetch(mtTestFileUrl(m.file), { cache: "no-store" });
          if(!r.ok) throw new Error("http " + r.status);
          const j = await r.json();
          const qs = (j && Array.isArray(j.questions) ? j.questions : []).filter(q => q && q.q != null && q.stem);
          return { id: String(m.id), date: j.date || m.date || "", name: j.name || m.name || "", title: j.title || m.title || String(m.id), questions: qs };
        }));
        mtTests = got.filter(x => x.status === "fulfilled").map(x => x.value).sort((a,b)=> (b.date + b.id).localeCompare(a.date + a.id));
        mtTestsState = metas.length && !mtTests.length ? "error" : "ok";
      }
    }catch(e){ mtTests = mtTests || []; mtTestsState = "error"; }
    await mtMergeRemoteSessions();
    icAddMtDeck();
    renderMiniTest();
    if(icDecks && icView !== "quiz" && icView !== "result") renderIchimon();
  }
  // GitHub上の記録(testIdつき)を端末の記録に取り込む。端末にない記録は足し、testIdのない端末の記録にはtestIdを入れる(削除済みは除く)
  async function mtMergeRemoteSessions(){
    if(!/^https?:/.test(location.protocol)) return;
    try{
      const res = await fetch(MT_PATH, { cache: "no-store" });
      if(!res.ok) return;
      const remote = await res.json();
      const rs = remote && Array.isArray(remote.sessions) ? remote.sessions : [];
      const deleted = new Set(mtLoadDeleted());
      const list = mtLoad(); let changed = false;
      rs.forEach(r => {
        if(!r || !r.id || deleted.has(r.id)) return;
        const own = list.find(x => x.id === r.id);
        if(!own){ list.push(r); changed = true; }
        else if(r.testId && !own.testId){ own.testId = r.testId; changed = true; }
      });
      if(changed) mtSave(list);
    }catch(e){}
  }
  // そのテストの最新の採点
  function mtLatestAttempt(testId){
    return mtLoad().filter(s => s.testId === testId).sort((a,b)=> (b.date + b.id).localeCompare(a.date + a.id))[0] || null;
  }
  // 解説を、選択肢ごとの説明(per)と、前置き(pre)・おわりの補足(post)に分ける。分けられない解説は per=null(全文を表示)
  function mtSplitExplain(text, n){
  const lines = String(text || "").split("\n");
  const segs = {}, pre = [], post = [];
  let cur = 0, stage = "pre";
  const startRe = /^\s*([1-9])\s*[×○◎△✕✖Ｘx]/;
  const stopRe = /^\s*(押さえる|出典|ポイント|解法|正答の根拠|各選択肢)/;
  for(const raw of lines){
    const m = startRe.exec(raw);
    if(m && Number(m[1]) <= n && !segs[m[1]]){ cur = Number(m[1]); segs[cur] = []; stage = "seg"; const mark=/[○◎]/.test(raw.slice(0,12)); segs[cur].mark = mark; continue; }
    if(stage === "seg" && stopRe.test(raw)){ stage = "post"; }
    if(stage === "pre") pre.push(raw);
    else if(stage === "seg") segs[cur].push(raw);
    else post.push(raw);
  }
  const out = {};
  Object.keys(segs).forEach(k => { const t = segs[k].map(s => s.replace(/^\s*→\s*/, "").trim()).filter(Boolean).join(" "); if(t) out[k] = t; });
  return { per: Object.keys(out).length >= Math.max(2, n - 1) ? out : null, pre: pre.join("\n").trim(), post: post.join("\n").trim() };
}
  // 選択肢つきで、正解が番号の問題は、選択肢を押して答える(○×は自動採点)
  function mtAnswerNo(q){
    const opts = Array.isArray(q.options) ? q.options : [];
    const n = Number(q.answer);
    return opts.length && Number.isInteger(n) && n >= 1 && n <= opts.length ? n : 0;
  }
  function mtAnswerText(q){
    const opts = Array.isArray(q.options) ? q.options : [];
    const a = q.answer;
    if(typeof a === "number" && opts[a - 1] != null) return a + ". " + opts[a - 1];
    if(typeof a === "string" && /^\d+$/.test(a) && opts[Number(a) - 1] != null) return a + ". " + opts[Number(a) - 1];
    return a == null ? "" : String(a);
  }
  function mtQuestionText(q){
    const opts = Array.isArray(q.options) ? q.options : [];
    return String(q.stem) + (opts.length ? "\n" + opts.map((o, i) => (i + 1) + ". " + o).join("\n") : "");
  }
  // 問題つきミニテストは「一問一答」タブの下の「問題つきミニテスト」欄で解く。自動のめくりカードデッキは作らない(混乱するため)。
  // 以前に作ったデッキが残っていれば外す。
  function icAddMtDeck(){
    if(!Array.isArray(icDecks)) return;
    icDecks = icDecks.filter(d => d.id !== "minitest_all");
    if(icCards) delete icCards.minitest_all;
    if(icSel && icSel.deckId === "minitest_all") icSel.deckId = "";
  }
  function mtTestsHtml(){
    const head = `<h2>問題つきミニテスト</h2>`;
    if(mtTests === null) return head + `<p class="config-note">読み込み中...</p>`;
    if(mtTestsState === "error") return head + `<p class="config-note">問題データを読み込めませんでした。</p><button type="button" class="btn ghost" data-mt-reload="1">再読み込み</button>`;
    if(!mtTests.length) return head + `<p class="config-note">まだありません。Claude Codeがミニテストを作ると、ここに問題が並びます。</p>`;
    const t = mtTests.find(x => x.id === mtOpenId);
    if(!t){
      return head + mtTests.map(x => {
        const a = mtLatestAttempt(x.id);
        const nWrong = a ? a.rows.filter(r => r.ok === false).length : 0;
        const c = a ? a.rows.filter(r => r.ok).length : 0, pct = a && a.rows.length ? Math.round(c / a.rows.length * 100) : null;
        return `<div class="mt-row">
          <div class="mt-row-top"><span class="mt-row-title">${esc(x.title)}</span><span class="mt-row-sub">${esc(x.date)}　${esc(x.name)}</span></div>
          ${pct === null ? `<div class="mt-row-sub">${x.questions.length}問・まだ解いていません</div>`
            : `<div class="mt-bar"><span class="${pct < 60 ? "low" : ""}" style="width:${pct}%"></span></div>
               <div class="mt-row-sub">直近 <b>${pct}%</b>（${c}/${a.rows.length}）・全${x.questions.length}問${nWrong ? `・<b style="color:var(--danger);">×${nWrong}問</b>` : ""}</div>`}
          <div class="mt-row-btns">
            <button type="button" class="btn primary" data-mt-open="${esc(x.id)}">${pct === null ? "解く" : "全問を解く"}</button>
            ${nWrong ? `<button type="button" class="btn ghost" data-mt-open="${esc(x.id)}" data-mt-openf="wrong">×だけ解く（${nWrong}）</button>` : ""}</div></div>`;
      }).join("");
    }
    const marked = t.questions.filter(q => mtTake.marks[q.q] !== undefined);
    const ok = marked.filter(q => mtTake.marks[q.q] === true).length;
    const prev = mtLatestAttempt(t.id);
    const prevWrong = prev ? prev.rows.filter(r => r.ok === false).map(r => r.q) : [];
    const prevDone = prev ? prev.rows.map(r => r.q) : [];
    const flt = mtTake.filter === "wrong" || mtTake.filter === "todo" ? mtTake.filter : "all";
    const shownQs = t.questions.filter(q => flt === "wrong" ? prevWrong.includes(q.q) : flt === "todo" ? !prevDone.includes(q.q) : true);
    const fchips = [["all", "全問", t.questions.length], ["wrong", "前回×だけ", prevWrong.length], ["todo", "まだ解いていない問題", t.questions.filter(q => !prevDone.includes(q.q)).length]]
      .map(([v, l, n]) => `<button type="button" class="chip sm ${flt === v ? "selected" : ""}" data-mt-filter="${v}">${l}（${n}）</button>`).join("");
    const qs = shownQs.map(q => {
      const m = mtTake.marks[q.q], shown = !!mtTake.shown[q.q];
      const pickable = mtAnswerNo(q) > 0, pk = mtTake.picked[q.q];
      const sp = pickable && pk !== undefined ? mtSplitExplain(q.explain, q.options.length) : { per: null, pre: "", post: "" };
      const opts = Array.isArray(q.options) && q.options.length
        ? (pickable
          ? `<div style="display:flex; flex-direction:column; gap:6px; margin:6px 0;">${q.options.map((o, i) => {
              const n = i + 1, isAns = n === mtAnswerNo(q), isPk = pk === n;
              const cls = pk === undefined ? "" : (isAns ? " good" : (isPk ? " bad" : ""));
              const optBtn = `<button type="button" class="btn ghost mt-opt${cls}" style="text-align:left; justify-content:flex-start;" data-mt-pick="${esc(q.q)}" data-v="${n}" ${pk !== undefined ? "disabled" : ""}>${n}. ${icText(o)}${pk !== undefined && isAns ? "　✔" : ""}${isPk && !isAns ? "　✖" : ""}</button>`;
              const ex = pk !== undefined && mtTake.exp && mtTake.exp[q.q] && sp.per ? (sp.per[n] || (isAns ? sp.pre : "")) : "";
              return optBtn + (ex ? `<div class="mt-optx${isAns ? " ok" : ""}">${icText(ex)}</div>` : "");
            }).join("")}</div>`
          : `<div style="margin:4px 0 6px;">${q.options.map((o, i) => `<div>${i + 1}. ${icText(o)}</div>`).join("")}</div>`)
        : "";
      return `<div style="border-top:1px solid var(--line); padding:10px 0;">
        <div class="kk-meta">第${esc(q.q)}問${(q.subject || q.field) ? "　" + esc([q.subject, q.field].filter(Boolean).join("／")) : ""}${prevWrong.includes(q.q) ? "　<b style=\"color:var(--danger);\">前回×</b>" : ""}</div>
        <div style="margin:4px 0;">${icText(q.stem)}</div>${opts}
        ${pickable ? (pk !== undefined ? `<div class="ic-q" style="font-size:14px; margin:6px 0;"><b>${pk === mtAnswerNo(q) ? "正解" : "不正解"}　</b><b>正解は ${mtAnswerNo(q)} 番</b></div>
          ${q.explain ? `<button type="button" class="btn ghost block mt-expbtn" data-mt-exp="${esc(q.q)}">${mtTake.exp && mtTake.exp[q.q] ? "解説を閉じる" : "解説を見る"}</button>` : ""}
          ${mtTake.exp && mtTake.exp[q.q] ? (sp.per ? (sp.post ? `<div class="mt-optx post">${icText(sp.post)}</div>` : "") : `<div class="mt-optx ok">${icText(q.explain)}</div>`) : ""}` : "")
        : (shown ? `<div class="ic-q" style="font-size:14px; margin:6px 0;"><b>正解 ${icText(mtAnswerText(q))}</b>${q.explain ? "<br>" + icText(q.explain) : ""}</div>` : "")}
        <div style="display:flex; gap:6px; align-items:center;">
          ${pickable ? (pk !== undefined ? `<button type="button" class="chip sm" data-mt-repick="${esc(q.q)}">選び直す</button>` : "") : `<button type="button" class="chip sm" data-mt-show="${esc(q.q)}">${shown ? "答えを隠す" : "答えを見る"}</button>
          <button type="button" class="chip sm ${m === true ? "selected" : ""}" data-mt-tk="${esc(q.q)}" data-v="1" aria-pressed="${m === true}">○</button>
          <button type="button" class="chip sm ${m === false ? "selected" : ""}" data-mt-tk="${esc(q.q)}" data-v="0" aria-pressed="${m === false}">×</button>`}</div></div>`;
    }).join("");
    return head + `<button type="button" class="btn ghost" data-mt-back="1">← 一覧へ</button>
      <p style="margin:8px 0 2px;"><b>${esc(t.date)}　${esc(t.name)}　${esc(t.title)}</b></p>
      <div class="chip-row" style="margin:6px 0;">${fchips}</div>
      ${shownQs.length ? "" : `<p class="config-note">この絞り込みに当てはまる問題はありません。</p>`}
      <p class="config-note">${marked.length}/${shownQs.length}問を採点済み${marked.length ? "・正解" + ok + "（" + Math.round(ok / marked.length * 100) + "%）" : ""}。自分で答えを見て、○か×をつけてください。</p>
      ${qs}
      <button type="button" class="btn primary block" data-mt-tksave="1" style="margin-top:10px;" ${mtSaving ? "disabled" : ""}>${mtSaving ? "保存中..." : "採点を保存してGitHubに送る"}</button>`;
  }
  async function mtTakeSave(){
    const t = (mtTests || []).find(x => x.id === mtOpenId);
    if(!t || mtSaving) return;
    let rows = t.questions.filter(q => mtTake.marks[q.q] !== undefined).map(q => ({ q: q.q, subject: q.subject || "", field: q.field || "", ok: mtTake.marks[q.q] }));
    if(!rows.length){ showToast("○×を1問以上入力してください"); return; }
    // 絞り込んで解き直したときは、前回の記録に今回の結果を重ねて、全問ぶんの最新の記録にする(正答率が一部の問題だけで決まらないように)
    const prevA = mtTake.filter === "wrong" || mtTake.filter === "todo" ? mtLatestAttempt(t.id) : null;
    if(prevA){
      const byQ = new Map(prevA.rows.map(r => [r.q, r]));
      rows.forEach(r => byQ.set(r.q, r));
      rows = Array.from(byQ.values()).sort((a, b) => a.q - b.q);
    }
    const session = { id: "mt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8), date: todayStr(), name: t.name || "その他", testId: t.id, rows };
    const list = mtLoad(); list.push(session); mtSave(list);
    const c = rows.filter(r => r.ok).length;
    mtOpenId = ""; mtTake = { marks: {}, shown: {}, picked: {} };
    mtSaving = true; renderMiniTest();
    try{
      await mtPushToGitHub();
      showToast("採点を保存しました（" + c + "/" + rows.length + "）");
    }catch(err){
      showToast("この端末には記録しました。GitHub保存は失敗: " + (err && err.message ? err.message : "通信エラー"));
    }finally{
      mtSaving = false; renderMiniTest();
    }
  }

  function renderMiniTest(){
    const el = document.getElementById("minitest-card");
    if(!el) return;
    if(!mtDraft) mtDraft = mtNewDraft();
    const list = mtLoad().slice().sort((a,b)=> (b.date + b.id).localeCompare(a.date + a.id));
    const rowsHtml = mtDraft.rows.map((r, i) => `
      <div style="display:flex; gap:6px; align-items:center; margin:6px 0;">
        <span style="width:26px; font-weight:700; color:var(--sub);">${i+1}</span>
        <select class="memo" style="margin:0; flex:1;" data-mt-field="${i}">${mtOptions(r.value)}</select>
        <button type="button" class="chip sm ${r.ok === true ? "selected" : ""}" data-mt-ok="${i}" data-v="1" aria-pressed="${r.ok === true}">○</button>
        <button type="button" class="chip sm ${r.ok === false ? "selected" : ""}" data-mt-ok="${i}" data-v="0" aria-pressed="${r.ok === false}">×</button>
        <button type="button" class="hist-del" data-mt-del-row="${i}" aria-label="この問題を削除">✕</button>
      </div>`).join("");
    const answered = mtDraft.rows.filter(r => r.ok !== null);
    const correct = answered.filter(r => r.ok === true).length;
    const histHtml = list.slice(0, 5).map(s => {
      const n = s.rows.length, c = s.rows.filter(r => r.ok).length;
      return `<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid var(--line);">
        <span>${esc(s.date)}　${esc(s.name)}　<b>${c}/${n}</b>${mtMinutes(s.minutes) ? "　" + mtMinutes(s.minutes) + "分" : ""}</span>
        <button class="hist-del" data-mt-del="${esc(s.id)}" aria-label="この記録を削除">✕</button></div>`;

    const tt = document.getElementById("mttest-card");
    if(tt) tt.innerHTML = mtTestsHtml();
    if(typeof icApplyTab === "function") icApplyTab();
    el.innerHTML = `
      <h2>ミニテストを記録（手入力）</h2>
      ${mtSummaryHtml(list)}
      <div class="chip-row" style="margin:4px 0;">
        ${MT_NAMES.map(n => `<button type="button" class="chip sm ${mtDraft.name === n ? "selected" : ""}" data-mt-name="${esc(n)}">${esc(n)}</button>`).join("")}
      </div>
      <div class="field-label">テスト分野（選ぶと標準の問題構成が並びます）</div>
      <div class="chip-row" style="margin:4px 0;">
        ${Object.keys(MT_PRESETS).map(k => `<button type="button" class="chip sm" data-mt-preset="${esc(k)}">${esc(k)}</button>`).join("")}
      </div>
      <div class="field-label">実施日</div>
      <input class="memo" type="date" id="mt-date" value="${esc(mtDraft.date)}" style="margin-bottom:6px;">
      <div class="field-label">所要時間（分）</div>
      <input class="memo" type="number" inputmode="numeric" min="1" max="600" step="1" id="mt-minutes" value="${esc(mtDraft.minutes == null ? "" : mtDraft.minutes)}" placeholder="未入力でも保存できます" style="margin-bottom:6px;">
      <div class="field-label">問題ごとの分野と○×（${answered.length}/${mtDraft.rows.length}問入力済み${answered.length ? "・正解" + correct : ""}）</div>
      ${rowsHtml}
      <button type="button" class="btn ghost block" data-mt-add="1" style="margin-top:6px;">＋ 問題を追加</button>
      <button type="button" class="btn primary block" data-mt-submit="1" style="margin-top:10px;" ${mtSaving ? "disabled" : ""}>${mtSaving ? "保存中..." : "記録してGitHubに保存"}</button>
      <p class="config-note" style="margin-top:8px;">問題ごとの正誤を、プロジェクト側の分野別正答率に取り込めるよう <code>${esc(MT_PATH)}</code> に保存します。GitHubトークン未設定のときは、この端末にだけ保存されます。</p>
      ${histHtml ? `<div class="field-label" style="margin-top:12px;">最近の記録</div>${histHtml}` : ""}`;
  }

  // 端末の記録とGitHub上の記録をidで統合して書き込む（削除済みidは除く）
  async function mtPushToGitHub(){
    syncSet("mt", "saving", () => mtPushToGitHub().catch(()=>{}));
    try{ await mtPushToGitHubRaw(); syncSet("mt", "ok"); }
    catch(e){ syncSet("mt", "error"); throw e; }
  }
  async function mtPushToGitHubRaw(){
    const token = requireGithubToken();
    const remote = await getGithubJsonFile(MT_PATH, token);
    const deleted = new Set(mtLoadDeleted());
    const map = new Map();
    ((remote && remote.sessions) || []).forEach(s => { if(!deleted.has(s.id)) map.set(s.id, s); });
    mtLoad().forEach(s => map.set(s.id, { ...(map.get(s.id) || {}), ...s }));   // 端末側にないtestId等は、GitHub側の値を残す
    const sessions = Array.from(map.values()).sort((a,b)=> (a.date + a.id).localeCompare(b.date + b.id));
    const payload = { version: 1, exportedAt: new Date().toISOString(), sessions };
    const now = new Date();
    await putJsonToGitHub(MT_PATH, JSON.stringify(payload, null, 2),
      `もくもく部屋: ミニテスト記録更新 ${dateKey(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`);
    mtSave(sessions);   // 他の端末の分も取り込む
  }

  // 所要時間のあるミニテストは、通常の学習記録としても登録する(合計・ランキング・共有部屋・シートの日次ログに入る)。
  // idをミニテストのidから決めるので、同じ回が二重に登録されることはない。科目なし・0コマなので、科目別の進捗は変わらない。
  function mtStudyRecordId(sessionId){ return "r_mt_" + sessionId; }
  function mtAddStudyRecord(session){
    const started = new Date(session.date + "T12:00:00");
    addRecord({
      id: mtStudyRecordId(session.id),
      date: session.date,
      type: "qualification",
      plannedMinutes: session.minutes,
      actualMinutes: session.minutes,
      note: "ミニテスト" + session.name,
      subject: "",
      startedAt: started.toISOString(),
      endedAt: new Date(started.getTime() + session.minutes * 60000).toISOString(),
      completedNatural: true,
      completedUnits: 0,
      reviewTags: [],
    });
    render();
  }

  async function mtSubmit(){
    if(mtSaving) return;
    const rows = mtDraft.rows.filter(r => r.ok !== null);
    if(rows.length === 0){ showToast("○×を1問以上入力してください"); return; }
    if(!mtDraft.date){ showToast("実施日を入力してください"); return; }
    const minInput = document.getElementById("mt-minutes");   // 入力直後の送信でも、画面の値を使う
    const minutes = mtMinutes(minInput ? minInput.value : mtDraft.minutes);
    const session = {
      id: "mt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
      date: mtDraft.date,
      name: mtDraft.name,
      ...(minutes ? { minutes } : {}),
      rows: mtDraft.rows.map((r, i) => ({ q: i + 1, value: r.value, ok: r.ok })).filter(r => r.ok !== null).map(r => {
        const [subject, field] = r.value.split("／");
        return { q: r.q, subject, field, ok: r.ok };
      }),
    };
    const list = mtLoad(); list.push(session); mtSave(list);
    if(minutes) mtAddStudyRecord(session);
    mtDraft = mtNewDraft();
    mtSaving = true; renderMiniTest();
    try{
      await mtPushToGitHub();
      showToast("ミニテストを記録し、GitHubに保存しました");
      if(minutes) maybeAutoSave();   // 学習記録の側も保存する(同時に書き込まないよう、ミニテストの保存のあとに行う)
    }catch(err){
      showToast("この端末には記録しました。GitHub保存は失敗: " + (err && err.message ? err.message : "通信エラー"));
    }finally{
      mtSaving = false; renderMiniTest();
    }
  }

  (function setupMiniTest(){
    const el = document.getElementById("minitest-card");
    if(!el) return;
    const onClick = e => {
      const t = e.target.closest("button");
      if(!t) return;
      if(t.dataset.mtReload){ mtLoadTests(); }
      else if(t.dataset.mtOpen){ mtOpenId = t.dataset.mtOpen; mtTake = { marks: {}, shown: {}, picked: {}, filter: t.dataset.mtOpenf || "all" }; renderMiniTest(); }
      else if(t.dataset.mtFilter){ mtTake.filter = t.dataset.mtFilter; renderMiniTest(); }
      else if(t.dataset.mtBack){ mtOpenId = ""; mtTake = { marks: {}, shown: {}, picked: {} }; renderMiniTest(); }
      else if(t.dataset.mtPick !== undefined){
        const q = (mtTests || []).flatMap(x => x.id === mtOpenId ? x.questions : []).find(x => String(x.q) === t.dataset.mtPick);
        if(q){
          const n = Number(t.dataset.v);
          mtTake.picked[q.q] = n; mtTake.marks[q.q] = n === mtAnswerNo(q); mtTake.shown[q.q] = true;
          renderMiniTest();
          if(localStorage.getItem(STORAGE.GH_TOKEN)) mtPushToGitHub().catch(()=>{});
        }
      }
      else if(t.dataset.mtExp !== undefined){
        mtTake.exp = mtTake.exp || {}; const k = t.dataset.mtExp; mtTake.exp[k] = !mtTake.exp[k];
        renderMiniTest();
      }
      else if(t.dataset.mtRepick !== undefined){
        const k = t.dataset.mtRepick; delete mtTake.picked[k]; delete mtTake.marks[k]; delete mtTake.shown[k]; if(mtTake.exp) delete mtTake.exp[k];
        renderMiniTest();
      }
      else if(t.dataset.mtShow !== undefined){ const k = t.dataset.mtShow; mtTake.shown[k] = !mtTake.shown[k]; renderMiniTest(); }
      else if(t.dataset.mtTk !== undefined){
        const k = t.dataset.mtTk, v = t.dataset.v === "1";
        if(mtTake.marks[k] === v) delete mtTake.marks[k]; else mtTake.marks[k] = v;
        renderMiniTest();
      }
      else if(t.dataset.mtTksave){ mtTakeSave(); }
      else if(t.dataset.mtName){ mtDraft.name = t.dataset.mtName; renderMiniTest(); }
      else if(t.dataset.mtPreset){
        if(mtDraft.rows.some(r => r.ok !== null) && !confirm("入力済みの○×を消して、並べ直しますか？")) return;
        mtDraft.rows = mtPresetRows(t.dataset.mtPreset); renderMiniTest();
      }
      else if(t.dataset.mtOk !== undefined){
        const i = Number(t.dataset.mtOk), v = t.dataset.v === "1";
        mtDraft.rows[i].ok = mtDraft.rows[i].ok === v ? null : v; renderMiniTest();
      }
      else if(t.dataset.mtAdd){
        const last = mtDraft.rows[mtDraft.rows.length - 1];
        mtDraft.rows.push({ value: last ? last.value : "数的処理／判断推理", ok: null }); renderMiniTest();
      }
      else if(t.dataset.mtDelRow !== undefined){
        mtDraft.rows.splice(Number(t.dataset.mtDelRow), 1);
        if(mtDraft.rows.length === 0) mtDraft.rows.push({ value: "数的処理／判断推理", ok: null });
        renderMiniTest();
      }
      else if(t.dataset.mtSubmit){ mtSubmit(); }
      else if(t.dataset.mtDel){
        if(!confirm("このミニテストの記録を削除しますか？")) return;
        const id = t.dataset.mtDel;
        mtSave(mtLoad().filter(s => s.id !== id));
        const linked = mtStudyRecordId(id);   // 学習記録として登録していた分も、いっしょに消す
        if(loadRecords().some(r => r.id === linked)){
          rememberDeletedId(linked);
          saveRecords(loadRecords().filter(r => r.id !== linked));
          render();
        }
        const d = mtLoadDeleted(); d.push(id); localStorage.setItem(MT_DELETED, JSON.stringify(d));
        renderMiniTest();
        if(localStorage.getItem(STORAGE.GH_TOKEN)) mtPushToGitHub().catch(()=>{});
      }
    };
    el.addEventListener("click", onClick);
    const tt = document.getElementById("mttest-card");
    if(tt) tt.addEventListener("click", onClick);
    el.addEventListener("change", e => {
      const t = e.target;
      if(t.id === "mt-date"){ mtDraft.date = t.value; }
      else if(t.id === "mt-minutes"){ mtDraft.minutes = t.value; }
      else if(t.dataset.mtField !== undefined){ mtDraft.rows[Number(t.dataset.mtField)].value = t.value; }
    });
  })();

  /* ============ 一問一答 ============ */
  // data/ichimon/ のデッキ(○×問題・めくりカード)を1枚ずつ出題する。
  // 結果は端末(localStorage)にだけ保存する。学習記録・ミニテスト・シート・得点推移ボードには送らない。
  const IC_STORAGE = "mokumoku_ichimon_v1";
  const IC_INDEX_URL = "data/ichimon/index.json";
  let icDecks = null;          // index.jsonのdecks
  let icCards = {};            // deckId -> cards[]（読み込んだデッキはメモリに保持して再取得しない）
  let icLoadState = "loading"; // loading | ok | error
  let icTab = "deck";          // deck | mt (一問一答タブの上の切替)
  try{ if(localStorage.getItem("mokumoku_ic_tab") === "mt") icTab = "mt"; }catch(e){}
  let icView = "menu";         // menu | quiz | result | history
  let icSel = { deckId: "", filter: "all", order: "seq", group: "", src: "", limit: "" };   // limit: "" = 全部 / "20" = 20枚だけ(ランダム)
  let icRun = null;            // 出題中: {deckId, queue, i, rows, startedMs, revealed, answer}
  let icLastSessionId = "";
  let icHistoryDeck = "";

  // 端末間の共有: 結果(sessions)を data/ichimon_results.json に保存し、開いたときに他の端末の分を取り込む。
  // カードごとの直近結果(cards)は、sessionsから毎回つくり直すので、どの端末で解いても同じになる。
  const IC_RESULTS_PATH = "data/ichimon_results.json";
  const IC_RESULTS_URL = "https://raw.githubusercontent.com/shenyilangguhe013-cpu/mokumoku/main/data/ichimon_results.json";
  let icSyncing = false, icSyncAgain = false, icSyncTimer = null, icLastPull = 0;

  function icSessionTs(s){ const m = /^ic_(\d+)_/.exec((s && s.id) || ""); return m ? Number(m[1]) : 0; }
  function icValidSession(s){
    return !!s && typeof s.id === "string" && DATE_RE.test(s.date || "") && typeof s.deckId === "string" &&
      Array.isArray(s.rows) && s.rows.every(r => r && typeof r.cardId === "string" && typeof r.ok === "boolean");
  }
  // sessionsをidで統合する(同じidは端末側が優先: 所要時間を直した分を残す)。cardsはsessionsから作り直す。
  function icMerge(local, remote){
    const map = new Map();
    (remote && Array.isArray(remote.sessions) ? remote.sessions : []).filter(icValidSession).forEach(s => map.set(s.id, s));
    local.sessions.filter(icValidSession).forEach(s => map.set(s.id, s));
    const sessions = Array.from(map.values()).sort((a, b) => (icSessionTs(a) - icSessionTs(b)) || a.id.localeCompare(b.id));
    const cards = {};
    sessions.forEach(s => {
      const ts = icSessionTs(s) || Date.parse(s.date + "T00:00:00") || 0;
      const at = new Date(ts).toISOString();
      s.rows.forEach(r => {
        const prev = cards[r.cardId];
        cards[r.cardId] = { ok: r.ok, at, n: (prev ? prev.n : 0) + 1 };
      });
    });
    return { sessions, cards };
  }
  // 自動の取り込みは、認証なしで読める公開URLから(トークンが無効でも、起動時に通知を出さない)。
  // 「他の端末と同期する」を押したときだけ、APIで最新の内容を読む(viaApi)。
  async function icPull(force, viaApi){
    if(!force && Date.now() - icLastPull < 60000) return;
    icLastPull = Date.now();
    try{
      const token = localStorage.getItem(STORAGE.GH_TOKEN);
      let remote = null;
      if(viaApi && token && !githubAuthFailed){
        remote = await getGithubJsonFile(IC_RESULTS_PATH, token);
      }else{
        const res = await fetch(IC_RESULTS_URL + "?_=" + Date.now(), { cache: "no-store" });
        if(res.ok) remote = await res.json();
      }
      if(!remote) return;
      icSave(icMerge(icLoad(), remote));
      if(icView !== "quiz" && icView !== "result") renderIchimon();
    }catch(e){ /* 取り込めなくても、この端末の結果で動く */ }
  }
  async function icPush(manual){
    icDirty = false;
    if(icSyncing){ icSyncAgain = true; return; }
    const token = localStorage.getItem(STORAGE.GH_TOKEN);
    if(!token || githubAuthFailed){ if(manual) showToast("先にGitHubトークンを設定してください（その他タブ）"); return; }
    icSyncing = true;
    syncSet("ic", "saving", () => icPush(true));
    try{
      const remote = await getGithubJsonFile(IC_RESULTS_PATH, token);
      const merged = icMerge(icLoad(), remote);
      icSave(merged);
      const now = new Date();
      await putJsonToGitHub(IC_RESULTS_PATH,
        JSON.stringify({ version: 1, exportedAt: now.toISOString(), sessions: merged.sessions }, null, 2),
        `もくもく部屋: 一問一答の結果を更新 ${dateKey(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`);
      syncSet("ic", "ok");
      if(manual) showToast("一問一答の結果を同期しました");
      if(icView !== "quiz" && icView !== "result") renderIchimon();
    }catch(err){
      syncSet("ic", "error", () => icPush(true));
      showToast("一問一答の結果をGitHubに保存できませんでした: " + (err && err.message ? err.message : "通信エラー"));
    }finally{
      icSyncing = false;
      if(icSyncAgain){ icSyncAgain = false; icQueueSync(500); }
    }
  }
  // 学習の自動保存と同じ設定(オフなら、自動では保存しない)に従う
  function icQueueSync(ms){
    if(!autoSaveEnabled() || !localStorage.getItem(STORAGE.GH_TOKEN)) return;
    icDirty = true;
    if(kkInReview()) return;   // 復習の最中は保存しない(終了時にまとめて保存)
    clearTimeout(icSyncTimer);
    icSyncTimer = setTimeout(() => icPush(false), ms);
  }

  function icLoad(){
    try{
      const d = JSON.parse(localStorage.getItem(IC_STORAGE) || "{}") || {};
      return { sessions: Array.isArray(d.sessions) ? d.sessions : [], cards: d.cards && typeof d.cards === "object" ? d.cards : {} };
    }catch(e){ return { sessions: [], cards: {} }; }
  }
  function icSave(data){
    try{ localStorage.setItem(IC_STORAGE, JSON.stringify(data)); }catch(e){ /* 保存できなくても、画面は動かし続ける */ }
  }
  // ｜漢字《よみ》 を <ruby> に変える（先にesc()して、安全にしてから変換する）
  function icText(s){
    return esc(s == null ? "" : s).replace(/｜([^《]+)《([^》]+)》/g, "<ruby>$1<rt>$2</rt></ruby>").replace(/\n/g, "<br>");
  }

  // ×の文(ok:false)の「誤りの部分」。カードの errs: [{wrong, right, why}] があれば、答えたあとに、
  //  ・文の中の wrong(文中にそのまま含まれる語句)に線を引き、
  //  ・「何に直すと○になるか(right)」と「その部分の解説(why)」を出す。errs が無いカードは、これまでどおり理由(r)だけ。
  function icStatementHtml(card, mark){
    const s = String(card && card.s != null ? card.s : "");
    const errs = mark && card && Array.isArray(card.errs) ? card.errs : [];
    const spans = errs.map(e=>({ i: s.indexOf(String((e && e.wrong) || "")), n: String((e && e.wrong) || "").length, right: String((e && e.right) || "") }))
      .filter(x=>x.i >= 0 && x.n > 0).sort((a, b)=>a.i - b.i);
    if(!spans.length) return icText(s);
    let out = "", pos = 0;
    spans.forEach(sp=>{
      if(sp.i < pos) return;   // 重なる指定は飛ばす
      out += icText(s.slice(pos, sp.i)) + `<u class="ic-miss">${icText(s.slice(sp.i, sp.i + sp.n))}</u>` + (sp.right ? `<span class="ic-fix">［→ ${icText(sp.right)}］</span>` : "");
      pos = sp.i + sp.n;
    });
    return out + icText(s.slice(pos));
  }
  function icErrsHtml(card){
    const errs = card && Array.isArray(card.errs) ? card.errs.filter(e=>e && e.wrong && e.right) : [];
    if(!errs.length) return "";
    // 誤りの部分と正しい表現は、問題文の中(下線のすぐ後ろ)に出しているので、ここでは解説(why)だけを出す。whyが無いときだけ「誤り→正しくは」を出す。
    const fixRow = e => `<div class="ic-err-fix"><span class="ic-err-x"><small>誤り</small> <s>${icText(e.wrong)}</s></span><span class="ic-err-o"><small>正しくは</small> <b>${icText(e.right)}</b></span></div>`;
    return `<div class="ic-errs">` + errs.map(e=>`<div class="ic-err">
        ${e.why ? `<div class="ic-err-why">${icText(e.why)}</div>` : fixRow(e)}</div>`).join("")
      + `<p class="ic-err-note">${errs.length > 1 ? "線を引いた部分を、すべて直すと" : "線を引いた部分を直すと"}、この文は ○ になります。</p></div>`;
  }

  // index.jsonのfileにフォルダ名がない(ファイル名だけ)ときは、index.jsonと同じフォルダのファイルとみなす
  function icFileUrl(file){
    return String(file).includes("/") ? file : IC_INDEX_URL.replace(/[^/]*$/, "") + file;
  }

  async function icLoadDecks(){
    icLoadState = "loading"; renderIchimon();
    try{
      const res = await fetch(IC_INDEX_URL);
      if(!res.ok) throw new Error("http " + res.status);
      const idx = await res.json();
      if(!idx || !Array.isArray(idx.decks)) throw new Error("bad index");
      icDecks = idx.decks.filter(d => d && d.id && d.file && (d.type === "ox" || d.type === "flash"));
      const results = await Promise.allSettled(icDecks.map(async d => {
        const r = await fetch(icFileUrl(d.file));
        if(!r.ok) throw new Error("http " + r.status);
        const j = await r.json();
        if(!j || !Array.isArray(j.cards)) throw new Error("bad deck");
        icCards[d.id] = j.cards.filter(c => c && c.id);
      }));
      icLoadState = icDecks.length && results.some(x => x.status === "fulfilled") ? "ok" : "error";
      icAddMtDeck();
      if(!icSel.deckId && icDecks.length) icSel.deckId = (icDecks.find(d => icCards[d.id]) || icDecks[0]).id;
    }catch(e){
      icLoadState = "error";
    }
    renderIchimon();
  }

  function icDeck(id){ return (icDecks || []).find(d => d.id === id); }
  function icDeckStat(deck){
    const data = icLoad();
    const cards = icCards[deck.id] || [];
    if(deck.type === "flash"){
      const known = cards.filter(c => data.cards[c.id] && data.cards[c.id].ok === true).length;
      return `覚えた ${known}/${cards.length || deck.count}`;
    }
    const last = data.sessions.filter(s => s.deckId === deck.id).sort((a,b)=> (b.date + b.id).localeCompare(a.date + a.id))[0];
    if(!last || !last.rows.length) return "まだ解いていません";
    const c = last.rows.filter(r => r.ok).length;
    return `直近 ${Math.round(c / last.rows.length * 100)}%（${c}/${last.rows.length}）`;
  }
  const IC_SAMPLE_SIZE = 20;
  // 1回のセッションの出題数。「20枚だけ」のときは、絞り込んだカードからランダムに20枚(出題順は、あとで並べ直す)
  function icSessionCards(){
    const pool = icPool();
    if(icSel.limit !== String(IC_SAMPLE_SIZE) || pool.length <= IC_SAMPLE_SIZE) return pool;
    const idx = pool.map((c, i) => i);
    for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return idx.slice(0, IC_SAMPLE_SIZE).sort((a, b) => a - b).map(i => pool[i]);
  }
  function icPool(){
    const deck = icDeck(icSel.deckId);
    let cards = (icCards[icSel.deckId] || []).slice();
    if(!deck) return [];
    const data = icLoad();
    if(icSel.group) cards = cards.filter(c => c.group === icSel.group);
    if(icSel.src) cards = cards.filter(c => c.src === icSel.src);
    if(icSel.filter === "wrong") cards = cards.filter(c => data.cards[c.id] && data.cards[c.id].ok === false);
    if(icSel.filter === "todo") cards = cards.filter(c => !(data.cards[c.id] && data.cards[c.id].ok === true));
    return cards;
  }

  // 「ア～エの記述のうち…」の問題は、選択肢の番号(カードidの末尾の数字 1〜4)を ア〜エ で表示する。idは数字のまま。
  function icChoiceLabel(card){
    if(!card || !/ア[～〜~]エ/.test(card.ask || "")) return "";
    const m = /-(\d+)$/.exec(card.id || "");
    return m ? (["ア", "イ", "ウ", "エ"][Number(m[1]) - 1] || "") : "";
  }
  function icChoiceHtml(card){
    const label = icChoiceLabel(card);
    return label ? `<span class="ic-label">${label}</span>` : "";
  }

  function icStart(){
    const pool = icSessionCards();
    if(pool.length === 0){ showToast("出題できるカードがありません"); return; }
    let queue = pool.slice();
    if(icSel.order === "shuffle"){
      for(let i = queue.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
    }
    icRun = { deckId: icSel.deckId, queue, i: 0, rows: [], startedMs: Date.now(), revealed: false, answer: null };
    icView = "quiz";
    renderIchimon();
  }

  // ox: ok=○と答えたか。flash: ok=覚えた。結果を記録して、答えを見せる(ox)/次へ進む(flash)
  function icAnswer(value){
    if(!icRun || icView !== "quiz") return;
    const card = icRun.queue[icRun.i];
    const deck = icDeck(icRun.deckId);
    if(deck.type === "ox"){
      if(icRun.answer !== null) return;
      icRun.answer = value;
      icRun.rows.push({ cardId: card.id, ok: value === card.ok });
      renderIchimon();
    }else{
      if(!icRun.revealed) return;
      icRun.rows.push({ cardId: card.id, ok: value });
      icNext();
    }
  }
  function icNext(){
    if(!icRun) return;
    const deck = icDeck(icRun.deckId);
    if(deck.type === "ox" && icRun.answer === null) return;
    icRun.i++; icRun.revealed = false; icRun.answer = null;
    if(icRun.i >= icRun.queue.length) icFinish(); else renderIchimon();
  }

  // 終了: セッションとカードごとの直近結果を保存する。所要時間は自動計測の値を初期値にして、結果画面で直せる。
  function icFinish(){
    if(!icRun) return;
    if(icRun.rows.length === 0){ icRun = null; icView = "menu"; renderIchimon(); return; }
    const deck = icDeck(icRun.deckId);
    const minutes = Math.max(1, Math.round((Date.now() - icRun.startedMs) / 60000));
    const data = icLoad();
    const nowIso = new Date().toISOString();
    icRun.rows.forEach(r => {
      const prev = data.cards[r.cardId];
      data.cards[r.cardId] = { ok: r.ok, at: nowIso, n: (prev && Number.isInteger(prev.n) ? prev.n : 0) + 1 };
    });
    const session = {
      id: "ic_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
      date: todayStr(), deckId: deck.id, deckTitle: deck.title, minutes, rows: icRun.rows.slice(),
    };
    data.sessions.push(session);
    icSave(data);
    icLastSessionId = session.id;
    icRun = null; icView = "result";
    renderIchimon();
    icQueueSync(300);
  }

  function icSetMinutes(value){
    const n = Math.round(Number(value));
    if(!(n > 0)) return;
    const data = icLoad();
    const s = data.sessions.find(x => x.id === icLastSessionId);
    if(s){ s.minutes = Math.min(600, n); icSave(data); icQueueSync(1500); }
  }

  function icChips(attr, items, current){
    return items.map(([v, label]) => `<button type="button" class="chip sm ${current === v ? "selected" : ""}" ${attr}="${esc(v)}">${esc(label)}</button>`).join("");
  }

  // 上の切替(デッキ／ミニテスト)。出題中・結果の画面では隠す
  function icApplyTab(){
    const seg = document.getElementById("ic-seg"), dc = document.getElementById("ichimon-card"), mc = document.getElementById("mttest-card");
    if(!seg || !dc || !mc) return;
    const running = icView === "quiz" || icView === "result";
    const mtShow = !running && icTab === "mt";
    seg.classList.toggle("view-hidden", running);
    dc.classList.toggle("view-hidden", mtShow);
    mc.classList.toggle("view-hidden", !mtShow);
    let nWrong = 0;
    (mtTests || []).forEach(t => { const a = mtLatestAttempt(t.id); if(a) nWrong += a.rows.filter(r => r.ok === false).length; });
    seg.innerHTML = `<button type="button" data-ic-seg="deck" class="${icTab === "deck" ? "on" : ""}">デッキ</button>
      <button type="button" data-ic-seg="mt" class="${icTab === "mt" ? "on" : ""}">ミニテスト${nWrong ? `<span class="ic-seg-n">×${nWrong}</span>` : ""}</button>`;
  }
  (function setupIcSeg(){
    const seg = document.getElementById("ic-seg");
    if(!seg) return;
    seg.addEventListener("click", e => {
      const b = e.target.closest("button[data-ic-seg]");
      if(!b) return;
      icTab = b.dataset.icSeg === "mt" ? "mt" : "deck";
      try{ localStorage.setItem("mokumoku_ic_tab", icTab); }catch(err){}
      icApplyTab();
    });
  })();
  function renderIchimon(){
    const el = document.getElementById("ichimon-card");
    if(!el) return;
    setTimeout(icApplyTab, 0);
    if(icLoadState === "loading"){ el.innerHTML = `<h2>一問一答</h2><p class="config-note">読み込み中...</p>`; return; }
    if(icLoadState === "error" || !icDecks){
      el.innerHTML = `<h2>一問一答</h2><p class="config-note">データを読み込めませんでした。</p>
        <button type="button" class="btn ghost block" data-ic-reload="1">もう一度読み込む</button>`;
      return;
    }
    if(icView === "quiz" && icRun) el.innerHTML = icQuizHtml();
    else if(icView === "result") el.innerHTML = icResultHtml();
    else if(icView === "history") el.innerHTML = icHistoryHtml();
    else el.innerHTML = icMenuHtml();
  }

  function icMenuHtml(){
    const deck = icDeck(icSel.deckId);
    const cards = icCards[icSel.deckId] || [];
    const groups = Array.from(new Set(cards.map(c => c.group).filter(Boolean)));
    const srcCount = new Map();
    cards.forEach(c => { if(c.src) srcCount.set(c.src, (srcCount.get(c.src) || 0) + 1); });
    const srcs = Array.from(srcCount.entries());
    const filters = deck && deck.type === "flash" ? [["all", "全部"], ["todo", "まだのカードだけ"]] : [["all", "全部"], ["wrong", "間違えたカードだけ"]];
    const poolSize = icPool().length;
    const pool = { length: icSel.limit === String(IC_SAMPLE_SIZE) ? Math.min(poolSize, IC_SAMPLE_SIZE) : poolSize };
    const decksHtml = icDecks.map(d => `
      <button type="button" class="ic-deck ${d.id === icSel.deckId ? "selected" : ""}" data-ic-deck="${esc(d.id)}" ${icCards[d.id] ? "" : "disabled"}>
        <span class="ic-deck-title">${esc(d.title)}</span>
        <span class="ic-deck-meta">${esc(d.count)}枚・${d.type === "ox" ? "○×" : "めくり"}　${icCards[d.id] ? esc(icDeckStat(d)) : "読み込めませんでした"}</span>
      </button>`).join("");
    return `
      <h2>一問一答</h2>
      <div class="field-label" style="margin-top:0;">① デッキを選ぶ</div>
      <div class="ic-decks">${decksHtml}</div>
      <div class="ic-start-box">
        <div class="ic-start-sum">選択中：<b>${esc(deck ? deck.title : "（なし）")}</b></div>
        <button type="button" class="btn primary block" data-ic-start="1" ${pool.length ? "" : "disabled"}>${pool.length ? `② はじめる（${pool.length}枚）` : "出題できるカードがありません"}</button>
      </div>
      <div class="ic-opts">
        <div class="ic-opts-title">出題の設定（必要なときだけ）</div>
        <div class="field-label">絞り込み</div>
        <div class="chip-row" style="margin:4px 0;">${icChips("data-ic-filter", filters, icSel.filter)}</div>
        ${groups.length > 1 ? `<div class="field-label">分野</div>
          <div class="chip-row" style="margin:4px 0;">${icChips("data-ic-group", [["", "すべて"], ...groups.map(g => [g, g])], icSel.group)}</div>` : ""}
        ${srcs.length > 1 ? `<div class="field-label">出典</div>
          <select class="memo" id="ic-src" style="margin:4px 0 8px;"><option value="">すべての出典（${cards.length}枚）</option>${srcs.map(([v, n]) => `<option value="${esc(v)}" ${v === icSel.src ? "selected" : ""}>${esc(v)}（${n}枚）</option>`).join("")}</select>` : ""}
        <div class="field-label">出題数</div>
        <div class="chip-row" style="margin:4px 0;">${icChips("data-ic-limit", [["", "全部"], [String(IC_SAMPLE_SIZE), `${IC_SAMPLE_SIZE}枚だけ（ランダム）`]], icSel.limit)}</div>
        <div class="field-label">順序</div>
        <div class="chip-row" style="margin:4px 0;">${icChips("data-ic-order", [["seq", "出題順"], ["shuffle", "シャッフル"]], icSel.order)}</div>
      </div>
      <div class="row-btns" style="margin-top:12px;">
        <button type="button" class="btn ghost" data-ic-history="1">履歴を見る</button>
        ${localStorage.getItem(STORAGE.GH_TOKEN) ? `<button type="button" class="btn ghost" data-ic-sync="1">他の端末と同期する</button>` : ""}
      </div>
      ${localStorage.getItem(STORAGE.GH_TOKEN) ? `<p class="config-note">結果は <code>${esc(IC_RESULTS_PATH)}</code> に保存し、他の端末の分も取り込みます。</p>` : `<p class="config-note">GitHubトークンを設定すると、結果が端末間で共有されます（その他タブ）。</p>`}`;
  }

  function icQuizHtml(){
    const deck = icDeck(icRun.deckId), card = icRun.queue[icRun.i];
    const head = `<h2>${esc(deck.title)}</h2>
      <div class="ic-progress"><span>${icRun.i + 1} / ${icRun.queue.length}</span><span>${esc(card.group || "")}${card.src ? "・" + esc(card.src) : ""}</span></div>`;
    const quit = `<button type="button" class="btn ghost block" data-ic-quit="1" style="margin-top:12px;">ここで終わる</button>`;
    if(deck.type === "ox"){
      const done = icRun.answer !== null;
      const correct = done && icRun.answer === card.ok;
      // 答えたあとは、結果と「次へ」を一番上に置く(解説が長くても、スクロールせずに次へ進める)
      const topBar = done ? `<div class="ic-topbar"><div class="ic-result ${correct ? "good" : "bad"}"><b>${correct ? "正解" : "不正解"}</b>　正しくは ${card.ok ? "○" : "×"}</div>
        <button type="button" class="btn primary" data-ic-next="1">${icRun.i + 1 >= icRun.queue.length ? "結果を見る" : "次へ"}</button></div>` : "";
      return `${head}
        ${topBar}
        ${card.ask ? `<p class="config-note" style="margin:0 0 6px;">${icText(card.ask)}</p>` : ""}
        <div class="ic-q">${icChoiceHtml(card)}${icStatementHtml(card, done)}</div>
        <div class="row-btns" style="margin-top:12px;">
          <button type="button" class="btn ic-ox ${done && icRun.answer === true ? "picked" : ""}" data-ic-ox="1" ${done ? "disabled" : ""}>○</button>
          <button type="button" class="btn ic-ox ${done && icRun.answer === false ? "picked" : ""}" data-ic-ox="0" ${done ? "disabled" : ""}>×</button>
        </div>
        ${done ? `
          ${card.provisional ? `<p class="config-note" style="color:var(--amber);">正解は暫定です。</p>` : ""}
          ${icErrsHtml(card)}
          ${card.r ? (Array.isArray(card.errs) && card.errs.length ? `<details class="ic-orig"><summary>もとの解説（全文）</summary><div class="ic-reason">${icText(card.r)}</div></details>` : `<div class="ic-reason">${icText(card.r)}</div>`) : ""}
          <p class="config-note">出典: ${esc(card.src || "")}${card.topic ? "（" + esc(card.topic) + "）" : ""}</p>` : ""}
        ${quit}
        <p class="config-note">キー: O/1 = ○、X/2 = ×、Enter/→ = 次へ</p>`;
    }
    return `${head}
      <div class="ic-q">${icText(card.q)}</div>
      ${icRun.revealed ? `
        <div class="ic-ans">${icText(card.a)}</div>
        <div class="row-btns" style="margin-top:12px;">
          <button type="button" class="btn ghost" data-ic-flash="0">まだ</button>
          <button type="button" class="btn primary" data-ic-flash="1">覚えた</button>
        </div>` : `
        <button type="button" class="btn primary block" data-ic-reveal="1" style="margin-top:12px;">答えを見る</button>`}
      ${quit}
      <p class="config-note">キー: Enter/Space = 答えを見る、O/1 = 覚えた、X/2 = まだ</p>`;
  }

  function icResultHtml(){
    const data = icLoad();
    const s = data.sessions.find(x => x.id === icLastSessionId);
    if(!s){ icView = "menu"; return icMenuHtml(); }
    const deck = icDeck(s.deckId);
    const c = s.rows.filter(r => r.ok).length;
    const wrong = s.rows.filter(r => !r.ok).map(r => (icCards[s.deckId] || []).find(x => x.id === r.cardId)).filter(Boolean);
    const wrongHtml = wrong.map(card => `
      <div class="ic-wrong">
        <div>${icChoiceHtml(card)}${icText(card.s != null ? card.s : card.q)}</div>
        <div class="ic-reason">${card.s != null ? "正しくは " + (card.ok ? "○" : "×") + "。" + icText(card.r || "") : icText(card.a)}</div>
      </div>`).join("");
    return `
      <h2>結果</h2>
      <p class="ic-score"><b>${c}</b> / ${s.rows.length}　（${Math.round(c / s.rows.length * 100)}%）</p>
      <p class="config-note" style="margin:0 0 6px;">${esc(s.deckTitle)}</p>
      <div class="field-label">所要時間（分）</div>
      <input class="memo" type="number" inputmode="numeric" min="1" max="600" step="1" id="ic-minutes" value="${esc(s.minutes)}">
      ${wrong.length ? `<div class="field-label" style="margin-top:6px;">${deck && deck.type === "flash" ? "まだのカード" : "間違えたカード"}（${wrong.length}）</div>${wrongHtml}` : `<p class="config-note">全問正解です。</p>`}
      <button type="button" class="btn primary block" data-ic-menu="1" style="margin-top:12px;">デッキ選択にもどる</button>`;
  }

  function icHistoryHtml(){
    const data = icLoad();
    const deckId = icHistoryDeck || icSel.deckId;
    const list = data.sessions.filter(s => s.deckId === deckId).sort((a,b)=> (b.date + b.id).localeCompare(a.date + a.id)).slice(0, 30);
    const rows = list.map(s => {
      const c = s.rows.filter(r => r.ok).length;
      return `<div class="hist-item"><div class="hist-main"><span>${esc(s.date)}</span><b>${Math.round(c / (s.rows.length || 1) * 100)}%（${c}/${s.rows.length}）・${esc(s.minutes)}分</b></div></div>`;
    }).join("");
    return `
      <h2>履歴</h2>
      <div class="chip-row" style="margin:4px 0;">${icChips("data-ic-histdeck", icDecks.map(d => [d.id, d.title]), deckId)}</div>
      ${rows || `<div class="hist-item">まだ記録がありません</div>`}
      <button type="button" class="btn ghost block" data-ic-menu="1" style="margin-top:12px;">もどる</button>`;
  }

  (function setupIchimon(){
    const el = document.getElementById("ichimon-card");
    if(!el) return;
    el.addEventListener("click", e => {
      const t = e.target.closest("button");
      if(!t || t.disabled) return;
      const d = t.dataset;
      if(d.icReload){ icLoadDecks(); }
      else if(d.icDeck){ icSel.deckId = d.icDeck; icSel.group = ""; icSel.src = ""; icSel.filter = "all"; renderIchimon(); }
      else if(d.icFilter !== undefined){ icSel.filter = d.icFilter; renderIchimon(); }
      else if(d.icGroup !== undefined){ icSel.group = d.icGroup; renderIchimon(); }
      else if(d.icOrder){ icSel.order = d.icOrder; renderIchimon(); }
      else if(d.icLimit !== undefined){ icSel.limit = d.icLimit; renderIchimon(); }
      else if(d.icStart){ icStart(); }
      else if(d.icSync){ icPull(true, true).then(() => icPush(true)); }
      else if(d.icHistory){ icHistoryDeck = icSel.deckId; icView = "history"; renderIchimon(); }
      else if(d.icHistdeck){ icHistoryDeck = d.icHistdeck; renderIchimon(); }
      else if(d.icMenu){ icView = "menu"; renderIchimon(); }
      else if(d.icOx !== undefined){ icAnswer(d.icOx === "1"); }
      else if(d.icNext){ icNext(); }
      else if(d.icReveal){ icRun.revealed = true; renderIchimon(); }
      else if(d.icFlash !== undefined){ icAnswer(d.icFlash === "1"); }
      else if(d.icQuit){ icFinish(); }
    });
    el.addEventListener("change", e => {
      if(e.target.id === "ic-minutes") icSetMinutes(e.target.value);
      else if(e.target.id === "ic-src"){ icSel.src = e.target.value; renderIchimon(); }
    });
    el.addEventListener("input", e => {
      if(e.target.id === "ic-minutes") icSetMinutes(e.target.value);
    });
    document.addEventListener("keydown", e => {
      if(icView !== "quiz" || !icRun || currentTab !== "ichimon") return;
      if(e.ctrlKey || e.metaKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || "";
      if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      const deck = icDeck(icRun.deckId);
      const k = e.key;
      if(deck.type === "ox"){
        if(k === "o" || k === "O" || k === "1") icAnswer(true);
        else if(k === "x" || k === "X" || k === "2") icAnswer(false);
        else if(k === "Enter" || k === "ArrowRight"){ e.preventDefault(); icNext(); }
      }else{
        if(!icRun.revealed){
          if(k === "Enter" || k === " " || k === "ArrowRight"){ e.preventDefault(); icRun.revealed = true; renderIchimon(); }
        }else{
          if(k === "o" || k === "O" || k === "1") icAnswer(true);
          else if(k === "x" || k === "X" || k === "2") icAnswer(false);
        }
      }
    });
  })();

  /* ============ アプリの自動更新チェック ============ */
  // iPhoneのホーム画面から開いたアプリは、古い画面のコピーを使い続けることがある。
  // 起動のたびに、サーバー上の最新のコードを取りに行き(キャッシュも更新する)、今動いているコードと違えば、
  // 1回だけ再読み込みして、最新の画面に切り替える。記録はlocalStorageにあるので、再読み込みしても消えない。
  function hashText(text){
    let h = 5381;
    for(let i=0;i<text.length;i++){ h = ((h << 5) + h + text.charCodeAt(i)) | 0; }
    return String(h >>> 0);
  }
  async function checkForAppUpdate(){
    try{
      if(!/^https?:$/.test(location.protocol)) return;      // file:// など、サーバーから開いていないときは何もしない
      const mine = Array.from(document.scripts).find(el => !el.src && el.textContent.includes("function checkForAppUpdate"));
      if(!mine) return;
      // cache:"reload" は、ブラウザのキャッシュを使わず取得し、キャッシュも最新に書き換える
      const res = await fetch(location.pathname, { cache: "reload" });
      if(!res.ok) return;
      const html = await res.text();
      const m = /<script>([\s\S]*)<\/script>/.exec(html);
      if(!m) return;
      const latest = hashText(m[1]);
      if(latest === hashText(mine.textContent)) return;
      // 再読み込みしても同じ違いが続く場合に、繰り返さないよう、同じ版では1回だけにする
      let tried = null;
      try{ tried = sessionStorage.getItem("mokumoku_update_tried"); }catch(e){}
      if(tried === latest) return;
      try{ sessionStorage.setItem("mokumoku_update_tried", latest); }catch(e){}
      location.reload();
    }catch(e){ /* 通信できないときなどは、何もしない(今の画面のまま使える) */ }
  }

  /* ============ 初期化 ============ */

  // 削除した機能(共有部屋・予定と実績・今日使える時間・文字サイズ切替)が、この端末に残した保存値を消す
  ["mokumoku_shared_v1", "mokumoku_planlog_v1", "mokumoku_avail_min_v1", "mokumoku_fontscale_v1"].forEach(k=>{
    try{ localStorage.removeItem(k); }catch(e){}
  });
  setupAppleIcon();
  const examInput = document.getElementById("exam-date-input");
  if(examInput) examInput.value = loadExamDate();
  render();
  renderGithubSettings();
  renderManualEntry();
  renderTaskViews();
  renderMiniTest();
  mtLoadTests();
  icLoadDecks();
  icPull(true);
  fetchTodayTasks();
  fetchPlan();
  fetchProgress();
  renderSchedulePhotos();
  checkForAppUpdate();

})();
</script>
