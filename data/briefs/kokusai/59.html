<title>国際関係 第59回 冷戦の始まり：封じ込めからNATO・ワルシャワ条約機構へ</title><style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP',Meiryo,sans-serif;font-size:16px;line-height:1.7}

.cap{font-size:13px;color:var(--sub);margin:0 0 8px}
ul.pt{margin:6px 0;padding-left:20px}ul.pt li{margin:3px 0}
.goal{border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}

.goal .gn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--amber-bg);color:var(--amber);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.goal .gt{font-weight:700;flex:1}
.goal .gs{flex:none;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--bg);color:var(--sub);align-self:center}
.goal.ok .gs{background:var(--green-bg);color:var(--green)}.goal.ng .gs{background:var(--red-bg);color:var(--red)}
.goal .ga{padding:0 12px 12px 46px;display:none}.goal.open .ga{display:block}
.goal ul{margin:4px 0 8px;padding-left:18px}.goal li{margin:3px 0}
.jb{display:flex;gap:8px}.jb button,.rel button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.prog{font-size:13px;color:var(--sub);margin:2px 0 6px}
.map{display:grid;gap:5px;margin-top:6px}
.lh{font-size:11.5px;font-weight:700;text-align:center;border-radius:8px;padding:5px 2px;line-height:1.3}
.yr{font-size:11px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:flex-end;padding-right:4px;line-height:1.2;text-align:right}
.nd{font:inherit;font-size:12px;line-height:1.35;text-align:left;border:2px solid transparent;border-radius:10px;padding:7px;min-height:58px;cursor:pointer;color:var(--ink)}
.nd b{display:block;font-size:12.5px}
.c0{background:var(--vio-bg);color:var(--vio)}.c1{background:var(--blue-bg);color:var(--blue)}.c2{background:var(--green-bg);color:var(--green)}.c3{background:var(--teal-bg);color:var(--teal)}.c4{background:var(--pink-bg);color:var(--pink)}.c5{background:var(--amber-bg);color:var(--amber)}

.rel{display:flex;flex-wrap:wrap;gap:6px;margin:3px 0}
