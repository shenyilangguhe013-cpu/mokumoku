      <form class="kk-search" data-action="kk-search-form"><input type="search" id="kk-q" placeholder="全回から言葉を検索（例: 日韓基本条約）" value="${esc(kkSearch.term)}" autocomplete="off"><button type="submit" class="btn primary">検索</button></form>
      <div class="kk-filter" style="margin-top:0;">
        <b class="kk-label">絞り込み</b>
        <button type="button" class="chip sm${kkBmOnly ? " selected" : ""}" data-action="kk-bm-filter">★ ブックマークだけ(${bm.size})</button>
        <button type="button" class="chip sm${kkUnreadOnly ? " selected" : ""}" data-action="kk-unread-filter">未読だけ</button>
      </div>
      <div class="kk-section">各回の一覧（新しい順・タップで開く）</div>
      ${!items.length ? `<p class="config-note">${kkBmOnly ? "ブックマークした回はまだありません。各回の ☆ を押すと追加できます。" : "該当する回はありません。"}</p>` : ""}
      ${items.map(it=> it.missing
        ? `<div class="kk-item missing"><div class="kk-meta">第${esc(it.n)}回 / ${esc(it.date || "-")}<span class="kk-badge">欠番</span></div><div class="kk-theme">${esc(it.theme || "")}</div></div>`
        : `<div class="kk-row"><button type="button" class="kk-item" data-action="kk-open" data-n="${esc(it.n)}"><div class="kk-meta">第${esc(it.n)}回 / ${esc(it.date || "-")}${read.has(Number(it.n)) ? `<span class="kk-badge read">✓ 既読</span>` : `<span class="kk-badge new">未読</span>`}</div><div class="kk-theme">${esc(it.theme || "")}</div></button><button type="button" class="kk-star${bm.has(Number(it.n)) ? " on" : ""}" data-action="kk-bm" data-n="${esc(it.n)}" aria-label="ブックマーク" aria-pressed="${bm.has(Number(it.n))}">${bm.has(Number(it.n)) ? "★" : "☆"}</button></div>`
      ).join("")}`;
  }

  /* ---- 回をまたぐ検索 ---- */
  const kkSearch = { term: "", loading: false, done: 0, total: 0, results: [] };
  const kkTexts = {};   // n -> 本文テキスト(メモリのみ)
  function kkHtmlToText(html){
    try{
      const d = new DOMParser().parseFromString(html, "text/html");
      d.querySelectorAll("script,style").forEach(x=>x.remove());
      return (d.body ? d.body.textContent : "").replace(/\s+/g, " ").trim();
    }catch(e){ return ""; }
  }
  async function kkLoadAllTexts(){
    const items = (kkIndex && kkIndex.items || []).filter(it=>!it.missing && it.file && kkTexts[it.n] === undefined);
    kkSearch.total = items.length; kkSearch.done = 0;
    let i = 0;
    async function worker(){
      while(i < items.length){
        const it = items[i++];
        let html = null;
        try{ html = await kkFetchText(it.file); }catch(e){ html = kkCacheGet("body_"+it.file); }
        kkTexts[it.n] = html ? kkHtmlToText(html) : "";
        kkSearch.done++;
        if(kkMode === "search") kkRenderSearch();
      }
    }
    await Promise.all([worker(), worker(), worker(), worker(), worker()]);
  }
  function kkSnippets(text, term, max){
    const out = [], lo = text.toLowerCase(), t = term.toLowerCase();
    let i = 0, count = 0;
    while((i = lo.indexOf(t, i)) >= 0){
      count++;
      if(out.length < max){
        const from = Math.max(0, i - 28), to = Math.min(text.length, i + term.length + 40);
        out.push((from > 0 ? "…" : "") + esc(text.slice(from, i)) + "<mark>" + esc(text.slice(i, i + term.length)) + "</mark>" + esc(text.slice(i + term.length, to)) + (to < text.length ? "…" : ""));
      }
      i += term.length;
    }
    return { count, out };
  }
  async function kkRunSearch(term){
    term = String(term || "").trim();
    kkSearch.term = term;
    if(!term){ kkMode = "list"; kkRenderView(); return; }
    kkMode = "search"; kkSearch.loading = true;
    kkRenderSearch();
    await kkLoadAllTexts();
    kkSearch.loading = false;
    if(kkSearch.term !== term) return;
    kkSearch.results = (kkIndex.items || []).filter(it=>!it.missing && kkTexts[it.n])
      .map(it=>({ it, ...kkSnippets(kkTexts[it.n], term, 3) })).filter(r=>r.count > 0)
      .sort((a,b)=>b.it.n - a.it.n);
    if(kkMode === "search") kkRenderSearch();
  }
  function kkRenderSearch(){
    const el = document.getElementById("kokusai-card");
    if(!el) return;
    const head = `<div class="kk-top"><button type="button" class="btn ghost" data-action="kk-to-list">← 一覧へ</button><b>検索</b></div>
      <form class="kk-search" data-action="kk-search-form"><input type="search" id="kk-q" value="${esc(kkSearch.term)}" autocomplete="off"><button type="submit" class="btn primary">検索</button></form>`;
    if(kkSearch.loading){
      el.innerHTML = head + `<p class="config-note">全回の本文を読み込み中... ${kkSearch.done}/${kkSearch.total}</p><div class="kk-bar-t"><span class="kk-bar-f" style="width:${kkSearch.total ? Math.round(kkSearch.done / kkSearch.total * 100) : 0}%"></span></div>`;
      return;
    }
    const total = kkSearch.results.reduce((a,r)=>a+r.count, 0);
    el.innerHTML = head + `<p class="config-note">「${esc(kkSearch.term)}」: ${kkSearch.results.length}回・${total}件</p>` +
      (kkSearch.results.map(r=>`<button type="button" class="kk-item" data-action="kk-open-find" data-n="${esc(r.it.n)}"><div class="kk-meta">第${esc(r.it.n)}回 / ${esc(r.it.date || "-")}<span class="kk-badge">${r.count}件</span></div><div class="kk-theme">${esc(r.it.theme || "")}</div>${r.out.map(x=>`<div class="kk-snip">${x}</div>`).join("")}</button>`).join("") || `<p class="config-note">見つかりませんでした。</p>`);
  }

  /* ---- 今日の復習(間隔反復): ×の問題を、正解するたびに 1→3→7→14日 と間隔をあけて出す ---- */
  const KK_REVIEW_MAX = 5, KK_REVIEW_STEPS = [1, 3, 7, 14];
  let kkReview = null;   // {ids, i, results, answered}
  function kkDayNum(ts){ // "2026-10-24T09:00:00+09:00" → 日付の通し番号(JST)
    const d = String(ts).slice(0, 10).split("-").map(Number);
    return Math.round(Date.UTC(d[0], d[1] - 1, d[2]) / 86400000);
  }
  function kkDueQuestions(){
    if(!kkQuestions) return [];
    const qmap = {}; (kkQuestions.items || []).forEach(q=>qmap[q.id] = q);
    const by = {};
    kqLoad().forEach(a=>{ (by[a.qid] || (by[a.qid] = [])).push(a); });
    const today = kkDayNum(kqNowJst());
    const out = [];
    Object.keys(by).forEach(id=>{
      const q = qmap[id]; if(!q) return;
      const list = by[id].sort((a,b)=>a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0);
      if(!list.some(a=>!a.ok)) return;                // ×が一度もない問題は対象外
      let k = 0;                                      // 最後の×のあとに続けて正解した回数
      for(let i = list.length - 1; i >= 0 && list[i].ok; i--) k++;
      if(k >= KK_REVIEW_STEPS.length) return;         // 14日まで正解し続けたら卒業
      const dueDay = kkDayNum(list[list.length - 1].ts) + KK_REVIEW_STEPS[k];
      if(dueDay <= today) out.push({ q, dueDay, k });
    });
    return out.sort((a,b)=>a.dueDay - b.dueDay || a.q.n - b.q.n).map(x=>x.q);
  }
  // 一問一答の復習対象: 結果(sessions)の履歴から、国際関係と同じ間隔(1→3→7→14日)で出す
  function kkDueIchimon(){
    const by = {};
    icLoad().sessions.forEach(s=>{
      const ts = icSessionTs(s) || Date.parse(s.date + "T00:00:00") || 0;
      (s.rows || []).forEach(r=>{ (by[r.cardId] || (by[r.cardId] = [])).push({ ts, ok: r.ok }); });
    });
    const dayOf = ms => Math.floor((ms + 9*3600*1000) / 86400000);   // 日本時間の日付番号
    const today = dayOf(Date.now());
    const known = icDecks ? new Set(icDecks.flatMap(d => (icCards[d.id] || []).map(c => c.id))) : null;
    const out = [];
    Object.keys(by).forEach(id=>{
      if(known && !known.has(id)) return;
      const list = by[id].sort((a,b)=>a.ts - b.ts);
      if(!list.some(x=>!x.ok)) return;
      let k = 0;
      for(let i = list.length - 1; i >= 0 && list[i].ok; i--) k++;
      if(k >= KK_REVIEW_STEPS.length) return;
      const dueDay = dayOf(list[list.length - 1].ts) + KK_REVIEW_STEPS[k];
      if(dueDay <= today) out.push({ id, dueDay });
    });
    return out.sort((a,b)=>a.dueDay - b.dueDay);
  }
  function kkReviewStart(){
    const kk = kkDueQuestions().slice(0, KK_REVIEW_MAX).map(q=>({ src: "kk", id: q.id }));
    const ic = kkDueIchimon().slice(0, KK_REVIEW_MAX).map(x=>({ src: "ic", id: x.id }));
    const items = kk.concat(ic);
    if(!items.length){ showToast("今日の復習はありません"); return; }
    kkReview = { items, i: 0, results: [], picked: null, revealed: false };
    kkMode = "review"; kkRenderView();
  }
  function kkRenderReview(){
    const el = document.getElementById("kokusai-card");
    if(!el || !kkReview) return;
    if(kkReview.i >= kkReview.items.length){
      flushSyncs();   // 復習を終えたので、たまった結果をまとめて保存する
      const ok = kkReview.results.filter(Boolean).length;
      el.innerHTML = `<div class="kk-top"><button type="button" class="btn ghost" data-action="kk-to-list">← 一覧へ</button><b>今日の復習</b></div>
        <div class="kk-stats"><div class="kk-stat"><div class="kk-big">${ok}/${kkReview.items.length}</div><div class="kk-meta">正解</div></div></div>
        <p class="config-note">正解した問題は、次は${KK_REVIEW_STEPS.slice(1).join("→")}日…と間隔をあけて出ます。間違えた問題は、明日もう一度出ます。</p>`;
      return;
    }
    const it = kkReview.items[kkReview.i];
    const head = `<div class="kk-top"><button type="button" class="btn ghost" data-action="kk-to-list">← やめる</button><b>今日の復習 ${kkReview.i + 1}/${kkReview.items.length}</b></div>`;
    const nextBtn = `<button type="button" class="btn primary" data-action="kk-review-next">${kkReview.i + 1 < kkReview.items.length ? "次へ" : "結果を見る"}</button>`;
    if(it.src === "ic"){
      const f = kkIcFind(it.id);
      if(!f){ el.innerHTML = head + `<p class="config-note">問題を読み込めませんでした。</p>` + nextBtn; return; }
      const { deck, card } = f, ox = deck.type === "ox", r = kkReview.results[kkReview.i];
      const answered = r !== undefined;
      el.innerHTML = head + `<div class="kk-meta">一問一答 ／ ${esc(deck.title)}${card.group ? " ／ " + esc(card.group) : ""}</div>
        <div class="kk-q">${ox ? esc(card.ask || "") : icText(card.q || "")}</div>
        ${ox ? `<div class="kk-ans">${icStatementHtml(card, answered)}</div>` : ""}
        ${!answered ? (ox
          ? `<div class="kk-btns"><button type="button" class="kk-opt" data-action="kk-review-ic" data-v="1">○</button><button type="button" class="kk-opt" data-action="kk-review-ic" data-v="0">×</button></div>`
          : (kkReview.revealed
              ? `<div class="kk-explain"><div class="kk-answer-box"><span class="kk-ab-label">答え</span><b class="kk-ok">${icText(card.a || "")}</b></div></div><div class="kk-btns"><button type="button" class="kk-opt" data-action="kk-review-ic" data-v="1">覚えた</button><button type="button" class="kk-opt" data-action="kk-review-ic" data-v="0">まだ</button></div>`
              : `<button type="button" class="btn ghost" data-action="kk-review-reveal">答えを見る</button>`))
          : `<div class="kk-rv-bar"><span class="kk-rv-res"><b class="${r ? "kk-ok" : "kk-ng"}">${ox ? (r ? "正解" : "不正解") : (r ? "覚えた" : "まだ")}</b>${ox ? `　正解は <b class="kk-ok">${card.ok ? "○" : "×"}</b>` : ""}</span>${nextBtn}</div>
            ${ox ? `<details class="kk-rv-exp"><summary>理由を見る</summary>${kkIcExpHtml(deck, card)}</details>` : ""}`}`;
      kkReviewFit(el, String((ox ? (card.ask || "") + (card.s || "") : (card.q || "") + (card.a || ""))).length, answered);
      return;
    }
    const q = (kkQuestions.items || []).find(x=>x.id === it.id);
    const p = kkReview.picked;
    el.innerHTML = head + `
      <div class="kk-meta">第${esc(q.n)}回 ／ ${esc(q.theme || "")} ／ ${esc(kkKindLabel(q))}</div>
      <div class="kk-q">${esc(q.q)}</div>
      ${Object.keys(q.opts).map(k=>`<button type="button" class="kk-opt${p ? (k === q.ans ? " ok" : (k === p ? " ng" : "")) : ""}" ${p ? "disabled" : ""} data-action="kk-review-pick" data-k="${esc(k)}"><b>${esc(k)}</b> ${esc(q.opts[k])}</button>`).join("")}
      ${p ? `<div class="kk-rv-bar"><span class="kk-rv-res">${p === q.ans ? `<b class="kk-ok">正解 ${esc(q.ans)}</b>` : `<b class="kk-ng">不正解</b>　正解は <b class="kk-ok">${esc(q.ans)}</b>`}</span>${nextBtn}</div>
        <details class="kk-rv-exp"><summary>解説を見る</summary>${kkExpHtml(q, p)}</details>` : ""}`;
    kkReviewFit(el, (q.q + Object.values(q.opts).join("")).length, !!p);
  }
  // 復習画面を1画面に収める: 長い問題は、文字と余白を少し詰める。答えたら、結果と「次へ」が見える位置までスクロールする
  function kkReviewFit(el, len, answered){
    const short = window.innerHeight < 700;   // 画面の低い端末では、短い問題からも詰める
    el.classList.toggle("kk-rv-dense", len > (short ? 50 : 120));
    el.classList.toggle("kk-rv-tight", short && len > 200);
    if(answered){
      const bar = el.querySelector(".kk-rv-bar"), tab = document.querySelector("nav.tabbar");
      if(bar && tab){
        const over = bar.getBoundingClientRect().bottom - (tab.getBoundingClientRect().top - 8);   // 「次へ」がタブバーに隠れていたら、その分だけ下へスクロール
        if(over > 0) window.scrollBy(0, over);
      }
    }
  }
  function kkReviewPick(k){
    if(!kkReview || kkReview.picked) return;
    const q = (kkQuestions.items || []).find(x=>x.id === kkReview.items[kkReview.i].id);
    const a = kqRecord(q.id, q.n, k, q.ans);
    kkReview.picked = k; kkReview.results[kkReview.i] = a.ok;
    kkRenderReview();
  }
  function kkReviewIc(v){   // 一問一答の回答(○× または 覚えた/まだ)
    if(!kkReview) return;
    const f = kkIcFind(kkReview.items[kkReview.i].id);
    if(!f || kkReview.results[kkReview.i] !== undefined) return;
    const ok = f.deck.type === "ox" ? (v === f.card.ok) : v;
    kkIcRecord(f.deck, f.card, ok);
    kkReview.results[kkReview.i] = ok;
    kkRenderReview();
  }
  function kkReviewNext(){
    if(!kkReview) return;
    kkReview.i++; kkReview.picked = null; kkReview.revealed = false; kkRenderReview();
  }

  /* ---- 解説の表示(正解・ポイント・くわしく の3段に分けて読みやすくする) ---- */
  function kkMark(s){   // esc済みの文に、括弧の補足(小さく・いちばん外側だけ)と年(太字)の装飾をつける
    let out = "", depth = 0;
    for(const ch of s){
      if(ch === "(" || ch === "（"){ if(depth === 0) out += '<span class="kk-paren">（'; else out += "（"; depth++; }
      else if((ch === ")" || ch === "）") && depth > 0){ depth--; out += depth === 0 ? "）</span>" : "）"; }
      else out += ch;
    }
    while(depth-- > 0) out += "</span>";
    return out.replace(/(\d{4}年(?:\d{1,2}月)?)/g, "<b>$1</b>");
  }
  function kkSentences(text){ return String(text || "").split(/(?<=。)/).map(x=>x.trim()).filter(Boolean); }
  function kkExpBody(text){
    const ss = kkSentences(text);
    if(!ss.length) return "";
    const li = a => `<ul class="kk-ex-list">${a.map(x=>`<li>${kkMark(esc(x))}</li>`).join("")}</ul>`;
    const detail = ss.slice(1, 4), more = ss.slice(4);
    return `<div class="kk-point"><span class="kk-pl">ポイント</span><p>${kkMark(esc(ss[0]))}</p></div>`
      + (detail.length ? `<div class="kk-detail"><span class="kk-pl">くわしく</span>${li(detail)}</div>` : "")
      + (more.length ? `<details class="kk-more"><summary>さらにくわしく（あと${more.length}文）</summary>${li(more)}</details>` : "");
  }
  function kkExpHtml(q, picked){
    const wrong = picked && picked !== q.ans;
    return `<div class="kk-explain">
      <div class="kk-answer-box"><div><span class="kk-ab-label">正解</span><b class="kk-ok">${esc(q.ans)}</b>　${esc(q.opts[q.ans] || "")}</div>
        ${wrong ? `<div class="kk-yours"><span class="kk-ab-label">あなたの答え</span><b class="kk-ng">${esc(picked)}</b>　${esc(q.opts[picked] || "")}</div>` : ""}</div>
      ${kkExpBody(q.exp)}</div>`;
  }

  /* ---- まちがい集 ---- */
  function kkKindLabel(q){ return q.kind === "本日の一問" ? "本日の一問" : `復習クイズ 問${q.no}`; }

  // 「苦手」: 同じ問題を2回以上間違えたもの
  const KK_WEAK_MIN = 2;
  function kkWrongCounts(){ const m = {}; kqLoad().forEach(a=>{ if(!a.ok) m[a.qid] = (m[a.qid] || 0) + 1; }); return m; }
  function kkIcWrongCounts(){
    const m = {};
    icLoad().sessions.forEach(s => (s.rows || []).forEach(r => { if(r.ok === false) m[r.cardId] = (m[r.cardId] || 0) + 1; }));
    return m;
  }
  function kkWeakBadge(n){ return n >= KK_WEAK_MIN ? `<span class="kk-badge weak">🔥 苦手（×${n}回）</span>` : (n === 1 ? `<span class="kk-badge">×1回</span>` : ""); }
  function kkWeakChips(){
    return `<button type="button" class="chip sm${kkFilter.weak ? " selected" : ""}" data-action="kk-weak">🔥 苦手だけ</button>
      <button type="button" class="chip sm${kkFilter.sortWrong ? " selected" : ""}" data-action="kk-sortwrong">間違いの多い順</button>`;
  }
  function kkMistakeCards(){
    const attempts = kqLoad();
    const latest = kqLatest(attempts);
    const everWrong = new Set(attempts.filter(a=>!a.ok).map(a=>a.qid));
    const wc = kkWrongCounts();
    return (kkQuestions.items || [])
      .filter(q => {
        if(kkFilter.weak && (wc[q.id] || 0) < KK_WEAK_MIN) return false;
        if(q.n < kkFilter.from) return false;
        if(kkFilter.only && q.n !== kkFilter.only) return false;
        if(kkFilter.kind !== "all" && q.kind !== kkFilter.kind) return false;
        const l = latest[q.id];
        if(kkFilter.unreviewedOnly) return l && !l.ok;
        return everWrong.has(q.id);
      })
      .sort((a,b)=> (kkFilter.sortWrong ? (wc[b.id] || 0) - (wc[a.id] || 0) : 0) || b.n - a.n || a.no - b.no)
      .map(q => ({ q, last: latest[q.id], wrong: wc[q.id] || 0 }));
  }

  function kkMistakeCardHtml(q, last, wrong){
    const reviewed = last && last.ok;
    return `
      <div class="kk-mcard" data-qid="${esc(q.id)}">
        <div class="kk-meta">第${esc(q.n)}回 ／ ${esc(q.theme || "")}</div>
        <div class="kk-meta"><b>${esc(kkKindLabel(q))}</b>${reviewed ? `<span class="kk-badge">復習済み</span>` : ""}${kkWeakBadge(wrong)}</div>
        <div class="kk-q">${esc(q.q)}</div>
        <p class="kk-hint">解き直すと、正解と解説が見られます。</p>
        <div class="kk-btns">
          <button type="button" class="btn ghost" data-action="kk-open-from-mistakes" data-n="${esc(q.n)}">その回を開く</button>
          <button type="button" class="btn primary" data-action="kk-resolve" data-qid="${esc(q.id)}">解き直す</button>
        </div>
        <div class="kk-solve"></div>
        <div class="kk-explain-box"></div>
      </div>`;
  }

  function kkThemeOf(n){ const it = (kkIndex && kkIndex.items || []).find(x=>Number(x.n) === Number(n)); return it ? it.theme || "" : ""; }
  // まちがい集の上部: 戻る＋ソース切替(国際関係／一問一答／ミニテスト)
  function kkSourceHead(){
    const src = [["kokusai", "国際関係", kkWrongKokusai()], ["ichimon", "一問一答", kkWrongIchimon()], ["minitest", "ミニテスト", kkWrongMinitest()]];
    return `<div class="kk-top"><button type="button" class="btn ghost" data-action="kk-to-list">← 一覧へ</button><b>まちがい集</b></div>
      <div class="kk-filter" style="margin-top:0;">${src.map(([k, label, n])=>`<button type="button" class="chip sm${kkFilter.source === k ? " selected" : ""}" data-action="kk-source" data-src="${k}">${label}（${n}）</button>`).join("")}</div>`;
  }

  // 一問一答の×カード(最新の結果が×のもの)
  function kkIcWrongCards(){
    const cards = icLoad().cards, out = [];
    (icDecks || []).forEach(deck => (icCards[deck.id] || []).forEach(c => {
      if(cards[c.id] && cards[c.id].ok === false) out.push({ deck, card: c });
    }));
    return out;
  }
  function kkRenderIcMistakes(el){
    if(!icDecks && icLoadState !== "error"){ icLoadDecks().then(()=>{ if(kkMode === "mistakes") kkRenderMistakes(); }); }
    const wc = kkIcWrongCounts();
    let list = icDecks ? kkIcWrongCards() : [];
    if(kkFilter.weak) list = list.filter(x => (wc[x.card.id] || 0) >= KK_WEAK_MIN);
    if(kkFilter.sortWrong) list = list.slice().sort((a,b) => (wc[b.card.id] || 0) - (wc[a.card.id] || 0));
    el.innerHTML = `${kkSourceHead()}
      ${!icDecks ? `<p class="config-note">一問一答のデータを読み込み中、または読み込めませんでした。</p>` : ""}
      <div class="kk-stats"><div class="kk-stat"><div class="kk-big kk-ng">${list.length}</div><div class="kk-meta">×の問題（最新の結果）</div></div></div>
      <div class="kk-filter">${kkWeakChips()}</div>
      ${list.length ? list.slice(0, 60).map(({deck, card})=>{
        const ox = deck.type === "ox";
        return `<div class="kk-mcard" data-cid="${esc(card.id)}">
          <div class="kk-meta">${esc(deck.title)}${card.group ? " ／ " + esc(card.group) : ""}${kkWeakBadge(wc[card.id] || 0)}</div>
          <div class="kk-q">${ox ? esc(card.ask || "") : icText(card.q || "")}</div>
          ${ox ? `<div class="kk-ans">${icText(card.s || "")}</div>` : ""}
          <p class="kk-hint">解き直すと、正解と解説が見られます。</p>
          <div class="kk-btns"><button type="button" class="btn primary" data-action="kk-ic-solve" data-cid="${esc(card.id)}">解き直す</button></div>
          <div class="kk-solve"></div><div class="kk-explain-box"></div></div>`;
      }).join("") : (icDecks ? `<p class="config-note">×の問題はありません。</p>` : "")}
      ${list.length > 60 ? `<p class="config-note">先頭60問を表示しています。</p>` : ""}`;
  }
  function kkIcFind(cid){
    for(const deck of (icDecks || [])){ const c = (icCards[deck.id] || []).find(x=>x.id === cid); if(c) return { deck, card: c }; }
    return null;
  }
  function kkIcSolveOpen(cid){
    const f = kkIcFind(cid), box = document.querySelector(`.kk-mcard[data-cid="${CSS.escape(cid)}"] .kk-solve`);
    if(!f || !box) return;
    kkHold = true;
    box.innerHTML = f.deck.type === "ox"
      ? `<div class="kk-btns"><button type="button" class="kk-opt" data-action="kk-ic-pick" data-cid="${esc(cid)}" data-v="1">○</button><button type="button" class="kk-opt" data-action="kk-ic-pick" data-cid="${esc(cid)}" data-v="0">×</button></div><div class="kk-result"></div>`
      : `<p class="kk-ans">答えを思い出してから、判定してください。</p><div class="kk-btns"><button type="button" class="kk-opt" data-action="kk-ic-pick" data-cid="${esc(cid)}" data-v="1">覚えた</button><button type="button" class="kk-opt" data-action="kk-ic-pick" data-cid="${esc(cid)}" data-v="0">まだ</button></div><div class="kk-result"></div>`;
  }
  // 一問一答の1枚の結果を、通常の結果(sessions)として記録する(解き直し・今日の復習で共通)
  function kkIcRecord(deck, card, ok){
    const data = icLoad(), prev = data.cards[card.id];
    data.cards[card.id] = { ok, at: new Date().toISOString(), n: (prev && Number.isInteger(prev.n) ? prev.n : 0) + 1 };
    data.sessions.push({ id: "ic_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8), date: todayStr(), deckId: deck.id, deckTitle: deck.title, minutes: 1, rows: [{ cardId: card.id, ok }] });
    icSave(data);
    icQueueSync(SYNC_QUIET_MS);   // 1問ごとには保存せず、答える手が止まってから、まとめて1回保存する
  }
  // 一問一答の答えと解説(正解を先に、理由を文ごとに区切って見せる)
  function kkIcExpHtml(deck, card){
    const ox = deck.type === "ox";
    const ss = kkSentences(ox ? card.r : "");
    const hasErrs = ox && Array.isArray(card.errs) && card.errs.length;
    return `<div class="kk-explain"><div class="kk-answer-box"><div><span class="kk-ab-label">${ox ? "正解" : "答え"}</span><b class="kk-ok">${ox ? (card.ok ? "○" : "×") : icText(card.a || "")}</b></div></div>
      ${hasErrs ? icErrsHtml(card) : ""}
      ${ss.length ? (hasErrs
        ? `<details class="ic-orig"><summary>もとの解説（全文）</summary><ul class="kk-ex-list">${ss.map(x=>`<li>${icText(x)}</li>`).join("")}</ul></details>`
        : `<div class="kk-point"><span class="kk-pl">理由</span><ul class="kk-ex-list">${ss.map(x=>`<li>${icText(x)}</li>`).join("")}</ul></div>`) : ""}</div>`;
  }
  function kkIcPick(cid, v){
    const f = kkIcFind(cid), card = document.querySelector(`.kk-mcard[data-cid="${CSS.escape(cid)}"]`);
    if(!f || !card) return;
    const ok = f.deck.type === "ox" ? (v === f.card.ok) : v;
    kkIcRecord(f.deck, f.card, ok);
    const hint = card.querySelector(".kk-hint"); if(hint) hint.remove();
    const box = card.querySelector(".kk-explain-box"); if(box) box.innerHTML = kkIcExpHtml(f.deck, f.card);
    const stmt = card.querySelector(".kk-ans"); if(stmt && f.deck.type === "ox") stmt.innerHTML = icStatementHtml(f.card, true);
    const res = card.querySelector(".kk-result");
    if(ok){ res.innerHTML = `<b class="kk-ok">復習できました</b> <button type="button" class="btn ghost" data-action="kk-done">次へ（一覧を更新）</button>`; }
    else res.innerHTML = `<b class="kk-ng">不正解です。もう一度どうぞ</b>`;
  }

  // 問題つきミニテスト: 各テストの最新の採点で×だった問題を、問題文・正解・解説つきで出す
  function kkMtWrongHtml(){
    if(!mtTests || !mtTests.length) return "";
    const items = [];
    mtTests.forEach(t => {
      const a = mtLatestAttempt(t.id); if(!a) return;
      a.rows.filter(r => r.ok === false).forEach(r => { const q = t.questions.find(x => String(x.q) === String(r.q)); if(q) items.push({ t, q }); });
    });
    if(!items.length) return `<p class="config-note">問題つきミニテストで、いま×の問題はありません。</p>`;
    return `<div class="kk-weak"><b>×の問題（問題つきミニテスト・最新の採点）${items.length}問</b></div>` + items.map(({ t, q }) => `<div class="kk-mcard">
      <div class="kk-meta">${esc(t.date)} ${esc(t.name)} ／ 第${esc(q.q)}問${q.field ? " ／ " + esc(q.field) : ""}</div>
      <div class="kk-q">${icText(mtQuestionText(q))}</div>
      <div class="ic-q" style="font-size:14px; margin:6px 0;"><b>正解 ${icText(mtAnswerText(q))}</b>${q.explain ? "<br>" + icText(q.explain) : ""}</div></div>`).join("");
  }
  // ミニテスト: 科目・分野ごとの弱点と、問題つきテストの×の問題
  function kkRenderMtMistakes(el){
    const by = {};
    mtLoad().forEach(s => (s.rows || []).forEach(r => {
      if(r.ok !== true && r.ok !== false) return;
      const key = (r.subject || "未分類") + (r.field ? " ／ " + r.field : "");
      const o = by[key] || (by[key] = { key, a: 0, c: 0 });
      o.a++; if(r.ok) o.c++;
    }));
    const rows = Object.values(by).sort((a,b)=> (a.c / a.a) - (b.c / b.a) || b.a - a.a);
    const wrong = rows.reduce((t,r)=>t + r.a - r.c, 0), all = rows.reduce((t,r)=>t + r.a, 0), ok = all - wrong;
    el.innerHTML = `${kkSourceHead()}
      <div class="kk-stats"><div class="kk-stat"><div class="kk-big">${all ? Math.round(ok / all * 100) + "%" : "-"}</div><div class="kk-meta">正答率(${ok}/${all})</div></div>
        <div class="kk-stat"><div class="kk-big kk-ng">${wrong}</div><div class="kk-meta">×の問題</div></div></div>
      <div class="kk-weak"><b>弱点の分野（正答率の低い順）</b></div>
      <div class="kk-chart">${rows.map(r=>{ const pct = Math.round(r.c / r.a * 100); return `<div class="kk-bar-row kk-bar-wide"><span class="kk-bar-l">${esc(r.key)}</span><span class="kk-bar-t"><span class="kk-bar-f${pct < 60 ? " low" : ""}" style="width:${pct}%"></span></span><span class="kk-bar-v">${pct}% (${r.c}/${r.a})</span></div>`; }).join("") || `<p class="config-note">ミニテストの記録がありません。</p>`}</div>
      ${kkMtWrongHtml()}
      <p class="config-note">問題文を保存していない記録（手入力）は、分野別の正答率だけが出ます。問題つきミニテストの×は、上に問題文つきで並びます。</p>`;
  }

  function kkRenderMistakes(){
    const el = document.getElementById("kokusai-card");
    if(!el) return;
    if(kkFilter.source === "ichimon") return kkRenderIcMistakes(el);
    if(kkFilter.source === "minitest") return kkRenderMtMistakes(el);
    if(!kkQuestions){
      el.innerHTML = `<button type="button" class="btn ghost" data-action="kk-to-list">← 一覧へ</button><p class="config-note" style="margin-top:10px;">問題データを読み込み中、または読み込めませんでした。</p><button class="btn ghost" data-action="kk-reload">再読み込み</button>`;
      return;
    }
    const qs = kkQuestions.items || [];
    const qmap = {}; qs.forEach(q=>qmap[q.id] = q);
    const latest = kqLatest(kqLoad());
    // 回ごとの集計(questions.jsonにある問題だけ。最新の結果で数える)
    const per = {};
    let answered = 0, correct = 0, wrong = 0;
    Object.keys(latest).forEach(id=>{
      const q = qmap[id]; if(!q) return;
      const p = per[q.n] || (per[q.n] = { n: q.n, a: 0, c: 0 });
      p.a++; answered++;
      if(latest[id].ok){ p.c++; correct++; } else wrong++;
    });
    const rows = Object.values(per).sort((a,b)=>b.n-a.n);
    const rate = answered ? Math.round(correct / answered * 100) : 0;
    const issues = Array.from(new Set(qs.map(q=>q.n))).sort((a,b)=>b-a);
    const cards = kkMistakeCards();
    const weak = rows.filter(r=>r.a >= 2 && r.c < r.a).sort((a,b)=> (a.c / a.a) - (b.c / b.a) || b.n - a.n).slice(0, 5);
    el.innerHTML = `
      ${kkSourceHead()}
      <p class="config-note" style="margin:0 0 8px;">×＝最新の結果が不正解の問題です。解き直して正解すると、一覧から消えます。</p>
      <div class="kk-stats">
        <div class="kk-stat"><div class="kk-big">${answered ? rate + "%" : "-"}</div><div class="kk-meta">全体の正答率(${correct}/${answered})</div></div>
        <div class="kk-stat"><div class="kk-big kk-ng">${wrong}</div><div class="kk-meta">×の問題</div></div>
      </div>
      ${rows.length ? `<div class="kk-chart" role="img" aria-label="回ごとの正答率">
        ${rows.map(r=>{ const pct = Math.round(r.c / r.a * 100); return `<div class="kk-bar-row"><span class="kk-bar-l">第${r.n}回</span><span class="kk-bar-t"><span class="kk-bar-f${pct < 60 ? " low" : ""}" style="width:${pct}%"></span></span><span class="kk-bar-v">${pct}% (${r.c}/${r.a})</span></div>`; }).join("")}
      </div>` : `<p class="config-note">まだ回答がありません。</p>`}
      ${weak.length ? `<div class="kk-weak"><b>弱点テーマ（正答率の低い回）</b>${weak.map(r=>`<div class="kk-weak-row"><span class="kk-weak-t">第${r.n}回 ${esc(kkThemeOf(r.n))}</span><span class="kk-bar-v">${Math.round(r.c / r.a * 100)}% (${r.c}/${r.a})</span><button type="button" class="chip sm${kkFilter.only === r.n ? " selected" : ""}" data-action="kk-only" data-n="${r.n}">この回の×だけ</button></div>`).join("")}</div>` : ""}
      <div class="kk-filter">
        ${kkFilter.only ? `<button type="button" class="chip sm selected" data-action="kk-only" data-n="0">第${kkFilter.only}回のみ ✕</button>` : ""}
        <label>回 <select data-action="kk-filter-from"><option value="0">すべて</option>${issues.map(n=>`<option value="${n}" ${kkFilter.from === n ? "selected" : ""}>第${n}回〜</option>`).join("")}</select></label>
        ${["all","本日の一問","復習クイズ"].map(k=>`<button type="button" class="chip sm${kkFilter.kind === k ? " selected" : ""}" data-action="kk-filter-kind" data-kind="${k}">${k === "all" ? "すべて" : k}</button>`).join("")}
        <button type="button" class="chip sm${kkFilter.unreviewedOnly ? " selected" : ""}" data-action="kk-filter-unrev">未復習のみ</button>
        ${kkWeakChips()}
      </div>
      <div id="kk-mlist">${cards.length ? cards.map(c=>kkMistakeCardHtml(c.q, c.last, c.wrong)).join("") : `<p class="config-note">該当する問題はありません。</p>`}</div>`;
  }

  // 解き直し(カード内で選択肢を出す)
  function kkOpenSolve(qid){
    const q = (kkQuestions.items || []).find(x=>x.id === qid);
    const card = document.querySelector(`.kk-mcard[data-qid="${CSS.escape(qid)}"]`);
    if(!q || !card) return;
    const box = card.querySelector(".kk-solve");
    kkHold = true;
    box.innerHTML = Object.keys(q.opts).map(k=>`<button type="button" class="kk-opt" data-action="kk-pick" data-qid="${esc(qid)}" data-k="${esc(k)}"><b>${esc(k)}</b> ${esc(q.opts[k])}</button>`).join("") + `<div class="kk-result"></div>`;
  }
  function kkPick(qid, k){
    const q = (kkQuestions.items || []).find(x=>x.id === qid);
    const card = document.querySelector(`.kk-mcard[data-qid="${CSS.escape(qid)}"]`);
    if(!q || !card) return;
    const a = kqRecord(qid, q.n, k, q.ans);
    const res = card.querySelector(".kk-result");
    card.querySelectorAll(".kk-opt").forEach(b=>{ b.classList.toggle("ok", b.dataset.k === q.ans); b.classList.toggle("ng", b.dataset.k === k && !a.ok); });
    const hint = card.querySelector(".kk-hint"); if(hint) hint.remove();
    const box = card.querySelector(".kk-explain-box"); if(box) box.innerHTML = kkExpHtml(q, k);
    if(a.ok){
      res.innerHTML = `<b class="kk-ok">復習できました</b> <button type="button" class="btn ghost" data-action="kk-done">次へ（一覧を更新）</button>`;
    }else{
      res.innerHTML = `<b class="kk-ng">不正解です。もう一度どうぞ</b>`;
    }
  }

  /* ---- 本文(全画面)。複数の回をスタックで重ね、戻ると元の位置に戻る ---- */
  function kkReader(){
    let r = document.getElementById("kk-reader");
    if(!r){
      r = document.createElement("div");
      r.id = "kk-reader";
      r.innerHTML = `<div class="kk-bar"><button type="button" data-action="kk-back"></button><span class="kk-title"></span><button type="button" class="kk-star" data-action="kk-bm-bar" aria-label="ブックマーク"></button></div><div class="kk-views"></div>`;
      document.body.appendChild(r);
      document.body.style.overflow = "hidden";
    }
    return r;
  }
  function kkCloseReader(){
    const r = document.getElementById("kk-reader");
    if(r) r.remove();
    document.body.style.overflow = "";
    kkStack = [];
  }
  function kkUpdateBar(){
    const r = document.getElementById("kk-reader");
    if(!r || !kkStack.length) return;
    const top = kkStack[kkStack.length-1];
    const btn = r.querySelector(".kk-bar button"), title = r.querySelector(".kk-title");
    if(kkStack.length > 1){
      const prev = kkStack[kkStack.length-2];
      btn.textContent = `← 第${prev.n}回にもどる`;
      title.textContent = `今は第${top.n}回を表示中`;
    }else{
      btn.textContent = kkMode === "mistakes" ? "← まちがい集" : "← 一覧";
      title.textContent = `第${top.n}回`;
    }
    const st = r.querySelector(".kk-bar .kk-star"), on = kkBmLoad().includes(Number(top.n));
    st.textContent = on ? "★" : "☆"; st.classList.toggle("on", on); st.setAttribute("aria-pressed", String(on));
  }

  async function kkLoadView(view){
    view.wrap.innerHTML = `<div class="kk-msg">読み込み中...</div>`;
    let html = null;
    try{
      html = await kkFetchText(view.it.file);
      kkCacheSet("body_"+view.it.file, html);
    }catch(e){
      html = kkCacheGet("body_"+view.it.file);
    }
    if(!view.wrap.isConnected) return; // 閉じられた
    if(!html){
      view.wrap.innerHTML = `<div class="kk-msg">読み込めませんでした。 <button type="button" data-action="kk-retry" class="kk-retry">再読み込み</button></div>`;
      return;
    }
    view.wrap.innerHTML = "";
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts"); // allow-same-originは付けない
    f.title = view.it.theme || "国際関係ブリーフ";
    let doc = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, () => KK_HEAD_CSS + "</head>") : KK_HEAD_CSS + html;
    doc = /<\/body>/i.test(doc) ? doc.replace(/<\/body>/i, () => KK_HEAD_JS + "</body>") : doc + KK_HEAD_JS;
    f.srcdoc = doc;
    view.wrap.appendChild(f);
    view.iframe = f;
  }

  function kkPushView(n, opts){
    const it = (kkIndex && kkIndex.items || []).find(x=>String(x.n) === String(n));
    if(!it || it.missing || !it.file){ showToast(`第${n}回は収録がありません`); return false; }
    const r = kkReader();
    const wrap = document.createElement("div");
    wrap.className = "kk-view";
    r.querySelector(".kk-views").appendChild(wrap);
    const view = { n: it.n, it, wrap, iframe: null, restoreY: opts && opts.y || 0, find: opts && opts.find || "", maxPct: 0 };
    kkStack.push(view);
    kkUpdateBar();
    kkLoadView(view);
    return true;
  }
  function kkBack(){
    if(kkStack.length > 1){
      const v = kkStack.pop();
      v.wrap.remove();
      kkUpdateBar();
    }else{
      kkOpen(null);
    }
  }
  // n===null: 閉じて一覧(またはまちがい集)に戻る / 数値: その回を開く(スタックを作り直す)
  function kkOpen(n, opts){
    kkCloseReader();
    if(n === null){ kkRenderView(); return; }
    if(kkPushView(n, opts)){
      // 「最後に読んだ回」は、一覧・検索・まちがい集から開いたときだけ更新する(一時表示では変えない)
      const prev = kkLastLoad();
      kkLastSave({ n: Number(n), y: opts && opts.y || 0, pct: prev && prev.n === Number(n) ? prev.pct || 0 : 0, at: kqNowJst() });
    }
  }

  // ブリーフ本文からのメッセージ
  window.addEventListener("message", e=>{
    const view = kkStack.find(v => v.iframe && v.iframe.contentWindow === e.source);
    const m = e.data;
    if(!view || !m || typeof m !== "object") return;
    if(m.type === "kk-ready"){
      if(view.restoreY) try{ e.source.postMessage({ type: "kk-scroll-to", y: view.restoreY }, "*"); }catch(err){}
      if(view.find) try{ e.source.postMessage({ type: "kk-find", term: view.find }, "*"); }catch(err){}
    }else if(m.type === "kk-scroll"){
      if(kkStack[0] !== view) return;   // 一時表示の位置は記録しない
      const pct = m.max > 0 ? Math.min(100, Math.round(m.y / m.max * 100)) : 100;
      view.maxPct = Math.max(view.maxPct, pct);
      const last = kkLastLoad();
      if(last && last.n === Number(view.n)) kkLastSave({ ...last, y: Math.round(m.y), pct });
      if(view.maxPct >= 60) kkMarkRead(view.n);   // 6割まで読んだら既読
    }else if(m.type === "ready"){
      const results = {};
      const latest = kqLatest(kqLoad());
      Object.keys(latest).forEach(id=>{ if(latest[id].issue === view.n) results[id] = { picked: latest[id].picked }; });
      try{ e.source.postMessage({ type: "state", results }, "*"); }catch(err){}
    }else if(m.type === "openBrief"){
      kkPushView(m.n);
    }else if(m.type === "quiz"){
      if(typeof m.qid !== "string" || typeof m.picked !== "string" || typeof m.ans !== "string") return;
      kqRecord(m.qid, Number(m.issue) || view.n, m.picked, m.ans);
      kkMarkRead(Number(m.issue) || view.n);   // 問題に答えた回も既読
    }
  });

  // 今日のタスクから勉強を始める: タスクの科目・所要時間・題名を引き継いでタイマーを開始し、部屋タブを開く
  function startFromTask(id){
    if(!todayTasksData || !Array.isArray(todayTasksData.tasks)) return;
    const task = todayTasksData.tasks.find(x=>x.id === id);
    if(!task) return;
    if(getActive()){ showToast("いま勉強中です。先に終了してください"); return; }
    const m = Number(task.minutes);
    const minutes = isFinite(m) && m > 0 ? Math.min(600, Math.round(m)) : 30;
    const note = taskParts(task).title.slice(0, 40);
    startSession("qualification", minutes, note, task.subject || "", { date: todayTasksData.date, id: task.id });
    switchTab("room");
  }

  /* ============ 部屋タブの「今日の復習」(国際関係・一問一答の×を間隔をあけて出す) ============ */
  function renderRoomReview(){
    const el = document.getElementById("room-review");
    if(!el) return;
    if(!kkQuestions){
      const c = kkCacheGet("questions");
      if(c){ try{ kkQuestions = JSON.parse(c); }catch(e){} }   // 通信はせず、端末に保存した問題だけで数える
    }
    const dueKk = Math.min(kkDueQuestions().length, KK_REVIEW_MAX), dueIc = Math.min(kkDueIchimon().length, KK_REVIEW_MAX);
    const n = dueKk + dueIc;
    if(!n || getActive()){ el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = `<button type="button" class="kk-review" data-action="room-review"><b>今日の復習</b>　${n}問<span class="kk-sub">国際関係${dueKk}・一問一答${dueIc}（×の問題を、間隔をあけてもう一度）</span></button>`;
  }
  async function openDailyReview(){
    if(!kkQuestions) await kkFetchQuestions();
    if(!icDecks && icLoadState !== "error") await icLoadDecks();
    switchTab("kokusai");
    kkReviewStart();
  }

  /* ============ 今日のタスク(表示・チェックのみ。学習記録とは独立) ============ */
  // タイマー機能・completedUnits・学習記録エクスポートとは一切連動させない。
  // ここでのチェックは「見て、記録するだけ」の別データとして扱う。

  let todayTasksData = null; // {date, isRestDay, tasks} または未取得ならnull
  let todayTasksFetchState = "loading"; // loading | loaded | error

  function taskStatusKey(dateStr){ return "mokumoku_taskStatus_v1_"+dateStr; }
  function loadTaskStatus(dateStr){
    try{
      const raw = localStorage.getItem(taskStatusKey(dateStr));
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveTaskStatus(dateStr, statusMap){
    localStorage.setItem(taskStatusKey(dateStr), JSON.stringify(statusMap));
  }

  async function fetchTodayTasks(){
    todayTasksFetchState = "loading";
    renderTodayTasks();
    try{
      const res = await fetch(TODAY_TASKS_URL + "?_=" + Date.now(), { cache: "no-store" });
      if(!res.ok) throw new Error("http "+res.status);
      todayTasksData = await res.json();
      todayTasksFetchState = "loaded";
    }catch(e){
      todayTasksData = null;
      todayTasksFetchState = "error";
    }
    renderTodayTasks();
  }

  // タスクの文章を、見出し(title)と、箇条書き(details)に分ける。
  // ・details(文字列の配列)があれば、それをそのまま箇条書きにする。
  // ・無ければ、長い文章を「。」で区切り、最初を見出し、残りを箇条書きにする。
  function taskParts(t){
    const raw = String((t && t.text) || "");
    if(Array.isArray(t && t.details)){
      return { title: raw, details: t.details.filter(x => typeof x === "string" && x.trim()).map(x => x.trim()) };
    }
    const parts = raw.split("。").map(x => x.trim()).filter(Boolean);
    if(parts.length <= 1) return { title: raw, details: [] };
    return { title: parts[0], details: parts.slice(1) };
  }

  // "2026-10-16" → "10月16日"。形式が違うときは、そのまま返す。
  function formatMonthDay(dateStr){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr || ""));
    return m ? `${Number(m[2])}月${Number(m[3])}日` : String(dateStr || "");
  }

  // 分 → 「◯分」「◯時間」「◯時間◯分」
  function formatTaskMinutes(m){
    if(m < 60) return `${m}分`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h}時間${r}分` : `${h}時間`;
  }
  // 所要時間の合計・残りを1行で返す。minutesが数値でない/負のタスクは計算から除く。
  function taskTimeLine(tasks, statusMap){
    let total = 0, remain = 0, skipped = false;
    tasks.forEach(t=>{
      const m = t && t.minutes;
      if(typeof m !== "number" || !isFinite(m) || m < 0){ skipped = true; return; }
      const v = Math.round(m);
      total += v;
      if(!statusMap[t.id]) remain += v;
    });
    const allDone = tasks.every(t=>statusMap[t.id]);
    const note = skipped ? ` <small>(時間未設定のタスクあり)</small>` : "";
    if(total === 0 && skipped) return `<div class="task-time-line">${allDone ? "全部完了" : ""}${note}</div>`;
    return `<div class="task-time-line">合計 約${formatTaskMinutes(total)}／${allDone ? "全部完了" : `残り 約${formatTaskMinutes(remain)}`}${note}</div>`;
  }



  function renderTodayTasks(){
    const el = document.getElementById("today-tasks");
    if(!el) return;

    if(todayTasksFetchState === "loading"){
      el.innerHTML = `<p class="config-note">今日のタスクを読み込み中...</p>`;
      return;
    }
    if(todayTasksFetchState === "error" || !todayTasksData){
      el.innerHTML = `
        <p class="config-note">今日のタスクを取得できませんでした。ネットワーク接続を確認してから、もう一度お試しください。</p>
        <button class="btn ghost" data-action="tasks-reload">再読み込み</button>
      `;
      return;
    }
    // 次のタスクが配信されるまでは、最後に届いたタスクを表示し続ける(配信日が今日でなくても隠さない)。
    const isToday = todayTasksData.date === todayStr();
    const carryNote = isToday ? "" : `<p class="config-note" style="margin:0 0 8px;">${esc(formatMonthDay(todayTasksData.date))}に届いたタスクを表示しています。次のタスクが届くまで、このまま表示されます。</p>`;
    if(todayTasksData.isRestDay){
      el.innerHTML = `${carryNote}<div class="big-emoji">🌿</div><p style="text-align:center; font-weight:600;">${isToday ? "今日は休養日です" : "休養日です"}</p>`;
      return;
    }
    const tasks = Array.isArray(todayTasksData.tasks) ? todayTasksData.tasks : [];
    if(tasks.length === 0){
      el.innerHTML = `${carryNote}<p class="config-note">今日のタスクはまだありません。</p>`;
      return;
    }
    const statusMap = loadTaskStatus(todayTasksData.date);
    const doneCount = tasks.filter(t=>statusMap[t.id]).length;
    el.innerHTML = `
      ${carryNote}
      <div class="task-progress-line">${doneCount}/${tasks.length} 完了</div>
      ${taskTimeLine(tasks, statusMap)}
      <div class="task-list">
        ${tasks.map(t=>{
          const { title, details } = taskParts(t);
          return `
          <label class="task-row">
            <input type="checkbox" data-action="task-toggle" data-id="${esc(t.id)}" ${statusMap[t.id] ? "checked" : ""}>
            <div class="task-body">
              <span class="task-text${statusMap[t.id] ? " done" : ""}">${esc(title)}</span>
              ${details.length ? `<ul class="task-details">${details.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>` : ""}
              ${statusMap[t.id] ? "" : `<button type="button" class="task-start" data-action="task-start" data-id="${esc(t.id)}">▶ このタスクで勉強を始める</button>`}
            </div>
            ${t.subject ? `<span class="task-tag">${esc(t.subject)}</span>` : ""}
          </label>`;
        }).join("")}
      </div>
      <p class="config-note" style="margin-top:10px;">ここでのチェックは表示・記録専用です。タイマーの学習記録やコマ数のカウントには影響しません。</p>
    `;
  }

  /* ============ 週の計画・月の計画の概要(Coworkが data/plan.json に書き出す。表示専用) ============ */
  // 形式の例:
  // { "updatedAt": "2026-10-18T06:20:00+09:00",
  //   "week":  { "start": "2026-10-12", "end": "2026-10-18",
  //              "days": [ { "date": "2026-10-12", "items": ["行政学 講義1コマ", "数的処理 解き直し"] },
  //                        { "date": "2026-10-18", "isRestDay": true, "items": [] } ] },
  //   "month": { "month": "2026-10", "goals": ["行政学 完走"], "summary": ["総合論文の論点づくり"],
  //              "weeks": [ { "start": "2026-10-12", "end": "2026-10-18", "focus": "行政学・数的処理", "items": ["…"] } ] } }
  let planData = null;                // 検証済みの {updatedAt, week, month} または null
  let planFetchState = "loading";     // loading | loaded | error

  const strList = v => Array.isArray(v) && v.every(x => typeof x === "string");
  function cleanWeek(w){
    if(!w || !DATE_RE.test(w.start || "") || !DATE_RE.test(w.end || "") || !Array.isArray(w.days)) return null;
    const days = w.days.filter(d => d && DATE_RE.test(d.date || "") && (d.items === undefined || strList(d.items)));
    if(days.length === 0) return null;
    return {
      start: w.start, end: w.end,
      days: days.map(d => ({ date: d.date, isRestDay: d.isRestDay === true, items: (d.items || []).map(x => x.trim()).filter(Boolean) }))
        .sort((a, b) => a.date.localeCompare(b.date)),
    };
  }
  function cleanMonth(m){
    if(!m || !/^\d{4}-\d{2}$/.test(m.month || "")) return null;
    const goals = strList(m.goals || []) ? (m.goals || []).map(x => x.trim()).filter(Boolean) : [];
    const summary = strList(m.summary || []) ? (m.summary || []).map(x => x.trim()).filter(Boolean) : [];
    const weeks = Array.isArray(m.weeks)
      ? m.weeks.filter(x => x && DATE_RE.test(x.start || "") && DATE_RE.test(x.end || "") && typeof x.focus === "string" && (x.items === undefined || strList(x.items)))
          .map(x => ({ start: x.start, end: x.end, focus: x.focus.trim(), items: (x.items || []).map(i => i.trim()).filter(Boolean) }))
          .sort((a, b) => a.start.localeCompare(b.start))
      : [];
    if(goals.length === 0 && summary.length === 0 && weeks.length === 0) return null;
    return { month: m.month, goals, summary, weeks };
  }
  function cleanPlan(d){
    if(!d || typeof d !== "object" || typeof d.updatedAt !== "string" || Number.isNaN(Date.parse(d.updatedAt))) return null;
    const week = cleanWeek(d.week), month = cleanMonth(d.month);
    return (week || month) ? { updatedAt: d.updatedAt, week, month } : null;
  }

  async function fetchPlan(){
    planFetchState = planData ? "loaded" : "loading"; // 表示済みのときは、読み込み中の表示に戻さない
    renderPlans();
    try{
      const res = await fetch(PLAN_URL + "?_=" + Date.now(), { cache: "no-store" });
      if(!res.ok) throw new Error("http " + res.status);
      planData = cleanPlan(await res.json());
      planFetchState = "loaded";
    }catch(e){
      planData = null;
      planFetchState = "error";
    }
    renderPlans();
  }

  function weekdayJa(dateStr){
    return ["日","月","火","水","木","金","土"][new Date(dateStr + "T00:00:00").getDay()];
  }
  function shortMd(dateStr){
    const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(dateStr);
    return m ? `${Number(m[1])}/${Number(m[2])}` : dateStr;
  }
  function planUpdatedLabel(){
    const d = new Date(planData.updatedAt);
    return `${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}更新`;
  }
  function bulletList(items){
    return items.length ? `<ul class="plan-list">${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>` : "";
  }
  function planEmptyHtml(label){
    if(planFetchState === "loading") return `<p class="config-note">${label}を読み込み中...</p>`;
    return `
      <p class="config-note">${label}は、まだ届いていません。</p>
      <button class="btn ghost" data-action="plan-reload">再読み込み</button>`;
  }

  function renderWeekPlan(){
    const el = document.getElementById("plan-week");
    if(!el) return;
    if(!planData || !planData.week){ el.innerHTML = planEmptyHtml("今週の計画"); return; }
    const w = planData.week, today = todayStr();
    const inRange = today >= w.start && today <= w.end;
    el.innerHTML = `
      <div class="plan-head">${esc(shortMd(w.start))}〜${esc(shortMd(w.end))} の計画</div>
      <p class="plan-note">${esc(planUpdatedLabel())}${inRange ? "" : "。今週の分ではありません。次の計画が届くまで、このまま表示しています。"}</p>
      ${w.days.map(d => `
        <div class="plan-day${d.date === today ? " today" : ""}${d.date < today ? " past" : ""}">
          <div class="plan-day-head"><span>${esc(shortMd(d.date))}（${weekdayJa(d.date)}）</span>${d.date === today ? `<span class="plan-today-tag">今日</span>` : ""}</div>
          ${d.isRestDay ? `<p class="plan-rest">休養日</p>` : (d.items.length ? bulletList(d.items) : `<p class="plan-rest">予定なし</p>`)}
        </div>`).join("")}`;
  }

  function renderMonthPlan(){
    const el = document.getElementById("plan-month");
    if(!el) return;
    if(!planData || !planData.month){ el.innerHTML = planEmptyHtml("今月の計画"); return; }
    const m = planData.month, today = todayStr();
    const [y, mo] = m.month.split("-").map(Number);
    const isThisMonth = m.month === today.slice(0, 7);
    el.innerHTML = `
      <div class="plan-head">${y}年${mo}月の計画</div>
      <p class="plan-note">${esc(planUpdatedLabel())}${isThisMonth ? "" : "。今月の分ではありません。次の計画が届くまで、このまま表示しています。"}</p>
      ${m.goals.length ? `<div class="plan-title">今月の目標</div>${bulletList(m.goals)}` : ""}
      ${m.summary.length ? `<div class="plan-title">概要</div>${bulletList(m.summary)}` : ""}
      ${m.weeks.length ? `<div class="plan-title">週ごとの重点</div>${m.weeks.map(x => {
        const now = today >= x.start && today <= x.end;
        return `
        <div class="plan-day${now ? " today" : ""}${x.end < today ? " past" : ""}">
          <div class="plan-day-head"><span>${esc(shortMd(x.start))}〜${esc(shortMd(x.end))}</span>${now ? `<span class="plan-today-tag">今週</span>` : ""}</div>
          ${x.focus ? `<p class="plan-rest" style="color:var(--ink);">${esc(x.focus)}</p>` : ""}
          ${bulletList(x.items)}
        </div>`;
      }).join("")}` : ""}`;
  }

  function loadTaskView(){
    try{
      const v = localStorage.getItem(STORAGE.TASKVIEW);
      return v === "week" || v === "month" ? v : "today";
    }catch(e){ return "today"; }
  }
  let taskView = loadTaskView();

  function renderPlans(){
    renderWeekPlan();
    renderMonthPlan();
  }
  // 「今日／今週／今月」の切り替え。保存ボタンのカードは、どの表示でも出したままにする。
  function renderTaskViews(){
    const chips = document.getElementById("task-view-chips");
    if(chips){
      chips.innerHTML = [["today","今日"],["week","今週"],["month","今月"]].map(([v, label]) =>
        `<button type="button" class="chip${taskView === v ? " selected" : ""}" data-action="task-view" data-view="${v}" aria-pressed="${taskView === v ? "true" : "false"}">${label}</button>`
      ).join("");
    }
    const show = (id, on) => { const el = document.getElementById(id); if(el) el.classList.toggle("view-hidden", !on); };
    show("today-tasks", taskView === "today");
    show("plan-week", taskView === "week");
    show("plan-month", taskView === "month");
  }
  function setTaskView(v){
    taskView = v;
    try{ localStorage.setItem(STORAGE.TASKVIEW, v); }catch(e){}
    renderTaskViews();
  }

  // 「GitHubに保存」ボタン(タスクタブ)。学習記録とタスクのチェック状態を、1回の操作でまとめて保存する。
  let githubSaving = false;

  // 学習が終わったら、自動でGitHubに保存する(ボタンの押し忘れで、Coworkに記録が届かないのを防ぐ)。初期はオン。
  function autoSaveEnabled(){
    try{ return localStorage.getItem(STORAGE.AUTOSAVE) !== "0"; }catch(e){ return true; }
  }
  function maybeAutoSave(){
    if(!autoSaveEnabled()) return;
    if(!localStorage.getItem(STORAGE.GH_TOKEN)) return;  // トークン未設定なら何もしない
    if(githubAuthFailed) return;                         // トークンが無効と分かっている間は、繰り返さない
    if(typeof navigator !== "undefined" && navigator.onLine === false) return;
    saveAllToGitHub();
  }

  function renderGithubSaveCard(){
    const el = document.getElementById("github-save-card");
    if(!el) return;
    const token = localStorage.getItem(STORAGE.GH_TOKEN);
    if(!token){
      el.innerHTML = `
        <h2>GitHubに保存</h2>
        <p class="config-note">学習記録とタスクのチェックをGitHubに保存するには、データタブの「GitHub連携」でトークンを設定してください。</p>
        <p class="config-note"><a href="${GITHUB_TOKEN_NEW_URL}" target="_blank" rel="noopener">トークンの発行ページを開く（GitHub）</a></p>`;
      return;
    }
    const authNotice = githubAuthFailed ? `
      <div class="shared-state error">トークンが無効です。有効期限が切れた可能性があります。</div>
      <p class="config-note">データタブの「GitHub連携」で、トークンを作り直して入れ替えてください。</p>
      <a class="btn ghost block" href="${GITHUB_TOKEN_NEW_URL}" target="_blank" rel="noopener" style="display:block; text-align:center; text-decoration:none; margin-bottom:10px;">トークンの発行ページを開く（GitHub）</a>
    ` : "";
    el.innerHTML = `
      <h2>GitHubに保存</h2>
      ${authNotice}
      <button class="btn primary block" id="btn-github-save" data-action="github-save" ${githubSaving ? "disabled" : ""}>${githubSaving ? "保存中..." : "GitHubに保存"}</button>
      <label class="shared-check" style="margin:10px 0 0;"><input type="checkbox" id="autosave-check" data-action="autosave-toggle" ${autoSaveEnabled() ? "checked" : ""}>学習が終わったら、自動で保存する</label>
      <p class="config-note" style="margin-top:8px;">学習記録（<code>${esc(GITHUB_SYNC.path)}</code>）と、タスクのチェック状態（<code>${esc(TODAY_TASKS_STATUS_PATH)}</code>）を、まとめて保存します。学習したあとに、1回押してください。</p>`;
  }

  // 学習記録(既存の記録と統合してから書き込む)と、タスクのチェック状態(配信されたタスクがあるときだけ)を保存する。
  async function saveAllToGitHub(){
    if(githubSaving) return;
    githubSaving = true;
    renderGithubSaveCard();
    syncSet("all", "saving", saveAllToGitHub);
    let recordsSaved = false;
    try{
      const { payload, fromRemote } = await buildMergedExport();
      const now = new Date();
      await putJsonToGitHub(GITHUB_SYNC.path, JSON.stringify(payload, null, 2),
        `もくもく部屋: エクスポート更新 ${dateKey(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`);
      recordsSaved = true;
      if(fromRemote > 0){
        // 他の端末の記録をこの端末にも取り込み、どの端末でも同じ進捗になるようにする
        saveRecords(payload.records.map(r=>({ ...r })));
        render();
      }
      let taskSaved = false;
      if(todayTasksData && todayTasksData.date){
        const date = todayTasksData.date;
        const statusMap = loadTaskStatus(date);
        const checkedTaskIds = Object.keys(statusMap).filter(id=>statusMap[id]);
        await putJsonToGitHub(TODAY_TASKS_STATUS_PATH,
          JSON.stringify({ date, checkedTaskIds, updatedAt: new Date().toISOString() }, null, 2),
          `もくもく部屋: 今日のタスクのチェック状態を更新 ${date}`);
        taskSaved = true;
      }
      const parts = ["学習記録"];
      if(fromRemote > 0) parts.push(`他の端末の記録${fromRemote}件を統合`);
      if(taskSaved) parts.push("タスクのチェック");
      showToast(`GitHubに保存しました（${parts.join("・")}）`);
      syncSet("all", "ok");
    }catch(err){
      syncSet("all", "error", saveAllToGitHub);
      const msg = err && err.message ? err.message : "GitHubへの保存に失敗しました(通信エラー)";
      showToast(recordsSaved ? `学習記録は保存しました。タスクのチェックの保存に失敗しました（${msg}）` : msg);
    }finally{
      githubSaving = false;
      renderGithubSaveCard();
    }
  }

  /* ============ 書き出し / 読み込み ============ */

  function normalizeExportRecord(r){
    return {
      ...r,
      subject: typeof r.subject === "string" ? r.subject : "",
      completedUnits: Number.isInteger(r.completedUnits) && r.completedUnits >= 0 ? r.completedUnits : 0,
      reviewTags: orderedReviewTags(r.reviewTags)
    };
  }
  function buildExportPayload(){
    const records = loadRecords().map(normalizeExportRecord);
    return { version:1, exportedAt:new Date().toISOString(), records };
  }

  // 端末で削除した記録のID。GitHubに保存するとき、統合の対象から外すために覚えておく。
  function loadDeletedIds(){
    try{
      const v = JSON.parse(localStorage.getItem(STORAGE.DELETED)||"[]");
      return new Set(Array.isArray(v) ? v.filter(x=>typeof x === "string") : []);
    }catch(e){ return new Set(); }
  }
  function rememberDeletedId(id){
    try{
      const ids = loadDeletedIds(); ids.add(id);
      localStorage.setItem(STORAGE.DELETED, JSON.stringify([...ids]));
    }catch(e){}
  }

  // GitHub上の既存の書き出しと、この端末の記録を、IDで重複なく統合する。
  // 記録の少ない端末(新しいURLのアプリなど)で保存しても、他の端末の過去の記録を消さないため。
  // 同じIDなら端末側を優先し、端末で削除した記録は統合しない。
  async function buildMergedExport(){
    const token = requireGithubToken();
    const local = buildExportPayload();
    const remote = await getGithubJsonFile(GITHUB_SYNC.path, token);
    const remoteList = remote && Array.isArray(remote.records) ? remote.records : [];
    const deleted = loadDeletedIds();
    const byId = new Map();
    remoteList.forEach(r=>{
      if(isValidImportRecord(r) && !deleted.has(r.id)) byId.set(r.id, normalizeExportRecord(r));
    });
    const localIds = new Set(local.records.map(r=>r.id));
    const fromRemote = [...byId.keys()].filter(id=>!localIds.has(id)).length;
    local.records.forEach(r=>byId.set(r.id, r));
    const records = [...byId.values()].sort((a,b)=>String(a.startedAt).localeCompare(String(b.startedAt)));
    return { payload: { ...local, records }, fromRemote };
  }


  /* ============ GitHub連携 ============ */

  function utf8ToBase64(str){
    const bytes = new TextEncoder().encode(str);
    let binary = "";
    bytes.forEach(b => { binary += String.fromCharCode(b); });
    return btoa(binary);
  }

  // トークンの発行ページ(名前・期限365日・Contents権限を入力済みで開く)。対象リポジトリはリンクでは指定できない。
  const GITHUB_TOKEN_NEW_URL = "https://github.com/settings/personal-access-tokens/new?name=mokumoku-app&description="
    + encodeURIComponent("もくもく部屋アプリ") + "&expires_in=365&contents=write";
  // 認証に失敗した(トークンが無効・期限切れ)と分かったら立てる。設定画面に作り直しの案内を出すために使う。
  let githubAuthFailed = false;

  async function githubErrorFromResponse(res){
    let detail = "";
    try{ const j = await res.json(); detail = j.message || ""; }catch(e){}
    if(res.status === 401){
      githubAuthFailed = true;
      renderGithubSettings();
      return new Error("トークンが無効です（期限切れの可能性）。データタブの案内で作り直してください");
    }
    if(res.status === 403) return new Error("権限が不足しています(Contents: Read and writeの権限があるか確認してください)");
    if(res.status === 404) return new Error("リポジトリまたはパスが見つかりません(owner/repo/branchの設定値を確認してください)");
    return new Error("GitHubへの保存に失敗しました" + (detail ? "（"+detail+"）" : ""));
  }

  function requireGithubToken(){
    const token = localStorage.getItem(STORAGE.GH_TOKEN);
    if(!token) throw new Error("先にGitHubトークンを設定してください");
    return token;
  }
  function githubHeaders(token){
    return {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
    };
  }
  function githubContentsUrl(path){
    return `https://api.github.com/repos/${GITHUB_SYNC.owner}/${GITHUB_SYNC.repo}/contents/${path}`;
  }

  // 指定パスの現在のsha(なければundefined)を取得する。404以外の失敗はエラーを投げる。
  async function getGithubSha(path, token){
    let res;
    try{
      res = await fetch(`${githubContentsUrl(path)}?ref=${encodeURIComponent(GITHUB_SYNC.branch)}`, { headers: githubHeaders(token) });
    }catch(networkErr){
      throw new Error("通信エラーが発生しました。ネットワーク接続を確認してください");
    }
    if(res.status === 200){
      const data = await res.json();
      return data.sha;
    }
    if(res.status === 404) return undefined;
    throw await githubErrorFromResponse(res);
  }

  // 指定パスのファイル内容をJSONとして取得する。存在しない場合はnullを返す。
  async function getGithubJsonFile(path, token){
    let res;
    try{
      res = await fetch(`${githubContentsUrl(path)}?ref=${encodeURIComponent(GITHUB_SYNC.branch)}`, { headers: githubHeaders(token) });
    }catch(networkErr){
      throw new Error("通信エラーが発生しました。ネットワーク接続を確認してください");
    }
    if(res.status === 404) return null;
    if(res.status !== 200) throw await githubErrorFromResponse(res);
    const data = await res.json();
    try{
      const binary = atob((data.content || "").replace(/\n/g, ""));
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }catch(parseErr){
      return null;
    }
  }

  // GitHubリポジトリの指定パスに、sha取得→PUTのパターンでコンテンツ(base64)を直接コミットする共通処理。
  // GitHubへの書き込みは、同じブランチに同時に2つ書くと、別のファイルでも「ブランチが動いた」と競合して失敗する。
  // そこで、すべての書き込みを1本の列に並べて1つずつ行い、競合(409/422)したら、読み直して数回やり直す。
  let ghChain = Promise.resolve();
  function ghSerial(fn){
    const run = ghChain.then(fn, fn);
    ghChain = run.catch(()=>{});
    return run;
  }
  const GH_PUT_RETRIES = 4;
  async function putContentToGitHub(path, base64Content, commitMessage){
    const token = requireGithubToken();
    return ghSerial(async () => {
      for(let attempt = 0; attempt < GH_PUT_RETRIES; attempt++){
        if(attempt > 0) await new Promise(r => setTimeout(r, 700 * attempt));
        const sha = await getGithubSha(path, token);
        const putBody = { message: commitMessage, content: base64Content, branch: GITHUB_SYNC.branch };
        if(sha) putBody.sha = sha;
        let putRes;
        try{
          putRes = await fetch(githubContentsUrl(path), {
            method: "PUT",
            headers: { ...githubHeaders(token), "Content-Type": "application/json" },
            body: JSON.stringify(putBody),
          });
        }catch(networkErr){
          throw new Error("通信エラーが発生しました。ネットワーク接続を確認してください");
        }
        if(putRes.status === 200 || putRes.status === 201) return;
        if((putRes.status === 409 || putRes.status === 422) && attempt < GH_PUT_RETRIES - 1) continue;   // 競合: 読み直してやり直す
        throw await githubErrorFromResponse(putRes);
      }
    });
  }

  // JSON文字列をUTF-8→base64にしてputContentToGitHubに渡す薄いラッパー。
  // エクスポート保存・今日のタスクのチェック状態保存・予定写真のメタ情報保存から使う。
  async function putJsonToGitHub(path, jsonStr, commitMessage){
    return putContentToGitHub(path, utf8ToBase64(jsonStr), commitMessage);
  }

  // 指定パスのファイルを削除する。もともと存在しない場合(sha取得できない)は何もしない。
  async function deleteGithubFile(path, commitMessage){
    const token = requireGithubToken();
    const sha = await getGithubSha(path, token);
    if(!sha) return;

    let res;
    try{
      res = await fetch(githubContentsUrl(path), {
        method: "DELETE",
        headers: { ...githubHeaders(token), "Content-Type": "application/json" },
        body: JSON.stringify({ message: commitMessage, sha, branch: GITHUB_SYNC.branch }),
      });
    }catch(networkErr){
      throw new Error("通信エラーが発生しました。ネットワーク接続を確認してください");
    }
    if(res.status !== 200){
      throw await githubErrorFromResponse(res);
    }
  }

  /* ============ 履修・バイト予定の写真登録(表示・チェック機能とも学習記録とも独立) ============ */
  // タイマー機能・学習記録・completedUnits・今日のタスク機能とは一切連動しない。
  // 画像の内容はこのアプリでは解析せず、GitHubに保存するだけ。

  let scheduleFiles = [];      // File[] (最大MAX_SCHEDULE_PHOTOS枚、選択中の下書き)
  let scheduleThumbUrls = [];  // scheduleFilesに対応するobject URL(プレビュー用)

  function scheduleExtOf(filename){
    const m = /\.([a-zA-Z0-9]+)$/.exec(filename || "");
    return m ? m[1].toLowerCase() : "jpg";
  }
  function schedulePhotoSlotOf(path){
    const m = /photo_(\d+)\.[^./]+$/.exec(path || "");
    return m ? Number(m[1]) : null;
  }
  function readFileAsDataUrl(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(new Error("ファイルの読み込みに失敗しました"));
      reader.readAsDataURL(file);
    });
  }
  function base64OfDataUrl(dataUrl){
    const idx = dataUrl.indexOf(",");
    return idx >= 0 ? dataUrl.slice(idx + 1) : dataUrl;
  }
  function loadImageElement(dataUrl){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("画像の読み込みに失敗しました"));
      img.src = dataUrl;
    });
  }

  // スマホの実写真(数MB〜十数MB)をそのままbase64化するとGitHub Contents APIへの
  // 送信に時間がかかり、体感上「反応しない」ように見えるため、一定サイズを超える
  // 画像だけcanvasで縮小・JPEG再エンコードしてから保存する。小さい画像は無加工のまま。
  const SCHEDULE_PHOTO_RESIZE_THRESHOLD = 900 * 1024; // 900KB
  const SCHEDULE_PHOTO_MAX_DIMENSION = 1600;
  const SCHEDULE_PHOTO_TARGET_BASE64_LENGTH = 1_300_000; // base64文字数の目安上限

  async function prepareSchedulePhoto(file){
    if(file.size <= SCHEDULE_PHOTO_RESIZE_THRESHOLD){
      const dataUrl = await readFileAsDataUrl(file);
      return { base64: base64OfDataUrl(dataUrl), ext: scheduleExtOf(file.name) };
    }
    const dataUrl = await readFileAsDataUrl(file);
    const img = await loadImageElement(dataUrl);
    let { width, height } = img;
    if(width > SCHEDULE_PHOTO_MAX_DIMENSION || height > SCHEDULE_PHOTO_MAX_DIMENSION){
      const scale = SCHEDULE_PHOTO_MAX_DIMENSION / Math.max(width, height);
      width = Math.round(width * scale);
      height = Math.round(height * scale);
    }
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, width, height);

    let quality = 0.82;
    let outUrl = canvas.toDataURL("image/jpeg", quality);
    while(outUrl.length > SCHEDULE_PHOTO_TARGET_BASE64_LENGTH && quality > 0.4){
      quality -= 0.12;
      outUrl = canvas.toDataURL("image/jpeg", quality);
    }
    return { base64: base64OfDataUrl(outUrl), ext: "jpg" };
  }

  function clearScheduleThumbUrls(){
    scheduleThumbUrls.forEach(u => URL.revokeObjectURL(u));
    scheduleThumbUrls = [];
  }

  function renderScheduleThumbs(){
    const el = document.getElementById("schedule-thumbs");
    if(!el) return;
    el.innerHTML = scheduleFiles.map((f, i) => `
      <div class="schedule-thumb">
        <img src="${scheduleThumbUrls[i]}" alt="${esc(f.name)}">
        <button type="button" class="thumb-remove" data-action="schedule-remove" data-idx="${i}" aria-label="削除">✕</button>
      </div>
    `).join("");
  }

  function renderSchedulePhotos(){
    const el = document.getElementById("schedule-photos");
    if(!el) return;
    const token = localStorage.getItem(STORAGE.GH_TOKEN);
    el.innerHTML = `
      <p class="config-note">後期の履修表・アルバイトのシフト表の写真を登録すると、週間の学習計画作りに活用されます（画像の内容はこのアプリでは解析しません）。履修表・シフト表をまとめて、最大${MAX_SCHEDULE_PHOTOS}枚まで登録できます。</p>
      <input type="file" id="schedule-file-input" accept="image/*" multiple>
      <div class="schedule-thumbs" id="schedule-thumbs"></div>
      <button class="btn primary block" id="btn-schedule-register" data-action="schedule-register" style="margin-top:10px;" ${scheduleFiles.length === 0 ? "disabled" : ""}>登録する</button>
      ${!token ? `<p class="config-note" style="margin-top:8px;">GitHubに保存するには、上の「GitHub連携」でトークンを設定してください。</p>` : ""}
      <div id="schedule-feedback" style="margin-top:10px;"></div>
    `;
    renderScheduleThumbs();
  }

  async function registerSchedulePhotos(){
    if(scheduleFiles.length === 0){
      showToast("写真を選択してください");
      return;
    }
    const btn = document.getElementById("btn-schedule-register");
    const input = document.getElementById("schedule-file-input");
    const feedback = document.getElementById("schedule-feedback");
    showToast("登録を開始します...");
    if(btn){ btn.disabled = true; btn.textContent = "登録中..."; }
    if(input) input.disabled = true;
    if(feedback) feedback.innerHTML = "";

    try{
      const token = requireGithubToken();

      // 前回登録時のファイル一覧を把握し、今回使わなくなったスロットを判定する
      const prevMeta = await getGithubJsonFile(SCHEDULE_META_PATH, token);
      const previousPaths = (prevMeta && Array.isArray(prevMeta.imagePaths)) ? prevMeta.imagePaths : [];

      const uploadedPaths = [];
      for(let i = 0; i < scheduleFiles.length; i++){
        if(btn) btn.textContent = `アップロード中 (${i + 1}/${scheduleFiles.length})...`;
        const file = scheduleFiles[i];
        const { base64, ext } = await prepareSchedulePhoto(file);
        const path = `${SCHEDULE_PHOTO_DIR}/photo_${i + 1}.${ext}`;
        await putContentToGitHub(path, base64, `もくもく部屋: 予定写真を更新 photo_${i + 1}`);
        uploadedPaths.push(path);
      }

      // 今回使わなかったスロット・拡張子が変わって不要になった古いファイルを削除
      const toDelete = previousPaths.filter(p => !uploadedPaths.includes(p) && schedulePhotoSlotOf(p) !== null);
      for(const p of toDelete){
        try{
          await deleteGithubFile(p, `もくもく部屋: 不要になった予定写真を削除 ${p}`);
        }catch(deleteErr){
          // 個別ファイルの削除失敗は致命的ではないため、登録処理自体は続行する
        }
      }

      // メタ情報は最後に保存する(これが「新しい登録があったか」を他の仕組みが判定する唯一の目印のため)
      const meta = {
        uploadedAt: new Date().toISOString(),
        imageCount: scheduleFiles.length,
        imagePaths: uploadedPaths,
      };
      await putJsonToGitHub(SCHEDULE_META_PATH, JSON.stringify(meta, null, 2), "もくもく部屋: 予定写真のメタ情報を更新");

      clearScheduleThumbUrls();
      scheduleFiles = [];
      if(input) input.value = "";
      renderScheduleThumbs();
      if(feedback) feedback.innerHTML = `<p class="config-note" style="color:var(--green); font-weight:600;">予定を登録しました。次回の週間計画に反映されます。</p>`;
      if(btn){ btn.disabled = true; btn.textContent = "登録する"; }
      showToast("予定を登録しました");
    }catch(err){
      const message = (err && err.message) ? err.message : "登録に失敗しました。もう一度お試しください。";
      if(feedback){
        feedback.innerHTML = `<p class="config-note" style="color:var(--danger); font-weight:600;">${esc(message)}</p>`;
      }
      if(btn){ btn.disabled = false; btn.textContent = "登録する"; }
      showToast(message);
    }finally{
      if(input) input.disabled = false;
    }
  }

  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  function isValidImportRecord(r){
    return r && typeof r.id === "string" && r.id
      && typeof r.date === "string" && DATE_RE.test(r.date)
      && (r.type === "assignment" || r.type === "qualification")
      && typeof r.plannedMinutes === "number" && Number.isFinite(r.plannedMinutes) && r.plannedMinutes > 0
      && typeof r.actualMinutes === "number" && Number.isFinite(r.actualMinutes) && r.actualMinutes >= 0
      && typeof r.startedAt === "string" && typeof r.endedAt === "string"
      && (r.note === undefined || typeof r.note === "string")
      && (r.subject === undefined || typeof r.subject === "string")
      && (r.completedUnits === undefined || (Number.isInteger(r.completedUnits) && r.completedUnits >= 0))
      && (r.reviewTags === undefined || (Array.isArray(r.reviewTags) && r.reviewTags.every(t=>typeof t === "string")));
  }

  document.body.addEventListener("click", e=>{

        finalSubject = pending.subject === "__custom__" ? pending.subjectCustom.trim() : pending.subject;
      }
      startSession(pending.type, pending.minutes, pending.note, finalSubject);
    } else if(action==="stop-session"){
      finishSession();
    } else if(action==="close-modal"){

    } else if(action==="units-inc"){
      modalUnitsValue += 1;
      const el2 = document.getElementById("units-value");

    } else if(action==="hist-toggle"){

      modalReviewOn = !modalReviewOn;

  function tick(){
    const active = getActive();
    if(!active || currentTab !== "room") return;
    const clockEl = document.getElementById("timer-clock");
    if(!clockEl) return;
    const plannedSec = active.plannedMinutes*60;
    const elapsedSec = (Date.now()-active.startedAt)/1000;
    const remainSec = plannedSec - elapsedSec;
    const ring = clockEl.closest(".timer-ring");
    const labelEl = document.getElementById("timer-label");
    if(remainSec > 0){
      clockEl.textContent = formatClock(remainSec);
      if(labelEl) labelEl.textContent = "残り時間";
      if(ring){
        ring.classList.remove("overtime");
        ring.style.setProperty("--pct", (elapsedSec/plannedSec)*100);
      }
    } else {
      clockEl.textContent = "+"+formatClock(elapsedSec-plannedSec);
      if(labelEl) labelEl.textContent = "目標達成、延長中";
      if(ring){
        ring.classList.add("overtime");
        ring.style.setProperty("--pct", 100);
      }
    }
  }

      const ctx = c.getContext("2d");
      const r = 34;
      ctx.fillStyle = "#2b6a73";
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.arcTo(size,0,size,size,r); ctx.arcTo(size,size,0,size,r);
      ctx.arcTo(0,size,0,0,r); ctx.arcTo(0,0,size,0,r);
      ctx.closePath(); ctx.fill();
      ctx.font = "96px sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("📚", size/2, size/2+8);
      const url = c.toDataURL("image/png");
